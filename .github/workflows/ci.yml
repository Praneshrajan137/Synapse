name: SYNAPSE CI
on:
  push:
    branches: [main, develop, "sprint-*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "plans/**"
      - "notebooks/**"
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    name: Lint + Type Check + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r packages/requirements.txt -r packages/requirements-dev.txt
          # Install synapse_common as an editable package so `import
          # synapse_common.*` resolves in the unit-test step (orchestrator/tests
          # conftest imports it). pytest's pythonpath=["."] does not expose
          # packages/synapse_common, and the contracts job already relies on this
          # editable install — mirror it here.
          pip install -e packages/
          pip install -r orchestrator/requirements.txt
          pip install jsonschema pyyaml
          # Sprint 13 §Phase 1.3: install agent deps so agents/*/tests/ can be collected
          # alongside packages/ and orchestrator/ in one gated pytest run.
          for req in agents/*/requirements.txt; do pip install -r "$req"; done
          # Plan v2 §Phase 4: deps for the newly-gated trees (digital_twin needs
          # simpy; api tests use the FastAPI TestClient + async SQLAlchemy stack;
          # orchestrator SSE handlers need sse-starlette). simpy lives in the
          # sprint-3 bundle which the agents/*/ glob above does NOT match.
          pip install simpy sse-starlette
          pip install -r agents/requirements-sprint3.txt
          # mypy imports `pathspec.patterns.gitignore` (pathspec>=0.10.0). One of
          # the requirement sets above transitively pins an older pathspec, which
          # makes mypy crash on import. Force the compatible version LAST so it
          # cannot be downgraded before the MyPy steps run.
          pip install --upgrade "pathspec>=0.12.1"
          # fastapi 0.111.0 passes `on_startup` to starlette's Router (removed in
          # starlette 0.38). `sse-starlette` above pulls a newer starlette that
          # re-breaks api/ imports despite the orchestrator pin. Force the
          # compatible starlette LAST so api/tests collect. (`!=` keeps pip from
          # also yanking fastapi.)
          pip install "starlette>=0.37.2,<0.38.0"
          # api/ handlers lazily `import psycopg2` inside their DB try-blocks.
          # Without the driver the import raises before the POSTGRES_DSN
          # fail-fast, so api/tests/test_decisions_auth.py sees "No module named
          # 'psycopg2'" instead of the expected "POSTGRES_DSN not configured".
          # psycopg2-binary is the dev/test variant (E-S5-09).
          pip install psycopg2-binary
      - name: Ruff lint
        run: ruff check packages/synapse_common/ agents/ orchestrator/ --output-format=github
      - name: Ruff format check
        run: ruff format --check packages/synapse_common/ agents/ orchestrator/
      - name: MyPy strict type check (packages — blocking)
        run: mypy --strict packages/synapse_common/
      - name: MyPy strict type check (orchestrator — blocking)
        run: mypy --strict orchestrator/ --exclude orchestrator/tests
      - name: MyPy strict type check (agents — informational, target=blocking)
        # TODO(R5): flip continue-on-error to false once all agents are clean.
        # Tracked in plans/now-we-have-completed-joyful-goose.md (R5).
        continue-on-error: true
        run: mypy --strict agents/ --exclude 'agents/.*/tests' --exclude 'agents/.*/training'
      - name: Schema validation
        run: python scripts/validate_schemas.py
      - name: Spec validation
        run: |
          for spec in $(find agents/ -name "spec.yaml" 2>/dev/null); do
            python -c "
          import yaml, json, jsonschema
          spec=yaml.safe_load(open('$spec'))
          schema=json.load(open('docs/specs/agent_spec_schema.json'))
          jsonschema.validate(spec, schema)
          print('OK $spec')
          "
          done
      - name: License audit (I-1 — ADVISORY, non-blocking)
        # Honest label: the trailing `|| true` makes this informational, not a
        # gate. pip-licenses' classifier strings are noisy across the full dep
        # tree, so a hard failure here would be flaky. The BLOCKING I-1
        # enforcement is the paid-API-import grep in the next step.
        run: |
          pip install pip-licenses
          pip-licenses --allow-only="MIT;Apache-2.0;Apache Software License;BSD-2-Clause;BSD-3-Clause;PSF;Python Software Foundation License;ISC;MPL-2.0;BSD License" || true
      - name: No paid API imports (I-1 — BLOCKING)
        # The real I-1 gate. Scoped to EVERY Python source tree (not just
        # agents/orchestrator/packages — api/, digital_twin/, data_fabric/,
        # ml_pipelines/ and scripts/ were previously unscanned) and now also
        # catches `replicate` (the 4th paid client named in CLAUDE.md I-1).
        run: |
          if grep -rn "import openai\|from openai\|import anthropic\|from anthropic\|import cohere\|from cohere\|import replicate\|from replicate" \
              agents/ orchestrator/ packages/ api/ digital_twin/ data_fabric/ ml_pipelines/ scripts/; then
            echo "Paid API import detected — violates I-1"
            exit 1
          fi
          echo "No paid API imports found"
      - name: Reward isolation check (I-2)
        run: |
          for f in $(find agents/ -name "rewards.py"); do
            agent_dir=$(echo $f | cut -d'/' -f2)
            if grep -n "from agents\." "$f" | grep -v "from agents.$agent_dir"; then
              echo "$f: Cross-agent import violates I-2"
              exit 1
            fi
          done
          echo "Reward isolation verified"
      - name: Substance gap gate (Plan v2 ADR-040 — no synthetic shortcuts)
        # Blocks any agent inference pipeline that reintroduces the
        # guard-then-ignore / hardcoded-confidence / random-model-input
        # anti-patterns. Pure stdlib (AST) — no ML deps required.
        run: python -m scripts.audit.substance_truth --check
      - name: Intelligence gates — static (ADR-042 C37/C39/C41, AST-only)
        # Pure stdlib AST gates: no model ever returns the pipeline_validated
        # sentinel / builds an un-stepped optimizer (C37); serve.py wiring does
        # not regress below baseline (C39); a real-path confidence_basis stamp
        # always matches the computed basis (C41). The runtime gates C38/C40
        # (checkpoint + calibration) need trained artifacts and run in the
        # separate training-smoke job below.
        run: |
          python -m scripts.audit.training_truth --check
          python -m scripts.audit.serving_truth --check
          python -m scripts.audit.confidence_basis_truth --check
      - name: Narrative-truth gate (docs match mechanical reality — C56)
        # Pins CLAUDE.md's load-bearing numbers/cadence claims to their source
        # (spec-coverage --threshold, deploy cadence) so the narrative cannot
        # silently drift from what the gates enforce. Pure stdlib (regex).
        run: python -m scripts.audit.doc_truth --check
      - name: Golden-trace replay metrics (R7.6/R7.7 — KV-cache + tier routing)
        # The two numbers CLAUDE.md has stated since Sprint 9 with NO gate anywhere:
        # KV-cache hit rate 0.70 and tier-routing accuracy 0.80. Both floors are read
        # from infrastructure/quality/replay-floors.yaml (never hardcoded) and measured
        # by replaying the 200 golden traces (seed 0xCAFEBABE) through the existing
        # tests/eval harness. Exit 1 below floor, exit 2 when a metric has no
        # measurement behind it — an unavailable is never a pass (I-7). Replaying 200
        # traces is a CI workload; I-0 keeps it off the development laptop.
        run: |
          python -m scripts.audit.replay_metrics --check \
            --out build/audit/replay-metrics.json
      - name: Unit tests (all gated trees, branch coverage on)
        # Sprint 13 §Phase 1.3 + 2 / Plan v2 §Phase 4: single pytest run across
        # packages/tests, agents/, orchestrator/, digital_twin/, api/ with branch
        # coverage enabled. The global --cov-fail-under was removed — the
        # mechanical gate is per-package via scripts/coverage_per_package.py
        # against infrastructure/quality/coverage-floors.yaml. Floors ratchet
        # UPWARD only (operator step: scripts/coverage_ratchet.py).
        # data_fabric/ + ml_pipelines/ (heavy feast/ortools/pymoo deps) remain a
        # documented follow-up ratchet; ml_pipelines/ab_test runs in sprint6-verify.
        #
        # purpose-achievement-audit task 12.2 -- `-m "not slow"` added. The hole it
        # closes: this step had NO marker filter and NO HYPOTHESIS_PROFILE, so every
        # `@pytest.mark.slow` module under `orchestrator/` and `digital_twin/` ran
        # HERE, at the root conftest's `default` budget of 500 examples, driving the
        # real four-tier ConsensusProtocol and the real SimPy twin inside a
        # 15-minute lint job. A `slow` marker only keeps a test out of a job that
        # SELECTS on it; carrying the marker did nothing here. The three modules that
        # were executing unmarked-selected:
        #   orchestrator/tests/consensus/test_confidence_gate_universality_property.py (Property 22)
        #   orchestrator/tests/consensus/test_selection_and_twin_consequence_property.py (Property 26, module-level pytestmark)
        #   digital_twin/tests/test_simulation.py (INV-TW-002, 1000 scenarios)
        # All three now run in `uplift-verify`'s slow step at HYPOTHESIS_PROFILE=heavy
        # (100 examples) on a Linux runner, which is where the example budget is
        # meant to be spent (I-0). Nothing became unselected: see that step's path
        # list, which gained `orchestrator/tests/consensus` and `digital_twin/tests`
        # in the same change.
        #
        # HONEST CAVEAT, unverified here: coverage measured by THIS step no longer
        # includes those modules' contribution. `orchestrator`'s committed floor is
        # 30.0 and was seeded from a measurement in which protocol.py was 0%, so
        # there should be headroom -- but the first CI run is the first real signal.
        # If the per-package floor step goes red, the fix is to re-measure and
        # ratchet, NEVER to lower a floor (coverage-floors.yaml: floors never
        # decrease) and never to put the slow modules back into a 500-example run.
        run: |
          pytest packages/tests agents orchestrator digital_twin api -m "not slow" -v --tb=short \
            --cov=packages/synapse_common --cov=agents --cov=orchestrator \
            --cov=digital_twin --cov=api \
            --cov-branch \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=0
      - name: Per-package coverage floor (Sprint 13 §Phase 2)
        run: |
          python scripts/coverage_per_package.py \
            --xml coverage.xml \
            --floors infrastructure/quality/coverage-floors.yaml \
            --markdown
      - name: Spec coverage (Sprint 13 §Phase 5)
        # Aggregate assertion-matched coverage across all agent spec.yaml
        # invariants — substring matching is gameable; this requires an `assert`
        # within 20 lines of the INV-* ID. The script searches every test_*.py
        # under each agent's tests/ dir (not just test_spec.py) so invariants
        # asserted in test_reward.py, test_spec_assertions.py, etc. all count.
        # Sprint 13 §Phase 5 round 2: ratchet bumped 12 -> 99 after a session
        # that added test_spec_assertions.py to 6 silent agents (56 new tests).
        # Verified aggregate: 100.0% (65/65 invariants assertion-matched).
        # Gate at 99 so any regression of even one invariant fails CI.
        run: |
          python scripts/check_spec_coverage.py --threshold 99 --per-agent
      - name: Contract tests
        # decision-quality-proof task 3.3 (R11.3, R4.1). MADE BLOCKING rather than
        # labelled advisory, because the recorded remediation's own words were "the step
        # currently swallows a real contract-test failure and a collection error
        # identically" (infrastructure/quality/blocking-steps.yaml) -- and reading the
        # tree shows it was always the second, never the first.
        #
        # The old command was `pytest agents/*/contracts/ -m contract ... 2>/dev/null ||
        # echo "No contract tests yet (Sprint 2)"`. Two separate defects, one hiding the
        # other:
        #
        #   1. WRONG PATH. `agents/*/contracts/` holds the consumer-driven contract
        #      MODULES (`inventory_sentinel_contract.py`, `demand_prophet_contract.py`,
        #      ...). None matches pytest's default `python_files` patterns, so the
        #      selection collected ZERO tests and pytest exited 5 -- on every run since
        #      Sprint 2. The contract TESTS live in `agents/*/tests/test_contracts.py`
        #      (five of them: disruption_shield, freshness_guardian, pricing_oracle,
        #      supplier_trust, sustainability_agent), each carrying the `contract` marker
        #      registered in pyproject.toml.
        #   2. THE SWALLOW HID IT. `|| echo` turned that permanent exit 5 into a green
        #      step whose log said "No contract tests yet (Sprint 2)" -- prose that read
        #      as a deliberate not-yet rather than as a broken path. A step that cannot
        #      pass on its own merits and never fails is not a gate (I-7).
        #
        # EXIT 5 IS A FAILURE HERE, AND THAT IS THE POINT. Propagation was only half the
        # fix: a step that propagates but selects nothing is still not a gate, it just
        # makes the empty selection VISIBLE. pytest's exit 5 ("no tests collected", which
        # is also what `-m contract` deselecting everything produces) is non-zero, so with
        # the `|| echo` gone -- and with no `continue-on-error` on this step or on
        # `quality-gates` -- an empty selection reddens the job instead of printing
        # reassurance. An unexpanded glob is louder still: a path pytest cannot find is a
        # usage error. The five files named above were read off the filesystem rather than
        # assumed, and the marker they carry is registered in pyproject.toml so
        # `--strict-markers` accepts it. The RUN is CI's to report; nothing local
        # establishes it (I-7).
        #
        # This cannot newly redden CI: all five files are already collected and already
        # blocking via "Unit tests (all gated trees, branch coverage on)" above, which
        # runs `pytest packages/tests agents ... -m "not slow"` over the same `agents`
        # tree, and none of them carries a `slow` marker. So this step re-asserts an
        # already-green selection; what it adds is that the contract layer is named and
        # provably selected instead of silently absent. If it goes red, the unit-test step
        # above is red for the same reason.
        #
        # `-m contract` is kept so the step means what its name says: Layer 3
        # consumer-driven contracts, not everything that happens to live in those files.
        run: |
          pytest agents/*/tests/test_contracts.py -m contract -v --tb=short
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  uplift-verify:
    name: Uplift Harness + Verification Properties (tests/)
    runs-on: ubuntu-latest
    # 45 -> 60 (task 12.2): the slow step now also collects
    # `orchestrator/tests/consensus` (Properties 22 and 26, the real four-tier
    # protocol) and `digital_twin/tests` (INV-TW-002's 1000-scenario run). Both were
    # previously executing inside the 15-minute `quality-gates` job at the `default`
    # 500-example budget, so at `heavy`'s 100 the added work is strictly cheaper than
    # what already fitted there -- but this job was already the longest one and the
    # headroom was thin, so the bound moves with the load rather than after a timeout.
    timeout-minutes: 60
    # `needs: quality-gates` WAS HERE AND WAS REMOVED (decision-quality-proof session 5,
    # obstruction 2.5 disposition (a)). THE REASON IS THAT THE EDGE MADE A DECLARED
    # REQUIRED CHECK UNSATISFIABLE, NOT THAT IT WAS INCONVENIENT.
    #
    # `infrastructure/quality/required-checks.yaml` declares this job `required:`. With the
    # edge in place its status was `skipped` on every run of this branch's entire life --
    # first behind step 5 `ruff check`, then step 8 `mypy --strict orchestrator/`, then step
    # 17 C56, and now behind step 18 `Golden-trace replay metrics`. A required check that
    # can only report `skipped` is not a gate, and `tests/uplift` + `tests/verify` --
    # Properties 38-60, this feature's whole property surface -- had therefore never
    # executed in CI. Measured on run 34375108385 (sha e8c7c5a): steps 1-17 success, step
    # 18 failure, 19-23 skipped, this job skipped with steps=0.
    #
    # STEP 18 CANNOT PASS ON A HOSTED RUNNER AS WRITTEN, so the edge was not a temporary
    # inconvenience. `kv_cache_hit_rate` needs an Ollama-backed cache observation; the
    # replay takes none, so `replay_metrics` reports UNAVAILABLE and exits 2 rather than
    # call an unmeasured floor a pass. The gate is behaving exactly as I-7 demands. Its
    # repair (split the step, declaring the unmeasurable floor SKIP with its reason) is
    # owed separately and is tracked at task 27.5; it is NOT this edge's business, and
    # coupling the property surface to it is what kept both stuck for five sessions.
    #
    # WHAT THIS DOES NOT DO, stated because a scheduling change is easy to over-read:
    # `quality-gates` keeps every gate it had, keeps its own `required:` declaration, and
    # keeps blocking the merge on its own verdict. Nothing is lowered, no floor moves, no
    # exit status is discarded, and no `continue-on-error` is added. Two independent
    # required checks now report two independent verdicts instead of one masking the other.
    #
    # THE COST, HONESTLY: this job now runs on pushes where the tree does not type-check,
    # so a broken tree spends up to 60 runner-minutes. That is CI's cost and the repository
    # is public with unmetered standard-runner minutes; the alternative was a required
    # check that cannot report. Reds that appear here are NEWLY VISIBLE, NOT NEWLY BROKEN
    # -- the same reading session 2p-green's five unblocked jobs required.
    #
    # THE INSTALL CLOSURE WAS PROVEN AT THE COMMAND THIS JOB RUNS, before the edge was
    # removed, because finding 36 is that a closure proof starting anywhere else is worth
    # nothing: `python -m pytest tests/uplift tests/verify` imports `uplift.*`, so
    # `uplift/__init__.py` runs first and drags `consensus_arm -> harness -> contract ->
    # scipy` in. A static walk over 117 seed modules and 304 first-party files reports
    # every reachable third-party top-level import covered. Two flagged results, neither a
    # gap: `psycopg2` is outside this closure but imported at FUNCTION scope inside
    # `try/except ImportError` with an honest degrade (`orchestrator/audit/
    # data_provenance.py:166`), and `scipy` is pinned in NO requirements file in the
    # repository yet arrives transitively via `scikit-learn` (five `agents/*/
    # requirements.txt`) and `lifelines`. A declared import resting on an unpinned
    # transitive dependency is a fragility; widening the closure to fix it is the broad
    # change defect 22's precedent rejects, so it is recorded rather than repaired.
    # The `tests/` tree was gated by NO workflow: the quality-gates unit step runs
    # `packages/tests agents orchestrator digital_twin api` and every other workflow
    # targets a single subdirectory (tests/integration, tests/oracle,
    # tests/compliance, tests/security). So the uplift harness suite and the
    # verification-gate suite executed nowhere in CI. This job closes that hole.
    #
    # It is also the ONLY place the expensive property tests are allowed to run:
    # per `.kiro/steering/local-compute-budget.md` (I-0) the dev laptop runs
    # `HYPOTHESIS_PROFILE=dev pytest -m "not slow"`, and the real example budget is
    # spent here on Linux runners.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        # The consensus arm assembles all eight real agent A2A handlers plus the
        # twin handler, so this job needs the same dependency closure as the
        # unit-test job: agent requirements (incl. the sprint-3 bundle that carries
        # simpy) and the orchestrator stack.
        run: |
          pip install -r packages/requirements.txt -r packages/requirements-dev.txt
          pip install -e packages/
          pip install -r orchestrator/requirements.txt
          pip install jsonschema pyyaml
          for req in agents/*/requirements.txt; do pip install -r "$req"; done
          pip install simpy sse-starlette
          pip install -r agents/requirements-sprint3.txt
          pip install "starlette>=0.37.2,<0.38.0"
      - name: Property + unit tests (fast — full 500-example budget)
        # Pure/synthetic properties: no twin, no consensus network, so the full
        # `ci` budget is cheap here. Scope is deliberately `tests/` only: the
        # non-slow tests under `orchestrator/` and `digital_twin/` are already run
        # by `quality-gates`, and running them twice would double the wall clock
        # without adding a single new assertion.
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          pytest tests/uplift tests/verify -m "not slow" -v --tb=short
      - name: Property + regression tests (slow — 100-example budget)
        # Every example of these drives the real SimPy twin, the real four-tier
        # ConsensusProtocol, or the CLI end-to-end. `heavy` = 100 examples, the
        # minimum the spec obligations require; 500 would push this job past an
        # hour. Also carries the 623-test regression floor and the invariant-suite
        # collection checks (task 11.1).
        #
        # purpose-achievement-audit task 12.2 -- the path list gained
        # `orchestrator/tests/consensus` and `digital_twin/tests`. Before that it
        # was `tests/uplift tests/verify` only, so this "the slow properties run
        # here" step never COLLECTED Properties 22 and 26 at all: they live under
        # `orchestrator/tests/consensus/` and were therefore silently executing in
        # `quality-gates` at 500 examples instead (see that step's comment).
        #
        # `-m "slow"` is a selector, not a path filter: adding these two directories
        # collects only their slow-marked tests, so nothing cheap is duplicated out
        # of `quality-gates`.
        #
        # The six slow properties this step owns, by design number:
        #   15 tests/uplift/test_uplift_harness_cross_process_determinism_property.py
        #   16 tests/uplift/test_uplift_null_arm_property.py
        #   22 orchestrator/tests/consensus/test_confidence_gate_universality_property.py
        #   26 orchestrator/tests/consensus/test_selection_and_twin_consequence_property.py
        #   29 tests/verify/test_nonsynthetic_ingestion_replay_property.py
        #   30 tests/verify/test_actuation_classification_property.py
        # plus tests/verify/test_declared_falsification_property.py (the subprocess
        # fault-injection probe), tests/uplift/test_preserved_baseline_regression.py
        # (the 623-test floor + collection checks), and
        # digital_twin/tests/test_simulation.py (INV-TW-002's 1000-scenario run,
        # which `-m "not slow"` in `quality-gates` would otherwise leave selected by
        # NO job -- adding the path here is what keeps it executed).
        env:
          HYPOTHESIS_PROFILE: heavy
        run: |
          pytest tests/uplift tests/verify orchestrator/tests/consensus digital_twin/tests \
            -m "slow" -v --tb=short

  sprint6-verify:
    name: Sprint 6 Multi-City Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-gates
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/sprint-')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r packages/requirements.txt -r packages/requirements-dev.txt
          pip install jsonschema pyyaml feast mlflow neo4j confluent-kafka psycopg2-binary
      - name: Agent card validation (E-S6-13)
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          errors = []
          for card in Path('agents').glob('*/agent_card.json'):
              data = json.loads(card.read_text())
              if 'cities' not in data:
                  errors.append(f'{card}: missing cities array — E-S6-13')
              if 'city_specific_config' not in data:
                  errors.append(f'{card}: missing city_specific_config — E-S6-13')
              if data.get('protocol') != 'a2a':
                  errors.append(f'{card}: protocol must be a2a — I-9')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'All {len(list(Path(\"agents\").glob(\"*/agent_card.json\")))} agent cards valid')
          "
      - name: Invariant static checks (I-2, I-9, I-13, I-14)
        run: |
          # I-2: Reward isolation
          for f in $(find agents/ -name "rewards.py"); do
            agent_dir=$(echo $f | cut -d'/' -f2)
            if grep -n "from agents\." "$f" | grep -v "from agents.$agent_dir"; then
              echo "$f: Cross-agent import violates I-2"
              exit 1
            fi
          done
          echo "I-2 (reward isolation): OK"

          # I-13: No dynamic data in system prompts
          if grep -rn "system_prompt.*f['\"]" agents/ orchestrator/ 2>/dev/null | grep -v "#"; then
            echo "I-13 violation: dynamic data in system prompts"
            exit 1
          fi
          echo "I-13 (deterministic serialization): OK"

          # I-14: No context mutation in orchestrator
          if grep -rn "\.remove\|\.pop\|\.clear" orchestrator/ 2>/dev/null | grep -i context | grep -v "#" | grep -v test; then
            echo "I-14 violation: context mutation detected"
            exit 1
          fi
          echo "I-14 (context append-only): OK"
      - name: Schema output validation (I-3)
        run: python scripts/validate_schemas.py
      - name: A/B test framework (hermetic)
        run: |
          PYTHONPATH=. pytest ml_pipelines/ab_test/test_ab_framework.py -v --tb=short


  v4-compliance:
    name: v4.0 Definitive Edition Compliance (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true  # informational signal during stabilization
    steps:
      - uses: actions/checkout@v4
      - name: Compliance gate
        run: make verify-v4-compliance

  chromatic-color-gates:
    name: Chromatic System — colour gates (ADR-025)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install chromatic core dependencies
        run: cd design-system/color && npm ci --no-audit --no-fund
      - name: Dependency licence audit (I-1)
        run: node design-system/color/scripts/license-audit.mjs
      - name: Build tokens + SDD/TDD/BDD suite (INV-CLR incl. atlas-console 019–025)
        # `npm run verify` = build + spec:coverage + vitest. spec:coverage
        # hard-fails if any INV-CLR/MR-CLR id in color-system.spec.yml lacks a
        # test, so the atlas-console-elevation INV-CLR-019..025 properties are
        # gated here, not just present.
        run: cd design-system/color && npm run verify
      - name: Build determinism — dist matches a fresh build (INV-CLR-010)
        run: git diff --exit-code design-system/color/dist/
      - name: No raw colour literals in components (INV-CLR-009)
        run: node design-system/color/scripts/lint-hex.mjs frontend/src

  training-smoke:
    name: Training Smoke (ADR-042 C38/C40 + floor measurement)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality-gates
    # Full on push to long-lived branches; the static C37/C39/C41 gates already
    # run on every PR in quality-gates. This heavy job proves the loop actually
    # learns (C37 runtime), checkpoints (C38), and calibrates (C40), and measures
    # the per-package coverage floors under the full ML dep stack (E-S13-01).
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/sprint-')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install ML dep stack (CPU wheels, pinned, license-clean)
        run: |
          pip install -r packages/requirements.txt -r packages/requirements-dev.txt
          # Install the shared package itself (not just its deps) so agent train
          # modules can `import synapse_common` — the smoke-train previously
          # failed with "No module named 'synapse_common'". Mirrors quality-gates.
          pip install -e packages/
          pip install jsonschema pyyaml
          for req in agents/*/requirements.txt; do pip install -r "$req"; done
          pip install -r agents/requirements-sprint3.txt
          # CPU-only torch + the RL/survival/solver stack. All MIT/BSD/Apache.
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<2.4"
          pip install "gymnasium>=0.29,<1.1" "simpy>=4.1,<5" "lifelines>=0.27,<0.31" \
                      "ortools>=9.8,<9.11" "pymoo>=0.6,<0.7"
      - name: Smoke-train READY_AGENTS (produces artifacts/training/*.json)
        env:
          SYNAPSE_SMOKE_RUN: "1"
          PYTHONPATH: .
        run: python scripts/smoke_train.py
      - name: Checkpoint-truth gate (C38)
        env:
          SYNAPSE_SMOKE_RUN: "1"
          PYTHONPATH: .
        run: python -m scripts.audit.checkpoint_truth --check
      - name: Calibration-truth gate (C40)
        env:
          SYNAPSE_SMOKE_RUN: "1"
          PYTHONPATH: .
        run: python -m scripts.audit.calibration_truth --check
      - name: Runtime-substance gate (C42, ADR-043)
        # The runtime counterpart to C33's static gate: boots the just-trained
        # checkpoint through the production serving path and asserts the output is
        # genuinely real (degraded=False, conformal-interval confidence). Catches
        # the unfit-calibrator 500 and the never-loaded-model regressions the AST
        # gate is blind to. torch + the smoke checkpoint are present here.
        env:
          SYNAPSE_SMOKE_RUN: "1"
        run: python -m scripts.audit.runtime_substance --check
      - name: R3.2 serving-resolution proof (recorded entry resolves, BLOCKING)
        # purpose-achievement-audit task 12.4. This step is R3.2's ONLY executed proof.
        #
        # tests/integration/test_published_entry_serving_resolution.py is
        # `skipif(not SYNAPSE_SMOKE_RUN)`: it needs the serving checkpoint plus its
        # sidecar, which only this job produces (the smoke-train step above). So on
        # every pull request, in quality-gates, and on the dev laptop under I-0 it is
        # a silent `s`, and a SKIP is not a PASS (I-7) - until this step existed, R3.2
        # had no executed proof anywhere in CI while every run stayed green. With
        # SYNAPSE_SMOKE_RUN set the module stops skipping and asserts its own
        # prerequisites instead: an absent checkpoint or an absent torch FAILs here,
        # because inside this job both must be present.
        #
        # Placement is deliberate. AFTER the C42 gate: smoke-train + C38/C40/C42 have
        # already produced and validated artifacts/checkpoints/demand_prophet_hgt_tft.pt
        # and its .serving.json, so there is a real artifact to resolve. BEFORE the
        # coverage step below: that step carries `continue-on-error: true` and a
        # `|| true`, and this proof must never end up inside a block that discards its
        # exit status. No `continue-on-error` and no `|| true` here - propagating is
        # the entire point of the step.
        #
        # Environment: SYNAPSE_SMOKE_RUN=1 is what flips the module from skip to
        # assert; PYTHONPATH=. resolves `scripts.audit.published_checkpoint_truth` and
        # `agents.demand_prophet.*` (pyproject's `pythonpath = ["."]` already does this
        # under pytest - it is kept so the line is runnable verbatim by hand). Nothing
        # further is required: DP_HF_REPO stays unset so the $0 source resolves the
        # local artifact, and the committed registry is still `__placeholder__`, which
        # is the branch the test asserts (smoke-artifact resolution, R3.8 - a green run
        # here is NOT evidence that a checkpoint is published). The dependency closure
        # is already satisfied by this job: torch (CPU wheel above) plus fastapi,
        # pydantic-settings and mlflow from agents/demand_prophet/requirements.txt.
        # That last group is the delta over C42: C42 constructs `ModelRegistry` itself,
        # while this test imports the FastAPI serving module and calls the same
        # `serve._build_model_registry` the app lifespan calls, so it also pays for an
        # MlflowClient against the unreachable default tracking URI - bounded to ~3s by
        # the timeout serve.py sets, after which resolution falls through to the
        # checkpoint path (I-7).
        #
        # PULL-REQUEST REACH - decided, not overlooked. This job is
        # `if: main || develop || sprint-*`, so R3.2 is proven POST-MERGE only and
        # cannot block the pull request that breaks it. That is the same structural gap
        # R14 records for branch protection, and it is accepted here deliberately: the
        # proof needs a trained checkpoint, and producing one on every PR is exactly
        # the category-4 workload I-0 and this whole feature keep off the PR path. What
        # would close it without paying that cost is a committed fixture checkpoint, or
        # a lighter smoke artifact a PR job could resolve; neither exists today, so
        # post-merge-blocking is the honest position rather than a `continue-on-error`
        # that would make the question disappear. When this fails on main, the run is
        # red and the merge that broke it is named.
        run: SYNAPSE_SMOKE_RUN=1 PYTHONPATH=. pytest tests/integration/test_published_entry_serving_resolution.py -q --tb=short
      - name: Measure per-package coverage under full ML stack (ADVISORY - binds the 0.0 floors)
        # decision-quality-proof task 3.3 (R11.3). Renamed to carry ADVISORY, which is
        # the remediation `infrastructure/quality/blocking-steps.yaml` recorded for this
        # step verbatim. Nothing else changed: `continue-on-error: true` and the `|| true`
        # on coverage_per_package.py both stay, because they are correct here and the
        # first line of the comment below has always said why. The defect was only that
        # the honesty lived in a comment, where the shape gate cannot read it, while the
        # step name claimed nothing -- so a reader of the run log, and
        # `workflow_shape_truth`, both had to guess.
        #
        # NOT made blocking. The gating per-package floor check is the separate
        # "Per-package coverage floor" step in `quality-gates`, declared in
        # `blocking-steps.yaml::steps`. This step MEASURES under the full ML stack so an
        # operator can bind the 0.0 floors with scripts/coverage_ratchet.py; a measurement
        # whose purpose is to reveal a number cannot also be the gate on that number
        # without pinning whatever it first happened to measure.
        #
        # Informational: surfaces the REAL per-package coverage for orchestrator +
        # the 8 agents + digital_twin + data_fabric + ml_pipelines (torch/ortools/
        # pymoo importable here, unlike quality-gates). The operator then runs
        # scripts/coverage_ratchet.py --apply in a follow-up PR to lock the measured
        # floors. Never auto-commits. data_fabric/ml_pipelines are measured here
        # (informational) before being promoted into the gating step as tests land.
        #
        # purpose-achievement-audit task 12.4 -- `-m "not slow"` added, closing the
        # residual half of task 12.2's slow-routing fix. 12.2 filtered quality-gates
        # and routed the slow modules into `uplift-verify` at HYPOTHESIS_PROFILE=heavy
        # (100), but was told not to touch this job, so three slow-marked modules were
        # still executing HERE at the root conftest's `default` budget of 500 examples
        # on main/develop/sprint-*:
        #   orchestrator/tests/consensus/test_confidence_gate_universality_property.py (Property 22)
        #   orchestrator/tests/consensus/test_selection_and_twin_consequence_property.py (Property 26, module pytestmark)
        #   digital_twin/tests/test_simulation.py (INV-TW-002, a 1000-scenario run)
        # This step gates nothing, but that made it a second full run of the real
        # four-tier ConsensusProtocol and the real SimPy twin at five times the budget
        # the job that owns them uses. All three keep exactly one selecting job:
        # `uplift-verify`'s slow step. No HYPOTHESIS_PROFILE is set, matching
        # quality-gates: what remains selected here is non-slow by the marker
        # convention, so `default` is the right budget for it.
        #
        # MEASUREMENT CHANGED - read before running scripts/coverage_ratchet.py --apply.
        # Excluding those three modules removes their contribution, so the `orchestrator`
        # and `digital_twin` numbers this step reports are LOWER than any earlier run of
        # it: orchestrator loses the real-protocol paths Properties 22/26 drove, and
        # digital_twin loses the simulation-engine paths INV-TW-002's 1000-scenario test
        # drove (its floor is still 0.0 / CI-MUST-MEASURE, so the first bound floor will
        # be bound from the new, smaller measurement). That is the intended trade: a
        # floor bound from a 500-example run of the real protocol and the real twin is a
        # floor nobody should ever reproduce, and coverage-floors.yaml says floors never
        # decrease - so binding an unreproducible high number would pin it permanently.
        # If those packages need their slow-path coverage counted, measure it where the
        # slow tests actually run (`uplift-verify`), never by putting them back here.
        continue-on-error: true
        run: |
          pytest packages/tests agents orchestrator digital_twin api ml_pipelines -m "not slow" --tb=short -q \
            --cov=packages/synapse_common --cov=agents --cov=orchestrator \
            --cov=digital_twin --cov=api --cov=data_fabric --cov=ml_pipelines --cov-branch \
            --cov-report=xml:coverage-full.xml --cov-fail-under=0
          python scripts/coverage_per_package.py \
            --xml coverage-full.xml \
            --floors infrastructure/quality/coverage-floors.yaml \
            --markdown || true
      - name: Upload full-stack coverage (for floor binding)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-full
          path: coverage-full.xml
          if-no-files-found: ignore

