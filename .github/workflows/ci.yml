name: SYNAPSE CI
on:
  push:
    branches: [main, develop, "sprint-*"]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    name: Lint + Type Check + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r packages/requirements.txt -r packages/requirements-dev.txt
          pip install jsonschema pyyaml
      - name: Ruff lint
        run: ruff check packages/synapse_common/ agents/ orchestrator/ --output-format=github
      - name: Ruff format check
        run: ruff format --check packages/synapse_common/ agents/ orchestrator/
      - name: MyPy strict type check (packages — blocking)
        run: mypy --strict packages/synapse_common/
      - name: MyPy strict type check (orchestrator — blocking)
        run: mypy --strict orchestrator/ --exclude orchestrator/tests
      - name: MyPy strict type check (agents — informational, target=blocking)
        # TODO(R5): flip continue-on-error to false once all agents are clean.
        # Tracked in plans/now-we-have-completed-joyful-goose.md (R5).
        continue-on-error: true
        run: mypy --strict agents/ --exclude 'agents/.*/tests' --exclude 'agents/.*/training'
      - name: Schema validation
        run: python scripts/validate_schemas.py
      - name: Spec validation
        run: |
          for spec in $(find agents/ -name "spec.yaml" 2>/dev/null); do
            python -c "
          import yaml, json, jsonschema
          spec=yaml.safe_load(open('$spec'))
          schema=json.load(open('docs/specs/agent_spec_schema.json'))
          jsonschema.validate(spec, schema)
          print('OK $spec')
          "
          done
      - name: License audit (I-1)
        run: |
          pip install pip-licenses
          pip-licenses --allow-only="MIT;Apache-2.0;Apache Software License;BSD-2-Clause;BSD-3-Clause;PSF;Python Software Foundation License;ISC;MPL-2.0;BSD License" || true
      - name: No paid API imports (I-1)
        run: |
          if grep -rn "import openai\|from openai\|import anthropic\|from anthropic\|import cohere\|from cohere" agents/ orchestrator/ packages/; then
            echo "Paid API import detected — violates I-1"
            exit 1
          fi
          echo "No paid API imports found"
      - name: Reward isolation check (I-2)
        run: |
          for f in $(find agents/ -name "rewards.py"); do
            agent_dir=$(echo $f | cut -d'/' -f2)
            if grep -n "from agents\." "$f" | grep -v "from agents.$agent_dir"; then
              echo "$f: Cross-agent import violates I-2"
              exit 1
            fi
          done
          echo "Reward isolation verified"
      - name: Unit tests
        run: |
          cd packages && pytest tests/ -v --tb=short --cov=synapse_common --cov-report=xml --cov-fail-under=80
      - name: Contract tests
        run: |
          pytest agents/*/contracts/ -m contract -v --tb=short 2>/dev/null || echo "No contract tests yet (Sprint 2)"
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/coverage.xml

  sprint7-contracts:
    name: Sprint 7 Contracts (WS-1/WS-2 gates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r packages/requirements.txt -r packages/requirements-dev.txt
          pip install jsonschema pyyaml aiosqlite pytest-asyncio sqlalchemy
      - name: Topic registry contract
        run: pytest tests/contracts/test_kafka_topic_registry.py -v --tb=short
      - name: Async hygiene contract
        run: pytest tests/contracts/test_async_hygiene.py -v --tb=short
      - name: JSON-determinism contract
        run: pytest tests/contracts/test_json_determinism.py -v --tb=short
      - name: Schema-at-handler-boundary contract
        run: pytest tests/contracts/test_schema_at_handler_boundary.py -v --tb=short
      - name: SLO + burn-rate rules
        run: pytest tests/observability/ -v --tb=short
      - name: Burn-rate generator drift gate
        run: python scripts/generate_burn_alerts.py --check
      - name: Integration tests (idempotency, outbox, traceparent, KV-cache, brownout, replay)
        run: |
          pytest tests/integration/test_idempotency_replay.py \
                 tests/integration/test_outbox_after_crash.py \
                 tests/integration/test_traceparent_e2e.py \
                 tests/integration/test_kv_cache_stability.py \
                 tests/integration/test_brownout_transitions.py \
                 tests/integration/test_replay_determinism.py \
                 -v --tb=short

  sprint6-verify:
    name: Sprint 6 Multi-City Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-gates
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/sprint-')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r packages/requirements.txt -r packages/requirements-dev.txt
          pip install jsonschema pyyaml feast mlflow neo4j confluent-kafka psycopg2-binary
      - name: Agent card validation (E-S6-13)
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          errors = []
          for card in Path('agents').glob('*/agent_card.json'):
              data = json.loads(card.read_text())
              if 'cities' not in data:
                  errors.append(f'{card}: missing cities array — E-S6-13')
              if 'city_specific_config' not in data:
                  errors.append(f'{card}: missing city_specific_config — E-S6-13')
              if data.get('protocol') != 'a2a':
                  errors.append(f'{card}: protocol must be a2a — I-9')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'All {len(list(Path(\"agents\").glob(\"*/agent_card.json\")))} agent cards valid')
          "
      - name: Invariant static checks (I-2, I-9, I-13, I-14)
        run: |
          # I-2: Reward isolation
          for f in $(find agents/ -name "rewards.py"); do
            agent_dir=$(echo $f | cut -d'/' -f2)
            if grep -n "from agents\." "$f" | grep -v "from agents.$agent_dir"; then
              echo "$f: Cross-agent import violates I-2"
              exit 1
            fi
          done
          echo "I-2 (reward isolation): OK"

          # I-13: No dynamic data in system prompts
          if grep -rn "system_prompt.*f['\"]" agents/ orchestrator/ 2>/dev/null | grep -v "#"; then
            echo "I-13 violation: dynamic data in system prompts"
            exit 1
          fi
          echo "I-13 (deterministic serialization): OK"

          # I-14: No context mutation in orchestrator
          if grep -rn "\.remove\|\.pop\|\.clear" orchestrator/ 2>/dev/null | grep -i context | grep -v "#" | grep -v test; then
            echo "I-14 violation: context mutation detected"
            exit 1
          fi
          echo "I-14 (context append-only): OK"
      - name: Schema output validation (I-3)
        run: python scripts/validate_schemas.py
      - name: A/B test framework (hermetic)
        run: |
          PYTHONPATH=. pytest ml_pipelines/ab_test/test_ab_framework.py -v --tb=short


  v4-compliance:
    name: v4.0 Definitive Edition Compliance (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true  # informational signal during stabilization
    steps:
      - uses: actions/checkout@v4
      - name: Compliance gate
        run: make verify-v4-compliance

  sprint8-spec:
    name: Sprint 8 Spec-as-Source (WS-3 gates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r packages/requirements.txt -r packages/requirements-dev.txt
          pip install jsonschema pyyaml
      - name: spec-validate
        run: python scripts/spec_cli.py validate
      - name: spec-reward-check
        run: python scripts/spec_cli.py generate-reward-config --check
      - name: spec-alerts-check
        run: python scripts/spec_cli.py generate-alerts --check
      - name: extended spec coverage gate (INV + MR + reward.weights)
        run: python scripts/check_spec_coverage.py

  sprint8-eval:
    name: Sprint 8 Eval Harness (WS-5 gates, PR-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-gates
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r packages/requirements.txt -r packages/requirements-dev.txt
          pip install jsonschema pyyaml aiosqlite pytest-asyncio sqlalchemy
      - name: synapse eval run --suite golden
        run: PYTHONPATH=".:packages" python tests/eval/run.py --print
      - name: tier-routing accuracy gate
        run: pytest tests/eval/test_tier_routing_accuracy.py -v --tb=short
      - name: replay equivalence
        run: pytest tests/eval/test_replay_equivalence.py -v --tb=short
      - name: KV-cache hit-rate floor
        run: pytest tests/observability/test_kv_cache_hit_rate.py -v --tb=short

  sprint9-supply:
    name: Sprint 9 Supply Chain (WS-6 gates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r packages/requirements.txt -r packages/requirements-dev.txt
          pip install jsonschema pyyaml
      - name: SBOM drift gate
        run: python scripts/generate_sbom.py --check
      - name: LLM-prompt PII guard
        run: python scripts/check_llm_prompt_pii.py
      - name: C4 diagram drift gate
        run: python scripts/generate_diagrams.py --check
      - name: 200-trace generator drift gate
        run: python tests/eval/generate_traces.py --check

  sprint9-helm:
    name: Sprint 9 Helm + Topology (WS-10 gates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'
      - name: Install kubeval
        run: |
          curl -L https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz \
            | tar xz -C /tmp
          sudo mv /tmp/kubeval /usr/local/bin/
      - name: helm lint
        run: helm lint infrastructure/helm/synapse
      - name: helm template + kubeval (bengaluru)
        run: |
          helm template synapse infrastructure/helm/synapse \
            -f infrastructure/helm/synapse/values-bengaluru.yaml \
            > /tmp/manifests-blr.yaml
          kubeval --ignore-missing-schemas /tmp/manifests-blr.yaml
      - name: helm template + kubeval (mumbai)
        run: |
          helm template synapse infrastructure/helm/synapse \
            -f infrastructure/helm/synapse/values-mumbai.yaml \
            > /tmp/manifests-mum.yaml
          kubeval --ignore-missing-schemas /tmp/manifests-mum.yaml

  sprint7-chaos-gating:
    name: Sprint 7 Chaos Tests (brownout-relevant, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: sprint7-contracts
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r packages/requirements.txt -r packages/requirements-dev.txt
          pip install jsonschema pyyaml aiosqlite pytest-asyncio sqlalchemy
      - name: Kafka failure chaos (brownout signal)
        run: pytest tests/chaos/test_kafka_failure.py -v --tb=short
      - name: Ollama crash chaos (brownout signal)
        run: pytest tests/chaos/test_ollama_crash.py -v --tb=short
      - name: City isolation chaos (E-S6-05)
        run: pytest tests/chaos/test_city_isolation.py -v --tb=short

