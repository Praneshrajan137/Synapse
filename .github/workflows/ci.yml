          pip install simpy sse-starlette
          pip install -r agents/requirements-sprint3.txt
          pip install "starlette>=0.37.2,<0.38.0"
      - name: Selected count is non-empty and reported (fast shard 2/4)
        id: collect
        # See shard 1/4 for why the count is `grep -c '::'` and why `addopts` is replaced.
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          set -euo pipefail
          pytest -o addopts="--strict-markers" -m "not slow" --collect-only -q \
            tests/uplift/test_[pqrstuvwxyz]*.py | tee "$RUNNER_TEMP/selected.txt"
          selected="$(grep -c '::' "$RUNNER_TEMP/selected.txt")"
          printf 'selected=%s\n' "$selected" >> "$GITHUB_OUTPUT"
          printf 'fast shard 2/4: %s test(s) selected\n' "$selected"
          test "$selected" -gt 0
      - name: Property + unit tests (fast - full 500-example budget, shard 2/4)
        # See shard 1/4: same budget, same `-m "not slow"`, complementary path class.
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          pytest tests/uplift/test_[pqrstuvwxyz]*.py -m "not slow" -v --tb=short

