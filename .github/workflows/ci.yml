name: SYNAPSE CI
on:
  push:
    branches: [main, develop, "sprint-*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "plans/**"
      - "notebooks/**"
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    name: Lint + Type Check + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r packages/requirements.txt -r packages/requirements-dev.txt
          # Install synapse_common as an editable package so `import
          # synapse_common.*` resolves in the unit-test step (orchestrator/tests
          # conftest imports it). pytest's pythonpath=["."] does not expose
          # packages/synapse_common, and the contracts job already relies on this
          # editable install — mirror it here.
          pip install -e packages/
          pip install -r orchestrator/requirements.txt
          pip install jsonschema pyyaml
          # Sprint 13 §Phase 1.3: install agent deps so agents/*/tests/ can be collected
          # alongside packages/ and orchestrator/ in one gated pytest run.
          for req in agents/*/requirements.txt; do pip install -r "$req"; done
          # Plan v2 §Phase 4: deps for the newly-gated trees (digital_twin needs
          # simpy; api tests use the FastAPI TestClient + async SQLAlchemy stack;
          # orchestrator SSE handlers need sse-starlette). simpy lives in the
          # sprint-3 bundle which the agents/*/ glob above does NOT match.
          pip install simpy sse-starlette
          pip install -r agents/requirements-sprint3.txt
          # mypy imports `pathspec.patterns.gitignore` (pathspec>=0.10.0). One of
          # the requirement sets above transitively pins an older pathspec, which
          # makes mypy crash on import. Force the compatible version LAST so it
          # cannot be downgraded before the MyPy steps run.
          pip install --upgrade "pathspec>=0.12.1"
          # fastapi 0.111.0 passes `on_startup` to starlette's Router (removed in
          # starlette 0.38). `sse-starlette` above pulls a newer starlette that
          # re-breaks api/ imports despite the orchestrator pin. Force the
          # compatible starlette LAST so api/tests collect. (`!=` keeps pip from
          # also yanking fastapi.)
          pip install "starlette>=0.37.2,<0.38.0"
          # api/ handlers lazily `import psycopg2` inside their DB try-blocks.
          # Without the driver the import raises before the POSTGRES_DSN
          # fail-fast, so api/tests/test_decisions_auth.py sees "No module named
          # 'psycopg2'" instead of the expected "POSTGRES_DSN not configured".
          # psycopg2-binary is the dev/test variant (E-S5-09).
          pip install psycopg2-binary
      - name: Ruff lint
        run: ruff check packages/synapse_common/ agents/ orchestrator/ --output-format=github
      - name: Ruff format check
        run: ruff format --check packages/synapse_common/ agents/ orchestrator/
      - name: MyPy strict type check (packages — blocking)
        run: mypy --strict packages/synapse_common/
      - name: MyPy strict type check (orchestrator — blocking)
        run: mypy --strict orchestrator/ --exclude orchestrator/tests
      - name: MyPy strict type check (agents — informational, target=blocking)
        # TODO(R5): flip continue-on-error to false once all agents are clean.
        # Tracked in plans/now-we-have-completed-joyful-goose.md (R5).
        continue-on-error: true
        run: mypy --strict agents/ --exclude 'agents/.*/tests' --exclude 'agents/.*/training'
      - name: Schema validation
        run: python scripts/validate_schemas.py
      - name: Spec validation
        run: |
          for spec in $(find agents/ -name "spec.yaml" 2>/dev/null); do
            python -c "
          import yaml, json, jsonschema
          spec=yaml.safe_load(open('$spec'))
          schema=json.load(open('docs/specs/agent_spec_schema.json'))
          jsonschema.validate(spec, schema)
          print('OK $spec')
          "
          done
      - name: License audit (I-1 — ADVISORY, non-blocking)
        # Honest label: the trailing `|| true` makes this informational, not a
        # gate. pip-licenses' classifier strings are noisy across the full dep
        # tree, so a hard failure here would be flaky. The BLOCKING I-1
        # enforcement is the paid-API-import grep in the next step.
        run: |
          pip install pip-licenses
          pip-licenses --allow-only="MIT;Apache-2.0;Apache Software License;BSD-2-Clause;BSD-3-Clause;PSF;Python Software Foundation License;ISC;MPL-2.0;BSD License" || true
      - name: No paid API imports (I-1 — BLOCKING)
        # The real I-1 gate. Scoped to EVERY Python source tree (not just
        # agents/orchestrator/packages — api/, digital_twin/, data_fabric/,
        # ml_pipelines/ and scripts/ were previously unscanned) and now also
        # catches `replicate` (the 4th paid client named in CLAUDE.md I-1).
        run: |
          if grep -rn "import openai\|from openai\|import anthropic\|from anthropic\|import cohere\|from cohere\|import replicate\|from replicate" \
              agents/ orchestrator/ packages/ api/ digital_twin/ data_fabric/ ml_pipelines/ scripts/; then
            echo "Paid API import detected — violates I-1"
            exit 1
          fi
          echo "No paid API imports found"
      - name: Reward isolation check (I-2)
        run: |
          for f in $(find agents/ -name "rewards.py"); do
            agent_dir=$(echo $f | cut -d'/' -f2)
            if grep -n "from agents\." "$f" | grep -v "from agents.$agent_dir"; then
              echo "$f: Cross-agent import violates I-2"
              exit 1
            fi
          done
          echo "Reward isolation verified"
      - name: Substance gap gate (Plan v2 ADR-040 — no synthetic shortcuts)
        # Blocks any agent inference pipeline that reintroduces the
        # guard-then-ignore / hardcoded-confidence / random-model-input
        # anti-patterns. Pure stdlib (AST) — no ML deps required.
        run: python -m scripts.audit.substance_truth --check
      - name: Intelligence gates — static (ADR-042 C37/C39/C41, AST-only)
        # Pure stdlib AST gates: no model ever returns the pipeline_validated
        # sentinel / builds an un-stepped optimizer (C37); serve.py wiring does
        # not regress below baseline (C39); a real-path confidence_basis stamp
        # always matches the computed basis (C41). The runtime gates C38/C40
        # (checkpoint + calibration) need trained artifacts and run in the
        # separate training-smoke job below.
        run: |
          python -m scripts.audit.training_truth --check
          python -m scripts.audit.serving_truth --check
          python -m scripts.audit.confidence_basis_truth --check
      - name: Narrative-truth gate (docs match mechanical reality — C56)
        # Pins CLAUDE.md's load-bearing numbers/cadence claims to their source
        # (spec-coverage --threshold, deploy cadence) so the narrative cannot
        # silently drift from what the gates enforce. Pure stdlib (regex).
        run: python -m scripts.audit.doc_truth --check
      - name: Golden-trace replay metrics (R7.6/R7.7 — KV-cache + tier routing)
        # The two numbers CLAUDE.md has stated since Sprint 9 with NO gate anywhere:
        # KV-cache hit rate 0.70 and tier-routing accuracy 0.80. Both floors are read
        # from infrastructure/quality/replay-floors.yaml (never hardcoded) and measured
        # by replaying the 200 golden traces (seed 0xCAFEBABE) through the existing
        # tests/eval harness. Exit 1 below floor, exit 2 when a metric has no
        # measurement behind it — an unavailable is never a pass (I-7). Replaying 200
        # traces is a CI workload; I-0 keeps it off the development laptop.
        #
        # THIS STEP CAN NOW EXIT 0 WITH ONE FLOOR UNMEASURED, and the honesty burden for
        # that sits in the configuration rather than here (decision-quality-proof
        # obstruction 2.5, disposition (b), by explicit operator decision).
        #
        # The first time this step ever executed it proved that `kv_cache_hit_rate` is
        # not measurable on a hosted runner: the replay takes no cache observation
        # because there is no Ollama behind it, the gauge carries no samples, and the
        # gate exited 2 rather than call an unmeasured floor a pass. That is I-7 working.
        # It also made this step unpassable, which skipped steps 19-23, blocked PR #84
        # and left `main` red — for four sessions, behind three different failures.
        #
        # `replay-floors.yaml` now carries an `unmeasurable_in_ci:` declaration on that
        # floor, with the prerequisite that VOIDS it, the reason it is blocked, and the
        # procedure to obtain the number. A declared floor reports DECLARED UNMEASURABLE
        # (exit 0, printed `[SKIP]`, and a distinct state in the JSON — a SKIP is not a
        # PASS); an UNDECLARED absence still exits 2; a declaration a measurement
        # contradicts is VOID and exits 1 until it is deleted. So `tier_routing_accuracy`
        # — which measures cleanly at 1.0000 over 200/200 traces — gates here, and the
        # unmeasured floor is a recorded absence rather than a silenced one.
        #
        # WHAT WAS NOT DONE, because both are what R2.10 and finding 35 forbid: the floor
        # was NOT lowered, and this step did NOT gain `continue-on-error`. The second
        # would re-create the swallowed-exit-status defect repaired two steps away.
        run: |
          python -m scripts.audit.replay_metrics --check \
            --out build/audit/replay-metrics.json
      - name: Unit tests (all gated trees, branch coverage on)
        # Sprint 13 §Phase 1.3 + 2 / Plan v2 §Phase 4: single pytest run across
        # packages/tests, agents/, orchestrator/, digital_twin/, api/ with branch
        # coverage enabled. The global --cov-fail-under was removed — the
        # mechanical gate is per-package via scripts/coverage_per_package.py
        # against infrastructure/quality/coverage-floors.yaml. Floors ratchet
        # UPWARD only (operator step: scripts/coverage_ratchet.py).
        # data_fabric/ + ml_pipelines/ (heavy feast/ortools/pymoo deps) remain a
        # documented follow-up ratchet; ml_pipelines/ab_test runs in sprint6-verify.
        #
        # purpose-achievement-audit task 12.2 -- `-m "not slow"` added. The hole it
        # closes: this step had NO marker filter and NO HYPOTHESIS_PROFILE, so every
        # `@pytest.mark.slow` module under `orchestrator/` and `digital_twin/` ran
        # HERE, at the root conftest's `default` budget of 500 examples, driving the
        # real four-tier ConsensusProtocol and the real SimPy twin inside a
        # 15-minute lint job. A `slow` marker only keeps a test out of a job that
        # SELECTS on it; carrying the marker did nothing here. The three modules that
        # were executing unmarked-selected:
        #   orchestrator/tests/consensus/test_confidence_gate_universality_property.py (Property 22)
        #   orchestrator/tests/consensus/test_selection_and_twin_consequence_property.py (Property 26, module-level pytestmark)
        #   digital_twin/tests/test_simulation.py (INV-TW-002, 1000 scenarios)
        # All three now run in `uplift-verify-slow`'s test step at HYPOTHESIS_PROFILE=heavy
        # (100 examples) on a Linux runner, which is where the example budget is
        # meant to be spent (I-0). Nothing became unselected: see that step's path
        # list, which gained `orchestrator/tests/consensus` and `digital_twin/tests`
        # in the same change.
        #
        # HONEST CAVEAT, unverified here: coverage measured by THIS step no longer
        # includes those modules' contribution. `orchestrator`'s committed floor is
        # 30.0 and was seeded from a measurement in which protocol.py was 0%, so
        # there should be headroom -- but the first CI run is the first real signal.
        # If the per-package floor step goes red, the fix is to re-measure and
        # ratchet, NEVER to lower a floor (coverage-floors.yaml: floors never
        # decrease) and never to put the slow modules back into a 500-example run.
        run: |
          pytest packages/tests agents orchestrator digital_twin api -m "not slow" -v --tb=short \
            --cov=packages/synapse_common --cov=agents --cov=orchestrator \
            --cov=digital_twin --cov=api \
            --cov-branch \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=0
      - name: Per-package coverage floor (Sprint 13 §Phase 2)
        run: |
          python scripts/coverage_per_package.py \
            --xml coverage.xml \
            --floors infrastructure/quality/coverage-floors.yaml \
            --markdown
      - name: Spec coverage (Sprint 13 §Phase 5)
        # Aggregate assertion-matched coverage across all agent spec.yaml
        # invariants — substring matching is gameable; this requires an `assert`
        # within 20 lines of the INV-* ID. The script searches every test_*.py
        # under each agent's tests/ dir (not just test_spec.py) so invariants
        # asserted in test_reward.py, test_spec_assertions.py, etc. all count.
        # Sprint 13 §Phase 5 round 2: ratchet bumped 12 -> 99 after a session
        # that added test_spec_assertions.py to 6 silent agents (56 new tests).
        # Verified aggregate: 100.0% (65/65 invariants assertion-matched).
        # Gate at 99 so any regression of even one invariant fails CI.
        run: |
          python scripts/check_spec_coverage.py --threshold 99 --per-agent
      - name: Contract tests
        # decision-quality-proof task 3.3 (R11.3, R4.1). MADE BLOCKING rather than
        # labelled advisory, because the recorded remediation's own words were "the step
        # currently swallows a real contract-test failure and a collection error
        # identically" (infrastructure/quality/blocking-steps.yaml) -- and reading the
        # tree shows it was always the second, never the first.
        #
        # The old command was `pytest agents/*/contracts/ -m contract ... 2>/dev/null ||
        # echo "No contract tests yet (Sprint 2)"`. Two separate defects, one hiding the
        # other:
        #
        #   1. WRONG PATH. `agents/*/contracts/` holds the consumer-driven contract
        #      MODULES (`inventory_sentinel_contract.py`, `demand_prophet_contract.py`,
        #      ...). None matches pytest's default `python_files` patterns, so the
        #      selection collected ZERO tests and pytest exited 5 -- on every run since
        #      Sprint 2. The contract TESTS live in `agents/*/tests/test_contracts.py`
        #      (five of them: disruption_shield, freshness_guardian, pricing_oracle,
        #      supplier_trust, sustainability_agent), each carrying the `contract` marker
        #      registered in pyproject.toml.
        #   2. THE SWALLOW HID IT. `|| echo` turned that permanent exit 5 into a green
        #      step whose log said "No contract tests yet (Sprint 2)" -- prose that read
        #      as a deliberate not-yet rather than as a broken path. A step that cannot
        #      pass on its own merits and never fails is not a gate (I-7).
        #
        # EXIT 5 IS A FAILURE HERE, AND THAT IS THE POINT. Propagation was only half the
        # fix: a step that propagates but selects nothing is still not a gate, it just
        # makes the empty selection VISIBLE. pytest's exit 5 ("no tests collected", which
        # is also what `-m contract` deselecting everything produces) is non-zero, so with
        # the `|| echo` gone -- and with no `continue-on-error` on this step or on
        # `quality-gates` -- an empty selection reddens the job instead of printing
        # reassurance. An unexpanded glob is louder still: a path pytest cannot find is a
        # usage error. The five files named above were read off the filesystem rather than
        # assumed, and the marker they carry is registered in pyproject.toml so
        # `--strict-markers` accepts it. The RUN is CI's to report; nothing local
        # establishes it (I-7).
        #
        # This cannot newly redden CI: all five files are already collected and already
        # blocking via "Unit tests (all gated trees, branch coverage on)" above, which
        # runs `pytest packages/tests agents ... -m "not slow"` over the same `agents`
        # tree, and none of them carries a `slow` marker. So this step re-asserts an
        # already-green selection; what it adds is that the contract layer is named and
        # provably selected instead of silently absent. If it goes red, the unit-test step
        # above is red for the same reason.
        #
        # `-m contract` is kept so the step means what its name says: Layer 3
        # consumer-driven contracts, not everything that happens to live in those files.
        run: |
          pytest agents/*/tests/test_contracts.py -m contract -v --tb=short
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  uplift-verify:
    name: Uplift Harness + Verification Properties (tests/)
    runs-on: ubuntu-latest
    # THIS JOB IS NOW A THIN AGGREGATOR, AND ITS `name:` IS THE REASON IT STAYED ONE.
    #
    # `infrastructure/quality/required-checks.yaml` declares this job `required:` with
    # `check_name: "Uplift Harness + Verification Properties (tests/)"`, and
    # `required_checks_truth.resolve_declared_jobs` compares that string BYTE FOR BYTE
    # against the job's display name -- no casefold, no normalisation on that path. So the
    # job id AND the display name are frozen. A `strategy.matrix` here would parameterise
    # the display name into `... (1)`, `... (2)`, the declared check would resolve to
    # nothing, and branch protection would sit waiting for a context that never reports:
    # the same "a required check that can only report `skipped` is not a gate" family the
    # disposition below spent a whole session removing. The work therefore moved to five
    # separate jobs with their own ids, and this job aggregates their conclusions.
    #
    # WHAT MOVED, AND WHAT DID NOT. The two pytest selections are unchanged in content:
    # the fast selection is partitioned BY PATH across four shards (never by `-k`, never
    # by `--deselect`, never by a marker beyond the `-m "not slow"` it always carried) and
    # the slow selection moved intact, same paths, same `-m "slow"`, same `heavy` profile.
    # No floor moved, no scope narrowed, no exit status is discarded, and the finding-57
    # failure in the slow selection stays selected and stays able to fail: repairing
    # another owner's defect is not this change's business and hiding it would be worse.
    needs:
      - uplift-verify-fast-1
      - uplift-verify-fast-2
      - uplift-verify-fast-3
      - uplift-verify-fast-4
      - uplift-verify-slow
    # `if: always()` IS LOAD-BEARING, NOT DEFENSIVE. Without it GitHub SKIPS a job whose
    # `needs:` did not all succeed, and a skipped required check is reported to branch
    # protection as satisfied. That is precisely the defect the `needs: quality-gates`
    # disposition below removed, and reintroducing it through a shard edge would be worse
    # than the original: the job would still be present in this file, so a reader would
    # have no reason to look.
    #
    # It is also decidable rather than a hole in the generated record: `gate_surface`'s
    # expression evaluator resolves `always()` to `True` (its `_TRUE_FUNCTIONS` set), so
    # this job still renders EXECUTES on `pull_request` instead of CONDITIONAL.
    if: always()
    # Seconds of bash over five job results and six `find` counts -- no Python, no
    # install, no test run. 10 minutes is far above the expected cost and is still a real
    # bound: a timeout is a FAILED job (I-7), never a partial verdict the next reader may
    # treat as a pass. The 60 minutes this job used to carry moved to the shards, which is
    # where the work went; each states its own arithmetic.
    timeout-minutes: 10
    # `needs: quality-gates` WAS HERE AND WAS REMOVED (decision-quality-proof session 5,
    # obstruction 2.5 disposition (a)). THE REASON IS THAT THE EDGE MADE A DECLARED
    # REQUIRED CHECK UNSATISFIABLE, NOT THAT IT WAS INCONVENIENT.
    #
    # `infrastructure/quality/required-checks.yaml` declares this job `required:`. With the
    # edge in place its status was `skipped` on every run of this branch's entire life --
    # first behind step 5 `ruff check`, then step 8 `mypy --strict orchestrator/`, then step
    # 17 C56, and now behind step 18 `Golden-trace replay metrics`. A required check that
    # can only report `skipped` is not a gate, and `tests/uplift` + `tests/verify` --
    # Properties 38-60, this feature's whole property surface -- had therefore never
    # executed in CI. Measured on run 34375108385 (sha e8c7c5a): steps 1-17 success, step
    # 18 failure, 19-23 skipped, this job skipped with steps=0.
    #
    # STEP 18 CANNOT PASS ON A HOSTED RUNNER AS WRITTEN, so the edge was not a temporary
    # inconvenience. `kv_cache_hit_rate` needs an Ollama-backed cache observation; the
    # replay takes none, so `replay_metrics` reports UNAVAILABLE and exits 2 rather than
    # call an unmeasured floor a pass. The gate is behaving exactly as I-7 demands. Its
    # repair (split the step, declaring the unmeasurable floor SKIP with its reason) is
    # owed separately and is tracked at task 27.5; it is NOT this edge's business, and
    # coupling the property surface to it is what kept both stuck for five sessions.
    #
    # WHAT THIS DOES NOT DO, stated because a scheduling change is easy to over-read:
    # `quality-gates` keeps every gate it had, keeps its own `required:` declaration, and
    # keeps blocking the merge on its own verdict. Nothing is lowered, no floor moves, no
    # exit status is discarded, and no `continue-on-error` is added. Two independent
    # required checks now report two independent verdicts instead of one masking the other.
    #
    # THE COST, HONESTLY, AND THE FIGURE MOVED WHEN THE WORK DID: this job group now runs
    # on pushes where the tree does not type-check. Before the shard split that was one
    # job at `timeout-minutes: 60`; it is now five jobs bounded at 30, 30, 30, 30 and 20
    # plus this aggregator at 10, so a pathological tree can spend 150 runner-minutes
    # where it used to spend 60. The PREDICTED figure is far lower -- about 39
    # runner-minutes against about 23 before, the difference being four extra copies of
    # the ~3-minute install -- and that is a prediction from run 34609187697's step
    # timings, not a measurement of this shape. It buys roughly 12 minutes off the wall
    # clock of a REQUIRED check. That is CI's cost and the repository is public with
    # unmetered standard-runner minutes; the alternative was a required check that cannot
    # report. Reds that appear here are NEWLY VISIBLE, NOT NEWLY BROKEN -- the same
    # reading session 2p-green's five unblocked jobs required.
    #
    # THE INSTALL CLOSURE WAS PROVEN AT THE COMMAND THE SHARDS RUN, before the edge was
    # removed, because finding 36 is that a closure proof starting anywhere else is worth
    # nothing: `python -m pytest tests/uplift tests/verify` imports `uplift.*`, so
    # `uplift/__init__.py` runs first and drags `consensus_arm -> harness -> contract ->
    # scipy` in. A static walk over 117 seed modules and 304 first-party files reports
    # every reachable third-party top-level import covered. That proof still holds after
    # the split and did not have to be redone: each shard selects a SUBSET of those same
    # paths, so its import closure is a subset of the proven one, and every shard copies
    # the install step verbatim rather than thinning it to its own subset.
    #
    # Two flagged results, neither a gap: `psycopg2` is outside this closure but imported
    # at FUNCTION scope inside
    # `try/except ImportError` with an honest degrade (`orchestrator/audit/
    # data_provenance.py:166`), and `scipy` is pinned in NO requirements file in the
    # repository yet arrives transitively via `scikit-learn` (five `agents/*/
    # requirements.txt`) and `lifelines`. A declared import resting on an unpinned
    # transitive dependency is a fragility; widening the closure to fix it is the broad
    # change defect 22's precedent rejects, so it is recorded rather than repaired.
    # The `tests/` tree was gated by NO workflow: the quality-gates unit step runs
    # `packages/tests agents orchestrator digital_twin api` and every other workflow
    # targets a single subdirectory (tests/integration, tests/oracle,
    # tests/compliance, tests/security). So the uplift harness suite and the
    # verification-gate suite executed nowhere in CI. This job group closes that hole.
    #
    # It is also the ONLY place the expensive property tests are allowed to run:
    # per `.kiro/steering/local-compute-budget.md` (I-0) the dev laptop runs
    # `HYPOTHESIS_PROFILE=dev pytest -m "not slow"`, and the real example budget is
    # spent here on Linux runners.
    steps:
      # Checked out for ONE reason: the partition step below counts files on disk. It
      # runs no Python and installs nothing, so this is ~10 seconds, and the alternative
      # was a partition claim that lived only in a comment (G5 asks for a mechanism).
      - uses: actions/checkout@v4
      - name: Every uplift shard reported success (aggregate verdict, BLOCKING)
        # THE TRUTH TABLE, because `needs.<job>.result` takes FOUR values and exactly one
        # of them is a pass:
        #
        #   result      what happened                                   verdict here
        #   success     the shard ran and every step passed             PASS
        #   failure     the shard ran and a step failed                 FAIL
        #   cancelled   the run was cancelled, or the shard timed out   FAIL
        #   skipped     the shard never ran at all                      FAIL
        #
        # TWO SHORTER SPELLINGS ARE DELIBERATELY NOT USED, and each would lose something
        # specific:
        #
        #   * `success()` alone reads all four values correctly, but says NOTHING in the
        #     log about which shard was not successful. A verdict a reader cannot act on
        #     sends them to five job pages to find out what this step already knew.
        #   * `contains(needs.*.result, 'failure')` is FALSE when a shard is `cancelled`
        #     or `skipped`, so it would pass a run in which a shard never reported. That
        #     is the same shape as the `skipped` required check the disposition above
        #     removed, one level down, and it is the reason this step enumerates the
        #     results explicitly instead of testing for the failure case.
        #
        # The loop prints every shard's result before it judges any of them, so the log
        # records the whole state even when the first shard is the one that failed.
        env:
          FAST_1: ${{ needs.uplift-verify-fast-1.result }}
          FAST_2: ${{ needs.uplift-verify-fast-2.result }}
          FAST_3: ${{ needs.uplift-verify-fast-3.result }}
          FAST_4: ${{ needs.uplift-verify-fast-4.result }}
          SLOW: ${{ needs.uplift-verify-slow.result }}
        run: |
          set -euo pipefail
          status=0
          for pair in "fast-1/4=$FAST_1" "fast-2/4=$FAST_2" "fast-3/4=$FAST_3" \
            "fast-4/4=$FAST_4" "slow=$SLOW"; do
            printf '%-10s %s\n' "${pair%%=*}" "${pair#*=}"
            if [ "${pair#*=}" != "success" ]; then
              status=1
            fi
          done
          test "$status" -eq 0
      - name: Fast shards partition tests/uplift + tests/verify exactly (G5 - BLOCKING)
        # `if: always()` FOR THE SAME REASON THE JOB CARRIES IT, and this was found by
        # reading a step list rather than a colour. On run 34685043779 the verdict step
        # above failed (the slow selection is red on another owner's finding 57), so this
        # step and the one after it reported `skipped` -- which means the G5 partition
        # proof could only ever execute on a run that was already green, and would never
        # execute at all while finding 57 stands. That is exactly "a deferred
        # verification aimed at a gated step is not a deferred verification".
        #
        # The partition's exhaustiveness and disjointness are properties of the FILE TREE
        # and the shard globs. They do not depend on whether a shard's tests passed, so
        # gating them behind a test result was the defect. All three steps now always
        # report and the job's conclusion is their conjunction.
        if: always()
        # G5: PARTITION, NEVER FILTER -- and prove it mechanically rather than assert it
        # in prose. The four fast shards select by first letter of the file name, two
        # disjoint character classes over one directory each. Disjointness holds by
        # construction (the classes share no letter); EXHAUSTIVENESS is the half that can
        # rot, because a file added tomorrow lands in a shard only if its name starts with
        # one of the 26 letters, and a new SUBDIRECTORY would land in no shard at all.
        #
        # The algebra this step relies on: each shard's set is a subset of the universe by
        # construction, so `sum(shards) == |universe|` implies BOTH exhaustive and disjoint
        # -- a file in two shards makes the sum exceed the universe, a file in none makes
        # it fall short. One equality therefore carries both halves of G5's claim.
        #
        # The universe is deliberately WIDER than the shards in two ways, so drift fails
        # closed rather than silently: it counts `*_test.py` as well as `test_*.py`
        # (pytest's default `python_files`, which `pyproject.toml` does not override), and
        # it recurses while the shard globs do not. Either kind of new file makes the
        # universe larger than the assigned total, and this step reddens.
        run: |
          set -euo pipefail
          lo='test_[abcdefghijklmno]*.py'
          hi='test_[pqrstuvwxyz]*.py'
          u1="$(find tests/uplift -maxdepth 1 -type f -name "$lo" | wc -l)"
          u2="$(find tests/uplift -maxdepth 1 -type f -name "$hi" | wc -l)"
          v1="$(find tests/verify -maxdepth 1 -type f -name "$lo" | wc -l)"
          v2="$(find tests/verify -maxdepth 1 -type f -name "$hi" | wc -l)"
          n_pre="$(find tests/uplift tests/verify -type f -name 'test_*.py' | wc -l)"
          n_suf="$(find tests/uplift tests/verify -type f -name '*_test.py' | wc -l)"
          universe=$(( n_pre + n_suf ))
          assigned=$(( u1 + u2 + v1 + v2 ))
          printf 'shard files %s/%s/%s/%s = %s; pytest universe = %s\n' \
            "$u1" "$u2" "$v1" "$v2" "$assigned" "$universe"
          test "$assigned" -eq "$universe"
      - name: Fast shards selected the pre-split test set exactly (G5 - BLOCKING)
        # `if: always()` for the same reason as the step above. Its subject is the shards'
        # own reported selection counts, which are set by a counting step that runs BEFORE
        # each shard's test step -- so the counts exist whether or not the tests passed,
        # and gating this proof behind the aggregate verdict withheld it precisely on the
        # runs where a lost path would matter most.
        if: always()
        # The file-level step above proves the PATHS partition. This one proves the
        # SELECTION does: that four shards of `-m "not slow"` still select the same tests
        # the single pre-split step selected. The two fail for different reasons, which is
        # why both exist -- a conftest change or a marker edit could keep every file in
        # exactly one shard while changing what pytest picks out of them.
        #
        # THE MAINTENANCE CONSEQUENCE, STATED RATHER THAN DISCOVERED: adding a test to
        # `tests/uplift` or `tests/verify` makes this step RED until the constant below is
        # raised in the same change. That is the intended cost. Weakening the equality to
        # `>=` would turn a partition proof into a floor, and a floor cannot notice a lost
        # path once any test has been added -- which is the one thing this step is for.
        env:
          # 874 = 871 passed + 1 skipped + 2 xpassed: the tests the PRE-SPLIT fast step
          # actually selected on run 34609187697 (sha 5bcfb03), whose summary line reads
          # `871 passed, 1 skipped, 28 deselected, 2 xpassed ... in 807.68s (0:13:27)`.
          # Collection saw 902; the 28 `slow`-marked items are deselected in every shard
          # alike and are owned by `uplift-verify-slow`, so 874 -- not 902 -- is the
          # number a partition of the FAST selection has to reproduce.
          EXPECTED_FAST_SELECTED: "874"
          FAST_1: ${{ needs.uplift-verify-fast-1.outputs.selected }}
          FAST_2: ${{ needs.uplift-verify-fast-2.outputs.selected }}
          FAST_3: ${{ needs.uplift-verify-fast-3.outputs.selected }}
          FAST_4: ${{ needs.uplift-verify-fast-4.outputs.selected }}
        run: |
          set -euo pipefail
          total=$(( FAST_1 + FAST_2 + FAST_3 + FAST_4 ))
          printf 'shards selected %s/%s/%s/%s = %s; pre-split fast selection = %s\n' \
            "$FAST_1" "$FAST_2" "$FAST_3" "$FAST_4" "$total" "$EXPECTED_FAST_SELECTED"
          test "$total" -eq "$EXPECTED_FAST_SELECTED"

  # ---------------------------------------------------------------------------
  # THE FIVE SHARD JOBS (throughput-with-integrity G5).
  #
  # WHY FIVE JOBS AND NOT ONE. Measured on run 34609187697 the pre-split job spent
  # 807.68s in the fast step and 352.22s in the slow one, serially, inside one install --
  # about 23 minutes on the critical path of a REQUIRED check. GitHub runs jobs in
  # parallel at no extra cost on a public repository, so the wall clock is the only thing
  # being bought here and runner-minutes are the only thing being spent.
  #
  # WHY FOUR FAST SHARDS AND NOT EIGHT. The install closure below is paid PER JOB, about
  # three minutes of it, so each shard adds a fixed cost to the total while dividing only
  # the variable part. At four shards the fast content is ~3:22 each against ~3:00 of
  # install: past that the install dominates and a fifth shard buys almost nothing. The
  # slow selection is NOT sharded at all -- 5:52 is not the critical path, and sharding it
  # four ways would pay three more three-minute installs to save under three minutes.
  #
  # WHY THE INSTALL STEP IS COPIED VERBATIM INTO ALL FIVE, and why it is not extracted.
  # Its own comment says the consensus arm assembles all eight real agent A2A handlers
  # plus the twin handler. A MISSING agent dependency does not crash that assembly, it
  # degrades the arm to a stub -- so a thinner environment in any one shard would turn a
  # real failure into a silent pass, which is the one outcome no amount of parallelism is
  # worth. Extracting it into a composite action or a shared script would mean editing the
  # steps of a REQUIRED status-check workflow to save four copies of fourteen lines; the
  # copies are declared in `infrastructure/quality/blocking-steps.yaml` instead, so a
  # thinned copy fails by declaration rather than by review.
  #
  # WHY EACH SHARD COUNTS ITS OWN SELECTION. `pytest` exits 5 on an empty selection, so a
  # shard whose glob went stale already reddens -- but only the count makes the partition
  # READABLE from the four logs alone, and only a reported count lets the aggregator do
  # G5's arithmetic. `set -o pipefail` is set by hand in every step that pipes, because
  # `workflow_shape_truth` cannot see an unguarded pipeline at all (finding 35: a single
  # `|` is deliberately excluded from its list-separator set, so `a | tee b` reads as
  # propagating while bash reports `tee`'s status) and this repository has a measured
  # incident where exactly that made a producer step report success on an empty artifact.
  # ---------------------------------------------------------------------------

  uplift-verify-fast-1:
    name: Uplift fast shard 1/4 - tests/uplift a-o
    runs-on: ubuntu-latest
    # Content bound: the WHOLE pre-split fast step was 807.68s (13:27) on run
    # 34609187697, so no single shard of it can cost more than that. Add checkout and
    # setup (~0:25), the install closure (~3:00) and the collection count (~0:30) and the
    # worst conceivable case is ~17:30. 30 minutes leaves ~1.7x headroom on a bound that
    # cannot be exceeded by content, and it is still a real bound: a timeout is a FAILED
    # job (I-7). The four shards carry the same number because the partition's balance is
    # a PREDICTION from file counts, not a measurement -- sizing them differently would
    # dress that prediction up as knowledge.
    timeout-minutes: 30
    outputs:
      # Read by `uplift-verify`'s partition-arithmetic step. A job output rather than an
      # artifact, deliberately: `needs.<job>.outputs.<name>` is EMPTY for a shard that
      # never ran, so a skipped or cancelled shard makes the aggregate sum wrong rather
      # than absent, and the aggregator fails on it instead of reading nothing.
      selected: ${{ steps.collect.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        # The consensus arm assembles all eight real agent A2A handlers plus the
        # twin handler, so this job needs the same dependency closure as the
        # unit-test job: agent requirements (incl. the sprint-3 bundle that carries
        # simpy) and the orchestrator stack.
        run: |
          pip install -r packages/requirements.txt -r packages/requirements-dev.txt
          pip install -e packages/
          pip install -r orchestrator/requirements.txt
          pip install jsonschema pyyaml
          for req in agents/*/requirements.txt; do pip install -r "$req"; done
          pip install simpy sse-starlette
          pip install -r agents/requirements-sprint3.txt
          pip install "starlette>=0.37.2,<0.38.0"
      - name: Selected count is non-empty and reported (fast shard 1/4)
        id: collect
        # The count is `grep -c '::'` over `--collect-only -q`, which prints one node id
        # per SELECTED item: every test node id contains `::` and nothing else pytest
        # prints in that mode does. So a format surprise yields zero, not a wrong number,
        # and the `test ... -gt 0` below reddens instead of reporting a silent miscount.
        #
        # `-o addopts="--strict-markers"` replaces the ini `addopts` for this invocation
        # only. `pyproject.toml` carries `--strict-markers -v --tb=short`, and that `-v`
        # would cancel the `-q` below into verbosity 0, which switches pytest to the
        # indented `<Module>`/`<Function>` tree form -- no `::`, count zero, red step for a
        # reason that has nothing to do with the partition. `--strict-markers` is kept
        # because dropping it would let this step accept a marker the run step rejects;
        # nothing else in `addopts` affects WHAT is selected, which is the only property
        # this count has to share with the run step below.
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          set -euo pipefail
          pytest -o addopts="--strict-markers" -m "not slow" --collect-only -q \
            tests/uplift/test_[abcdefghijklmno]*.py | tee "$RUNNER_TEMP/selected.txt"
          selected="$(grep -c '::' "$RUNNER_TEMP/selected.txt")"
          printf 'selected=%s\n' "$selected" >> "$GITHUB_OUTPUT"
          printf 'fast shard 1/4: %s test(s) selected\n' "$selected"
          test "$selected" -gt 0
      - name: Property + unit tests (fast - full 500-example budget, shard 1/4)
        # Pure/synthetic properties: no twin, no consensus network, so the full
        # `ci` budget is cheap here. Scope is deliberately `tests/` only: the
        # non-slow tests under `orchestrator/` and `digital_twin/` are already run
        # by `quality-gates`, and running them twice would double the wall clock
        # without adding a single new assertion.
        #
        # The path expression is the partition and nothing else: a shell glob over file
        # NAMES, with `-m "not slow"` unchanged from the pre-split step. No `-k`, no
        # `--deselect`, no added marker -- each of those would be a filter, and a filter
        # cannot be shown exhaustive (G5).
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          pytest tests/uplift/test_[abcdefghijklmno]*.py -m "not slow" -v --tb=short

  uplift-verify-fast-2:
    name: Uplift fast shard 2/4 - tests/uplift p-z
    runs-on: ubuntu-latest
    # See shard 1/4 for the arithmetic behind this bound.
    timeout-minutes: 30
    outputs:
      selected: ${{ steps.collect.outputs.selected }}
    steps:
