name: SYNAPSE Mutation Testing
on:
  schedule:
    - cron: '0 4 * * 0'

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r packages/requirements.txt -r packages/requirements-dev.txt
      - name: Run mutmut on guardrails
        run: |
          cd packages
          mutmut run --paths-to-mutate=synapse_common/contracts.py --tests-dir=tests/ || true
          mutmut results
