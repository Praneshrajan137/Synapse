name: SYNAPSE Mutation Testing

on:
  schedule:
    - cron: '0 2 * * 0'  # Sunday 2AM UTC
  workflow_dispatch:
  # Sprint 13 §Phase 4.2 (C30): PR-trigger on changes to the highest-leverage
  # mutation targets. The full-matrix Sunday cron still runs `mutation` job.
  # The `mutation-fast` job below only mutates the files touched in the PR,
  # keeping wall-clock under ~10 min while making regressions on rewards /
  # guardrails / audit fail CI before merge to main.
  pull_request:
    paths:
      - 'agents/*/training/rewards.py'
      - 'orchestrator/guardrails/rules.py'
      - 'orchestrator/audit/logger.py'
      - 'orchestrator/audit/hash_chain.py'

env:
  PYTHONPATH: "."

jobs:
  mutation:
    # Full-matrix run — scheduled + manual dispatch only. NOT on pull_request
    # (see mutation-fast below for the PR-blocking subset).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install project dependencies
        run: |
          pip install -r packages/requirements.txt -r packages/requirements-dev.txt
          # Install the shared package (synapse_common) and CPU torch: the reward
          # mutation target (agents/*/training/rewards.py) and its test import
          # both `torch` and `synapse_common`, so without these the gate fails at
          # COLLECTION ("No module named 'synapse_common'") rather than measuring
          # mutation survival.
          pip install -e packages/
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<2.4"
          pip install -r orchestrator/requirements.txt
          if [ -f agents/requirements-sprint2.txt ]; then pip install -r agents/requirements-sprint2.txt; fi
          if [ -f agents/requirements-sprint3.txt ]; then pip install -r agents/requirements-sprint3.txt; fi

      - name: Run mutation tests — Reward Functions (< 15% survival, CLAUDE.md gate)
        run: |
          set -e
          AGENTS="demand_prophet routing_navigator inventory_sentinel pricing_oracle freshness_guardian disruption_shield supplier_trust sustainability_agent"
          for agent in $AGENTS; do
            REWARD_FILE="agents/${agent}/training/rewards.py"
            TEST_FILE="agents/${agent}/tests/test_reward.py"
            if [ -f "${REWARD_FILE}" ] && [ -f "${TEST_FILE}" ]; then
              echo "=== Mutating ${agent} rewards ==="
              SAFETY_FILE="agents/${agent}/tests/test_reward_safety.py"
              RUNNER="python -m pytest ${TEST_FILE}"
              if [ -f "${SAFETY_FILE}" ]; then
                RUNNER="${RUNNER} ${SAFETY_FILE}"
              fi
              RUNNER="${RUNNER} -x -q"
              rm -rf .mutmut-cache
              set +e
              mutmut run \
                --paths-to-mutate="${REWARD_FILE}" \
                --tests-dir="agents/${agent}/tests/" \
                --runner="${RUNNER}"
              mutmut_status=$?
              set -e
              if [ $((mutmut_status & 1)) -ne 0 ]; then
                exit "${mutmut_status}"
              fi
              mutmut results
              python scripts/check_mutation_threshold.py \
                --threshold 15 --label "rewards/${agent}"
              mv .mutmut-cache ".mutmut-cache-${agent}"
            else
              echo "=== SKIP ${agent}: reward or test file missing ==="
            fi
          done

      - name: Run mutation tests — Guardrails (< 10% survival, CLAUDE.md gate)
        run: |
          if [ -f "orchestrator/guardrails/rules.py" ]; then
            rm -rf .mutmut-cache
            set +e
            mutmut run \
              --paths-to-mutate="orchestrator/guardrails/rules.py" \
              --tests-dir="orchestrator/tests/" \
              --runner="python -m pytest orchestrator/tests/ -x -q -k guardrail"
            mutmut_status=$?
            set -e
            if [ $((mutmut_status & 1)) -ne 0 ]; then
              exit "${mutmut_status}"
            fi
            mutmut results
            python scripts/check_mutation_threshold.py \
              --threshold 10 --label "guardrails"
            mv .mutmut-cache .mutmut-cache-guardrails
          fi

      - name: Run mutation tests — Audit (< 10% survival, CLAUDE.md gate)
        run: |
          if [ -f "orchestrator/audit/logger.py" ]; then
            rm -rf .mutmut-cache
            set +e
            mutmut run \
              --paths-to-mutate="orchestrator/audit/logger.py" \
              --tests-dir="orchestrator/tests/" \
              --runner="python -m pytest orchestrator/tests/ -x -q -k audit"
            mutmut_status=$?
            set -e
            if [ $((mutmut_status & 1)) -ne 0 ]; then
              exit "${mutmut_status}"
            fi
            mutmut results
            python scripts/check_mutation_threshold.py \
              --threshold 10 --label "audit"
            mv .mutmut-cache .mutmut-cache-audit
          fi

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: .mutmut-cache-*
          include-hidden-files: true
          retention-days: 30

  mutation-fast:
    # Sprint 13 §Phase 4.2 (C30): runs ONLY the changed-target mutmut sweep on
    # pull_request. Parallel to frontend Stryker (C16, frontend.yml). The
    # CLAUDE.md thresholds (<15% rewards, <10% guardrails/audit) are enforced
    # by scripts/check_mutation_threshold.py — a regression on a PR fails CI
    # before merge to main. The PR gate mutates only lines changed by the PR
    # via mutmut's patch-file mode; the scheduled/manual `mutation` job above
    # remains the whole-file sweep for full reward/audit/guardrail debt.
    # Sprint-9 reward-default work can legitimately touch six reward targets,
    # so the timeout covers the full changed-target sweep.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history to diff vs base ref

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install project dependencies
        run: |
          pip install -r packages/requirements.txt -r packages/requirements-dev.txt
          # mutmut launches pytest in subprocesses; install the shared package
          # exactly as ci.yml does so synapse_common imports survive collection.
          pip install -e packages/
          pip install -r orchestrator/requirements.txt
          for req in agents/*/requirements.txt; do pip install -r "$req"; done

      - name: Detect changed mutation targets
        id: targets
        run: |
          set -e
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "${BASE_REF}" HEAD || true)
          echo "Changed files:"
          echo "${changed}"
          # Intersect changed files with the gated mutation target set
          targets=""
          for f in ${changed}; do
            case "${f}" in
              agents/*/training/rewards.py|orchestrator/guardrails/rules.py|orchestrator/audit/logger.py|orchestrator/audit/hash_chain.py)
                targets="${targets} ${f}"
                ;;
            esac
          done
          targets=$(echo "${targets}" | xargs)
          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"
          if [ -z "${targets}" ]; then
            echo "No gated mutation targets changed -- nothing to do."
          fi

      - name: Run mutmut on changed targets
        if: steps.targets.outputs.targets != ''
        run: |
          set -e
          for target in ${{ steps.targets.outputs.targets }}; do
            echo "=== Mutating ${target} ==="
            # Pick the matching test file by convention.
            case "${target}" in
              agents/*/training/rewards.py)
                agent_dir=$(dirname $(dirname "${target}"))
                test_path="${agent_dir}/tests/test_reward.py"
                safety_path="${agent_dir}/tests/test_reward_safety.py"
                runner="python -m pytest ${test_path}"
                if [ -f "${safety_path}" ]; then
                  runner="${runner} ${safety_path}"
                fi
                runner="${runner} -x -q"
                threshold=15
                label="rewards/$(basename ${agent_dir})"
                ;;
              orchestrator/guardrails/rules.py)
                test_path="orchestrator/tests/test_guardrails.py"
                runner="python -m pytest ${test_path} -x -q"
                threshold=10
                label="guardrails/rules"
                ;;
              orchestrator/audit/logger.py)
                test_path="orchestrator/tests/test_audit_logger.py"
                runner="python -m pytest ${test_path} -x -q"
                threshold=10
                label="audit/logger"
                ;;
              orchestrator/audit/hash_chain.py)
                test_path="orchestrator/tests/test_hash_chain.py"
                runner="python -m pytest ${test_path} -x -q"
                threshold=10
                label="audit/hash_chain"
                ;;
            esac
            if [ ! -f "${test_path}" ]; then
              echo "WARN: no matching test file at ${test_path} -- failing mutation for safety"
              exit 1
            fi
            cache_label=$(echo "${label}" | tr '/' '-')
            patch_file=".mutmut-${cache_label}.patch"
            git diff --unified=0 "${{ github.event.pull_request.base.sha }}" HEAD -- "${target}" > "${patch_file}"
            if [ ! -s "${patch_file}" ]; then
              echo "WARN: no patch hunks for ${target} -- failing mutation for safety"
              exit 1
            fi
            rm -rf .mutmut-cache
            set +e
            mutmut run \
              --paths-to-mutate="${target}" \
              --use-patch-file="${patch_file}" \
              --tests-dir="$(dirname ${test_path})" \
              --runner="${runner}"
            mutmut_status=$?
            set -e
            if [ $((mutmut_status & 1)) -ne 0 ]; then
              exit "${mutmut_status}"
            fi
            mutmut results
            python scripts/check_mutation_threshold.py \
              --threshold "${threshold}" --label "${label}"
            mv .mutmut-cache ".mutmut-cache-${cache_label}"
          done

      - name: Upload mutation-fast results
        if: always() && steps.targets.outputs.targets != ''
        uses: actions/upload-artifact@v4
        with:
          name: mutation-fast-results
          path: |
            .mutmut-cache
            .mutmut-cache-*
          include-hidden-files: true
          retention-days: 30
