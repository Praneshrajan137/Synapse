name: Sprint 6 E2E — Oracle Cloud (quality-preserving)

# Quality-preserving remote execution of Sprint 6 verification.
#
# Runs on the Oracle Cloud Always-Free ARM64 VM (24 GB RAM) registered as a
# GitHub Actions self-hosted runner. This is the ONLY $0 path that keeps the
# full stack live: real Ollama, all 9 Mumbai containers, orchestrator, nginx,
# full Kafka/Neo4j heap sizes. See plans/cheerful-wiggling-boole.md Part J.
#
# Prerequisites (one-time):
#   1. terraform apply in infrastructure/oracle/terraform/
#   2. Bootstrap VM via infrastructure/oracle/setup_oracle_vm.sh with
#      GH_RUNNER_URL + GH_RUNNER_TOKEN env vars set.
#   3. (Optional) Provision Neo4j Aura free tier and store
#      NEO4J_AURA_URI / NEO4J_AURA_USER / NEO4J_AURA_PASSWORD as repo secrets.

on:
  workflow_dispatch:
    inputs:
      run_demo:
        description: "Run demo after verification"
        type: boolean
        default: true
      speed_factor:
        description: "Demo speed factor (higher = faster)"
        type: string
        default: "3.0"
      skip_transfer_train:
        description: "Skip transfer-train (useful for re-runs after models cached)"
        type: boolean
        default: false

concurrency:
  group: sprint6-e2e-oracle
  cancel-in-progress: false

jobs:
  sprint6-e2e:
    name: Sprint 6 End-to-End (Oracle ARM64)
    runs-on: [self-hosted, linux, arm64, oracle]
    timeout-minutes: 180

    env:
      # Swap Docker Hub OSRM for the ARM64 build (built once, cached in GHCR).
      OSRM_IMAGE: ghcr.io/${{ github.repository_owner }}/synapse-osrm-arm64:v5.27.1
      # Neo4j Aura (optional — if unset, compose brings up local Neo4j container).
      NEO4J_AURA_URI: ${{ secrets.NEO4J_AURA_URI }}
      NEO4J_AURA_USER: ${{ secrets.NEO4J_AURA_USER }}
      NEO4J_AURA_PASSWORD: ${{ secrets.NEO4J_AURA_PASSWORD }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Preflight — VM resources (informational diagnostics)
        # R11.3 (decision-quality-proof task 3.2). This step asserts nothing: it prints
        # RAM, CPU count, disk, the Docker architecture line and whichever Ollama models
        # the host reports, so that a later failure can be read against the machine it
        # ran on. Its last command is `... || echo "Ollama not reachable on host"`, which
        # makes the step's exit status unconditionally 0 -- correctly, because an
        # unreachable Ollama is information the log should carry, not a reason to stop
        # before the stack is even up.
        #
        # Labelled rather than made propagating. The alternative reading -- treat this as
        # the job's Ollama precondition and let the probe fail the run -- would give the
        # step a gating purpose it was never written for, and would ALSO make `docker
        # info | grep -E ...` load-bearing, where grep exits 1 simply because a field
        # name changed. The steps that actually need Ollama fail on their own terms with
        # a message about the thing that was missing, which is the more actionable
        # failure. Marker in the name so the shape gate reads the intent that the `||
        # echo` already expresses (I-7: a step that measures is not a step that gates).
        run: |
          echo "=== RAM ==="
          free -h
          echo "=== CPUs ==="
          nproc
          echo "=== Disk ==="
          df -h /
          echo "=== Docker ==="
          docker info | grep -E "Architecture|CPUs|Total Memory" || true
          echo "=== Ollama (host) ==="
          curl -sf http://localhost:11434/api/tags | python3 -c "import sys,json; [print(m['name']) for m in json.load(sys.stdin)['models']]" || echo "Ollama not reachable on host"

      - name: Python 3.11 venv + deps
        run: |
          source "$HOME/.venv/synapse/bin/activate"
          pip install --quiet -r packages/requirements.txt -r packages/requirements-dev.txt
          pip install --quiet feast mlflow neo4j confluent-kafka psycopg2-binary jsonschema pyyaml requests

      - name: Ensure ARM64 OSRM image present
        run: |
          if ! docker image inspect "$OSRM_IMAGE" >/dev/null 2>&1; then
            echo "Building $OSRM_IMAGE (first run only, ~20 min)…"
            docker buildx build \
                --platform linux/arm64 \
                --tag "$OSRM_IMAGE" \
                --load \
                -f infrastructure/osrm/Dockerfile.osrm-arm64 \
                infrastructure/osrm
          else
            echo "$OSRM_IMAGE already cached."
          fi

      - name: M0 — Start base infrastructure
        run: |
          source "$HOME/.venv/synapse/bin/activate"
          make up
          make verify-infra

      - name: M1–M3 — Generate + convert city data
        run: |
          source "$HOME/.venv/synapse/bin/activate"
          make generate-bengaluru
          make sprint5-exit-gate
          make generate-mumbai
          make convert-parquet-mumbai

      - name: M3b — OSRM Mumbai data prep (extract/partition/customize)
        run: |
          source "$HOME/.venv/synapse/bin/activate"
          bash scripts/setup_osrm_mumbai.sh

      - name: M4 — Seed Neo4j (Bengaluru + Mumbai)
        run: |
          source "$HOME/.venv/synapse/bin/activate"
          make seed
          make seed-mumbai

      - name: Feast Mumbai apply + materialize
        run: |
          source "$HOME/.venv/synapse/bin/activate"
          cd data_fabric/feast/mumbai
          feast apply
          feast materialize-incremental "$(date -u +%Y-%m-%dT%H:%M:%S)"

      - name: M5 — Transfer learning (7 agents)
        if: ${{ !inputs.skip_transfer_train }}
        run: |
          source "$HOME/.venv/synapse/bin/activate"
          make transfer-train

      - name: M6 — Cold-start baselines
        run: |
          source "$HOME/.venv/synapse/bin/activate"
          make cold-start-baseline

      - name: M7 — A/B tests
        run: |
          source "$HOME/.venv/synapse/bin/activate"
          make ab-test

      - name: M8a — Mumbai overlay up (9 containers)
        run: make mumbai-up

      - name: M8b — Sprint 6 verification (39 + 8 invariant tests)
        run: |
          source "$HOME/.venv/synapse/bin/activate"
          PYTHONPATH=. pytest scripts/verify/test_multi_city.py \
              -v --tb=short \
              --junitxml=artifacts/junit.xml

      - name: Demo execution
        if: ${{ inputs.run_demo }}
        run: bash scripts/demo/run_demo.sh mumbai ${{ inputs.speed_factor }}

      - name: Capture evidence artifacts (informational, best-effort)
        # R11.3 (decision-quality-proof task 3.2). Every command here is deliberately
        # suppressed and the step is `if: always()`, because its whole job is to salvage
        # whatever evidence exists AFTER a failure: `compose ps` when the stack is half
        # down, `packages/coverage.xml` when the test step never got far enough to write
        # one, an MLflow dump when the container is already gone, a Grafana render when
        # port 3000 never came up. The absence of any one of those is a CONSEQUENCE of
        # the failure being investigated, so failing here would replace a real
        # diagnosis with a second, derivative failure and -- worse -- abort the
        # remaining captures under `bash -e`.
        #
        # Labelled rather than made propagating, and the label is the honest one: the
        # step's exit status has never meant anything, and the verdict of this job is
        # owned by "M8b - Sprint 6 verification", which propagates. A capture that wrote
        # nothing is still visible: "Upload evidence artifact" below leaves
        # `if-no-files-found` at upload-artifact's default of `warn`, so an empty
        # `artifacts/` surfaces in the run log rather than reading as a successful
        # capture (I-7).
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.mumbai.yml ps \
              > artifacts/compose-ps.txt || true
          free -h > artifacts/memory-after.txt || true
          cp packages/coverage.xml artifacts/ 2>/dev/null || true
          docker exec synapse-mlflow sqlite3 /mlflow/mlflow.db .dump \
              > artifacts/mlflow.sql 2>/dev/null || true
          curl -s "http://localhost:3000/render/d-solo/synapse-overview?panelId=1&width=1200&height=600" \
              -o artifacts/grafana-overview.png 2>/dev/null || true
          curl -s "http://localhost:9090/api/v1/rules" \
              -o artifacts/prometheus-rules.json 2>/dev/null || true
          dmesg | tail -200 > artifacts/dmesg-tail.txt 2>/dev/null || true

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint6-e2e-evidence
          path: artifacts/
          retention-days: 30

      - name: Teardown (preserve volumes) — informational, best-effort
        # R11.3 (decision-quality-proof task 3.2). `if: always()` plus three suppressed
        # commands, on purpose: this runs on a SELF-HOSTED Oracle VM, so it is the only
        # thing that returns the machine to a state the next run can use. Every command
        # must be attempted even when an earlier one has nothing to act on -- `make
        # mumbai-down` when the overlay never came up, `compose stop` when the base stack
        # is already down, `image prune` when nothing is older than 168h. Under `bash -e`
        # an unsuppressed first failure would skip the rest and leave the runner dirty,
        # which is the opposite of what a teardown is for.
        #
        # Labelled rather than made propagating: a teardown's exit status is not a
        # statement about the software under test, and turning cleanup noise into a red
        # run would make every genuine failure of this job ambiguous. Volumes are
        # preserved deliberately (`stop`, not `down -v`) so postgres/neo4j state survives
        # between runs, which is also why nothing here may be allowed to abort early.
        if: always()
        run: |
          make mumbai-down || true
          docker compose -f docker/docker-compose.yml stop || true
          docker image prune -af --filter "until=168h" || true
