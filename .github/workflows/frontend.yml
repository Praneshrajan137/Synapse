name: SYNAPSE Frontend CI

on:
  push:
    branches: [main, develop, "sprint-*", "claude/*"]
    paths:
      - "frontend/**"
      - "proto/domain/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "proto/domain/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Lint • Typecheck • Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.18"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Biome lint
        run: pnpm lint

      - name: TypeScript strict
        run: pnpm typecheck

      - name: Vitest unit + property tests
        run: pnpm test:coverage

      - name: Upload coverage
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  build:
    name: Vite build + size budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Build
        run: pnpm build
      - name: Size budget
        run: pnpm size || true   # informational in P0; gated in P2 per plan §17

  fe-invariants:
    name: FE-INV registry coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate FE-INV registry
        working-directory: .
        run: python frontend/spec/check_fe_invariants.py

  e2e:
    name: Playwright E2E + axe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    # Sprint 12 (ADR-039): E2E only runs against pull_request previews and
    # `v*` tag pushes. Push-to-main produces no useful E2E signal because
    # `pnpm preview` has no backend on the runner — every /api proxy returns
    # ECONNREFUSED and the suite fails by design. Backend-up signal is the
    # job of the cd-gcp.yml `Wait for health` step against the real VM.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  license-audit:
    name: License audit (I-1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - name: License audit (allow MIT/Apache-2.0/BSD/ISC/MPL-2.0)
        run: |
          npx --yes license-checker-rseidelsohn \
            --production \
            --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;BSD;ISC;MPL-2.0;CC0-1.0;CC-BY-4.0;Unlicense;0BSD;Python-2.0" \
            --excludePackages "synapse-console" \
            --summary

  mutation:
    name: Stryker mutation (FE-INV-006/008/012/028 — guardrails)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: quality
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - name: Stryker mutation (break threshold 85% killed)
        run: pnpm mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: frontend/reports
          retention-days: 14

  sbom:
    name: CycloneDX SBOM (I-1 supply chain)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - name: Generate CycloneDX SBOM
        run: pnpm sbom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-sbom
          path: frontend/sbom.cdx.json
          retention-days: 90

  audit-supply:
    name: Supply-chain audit (pnpm audit + lockfile HTTPS/host check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - name: pnpm audit (high+ severity)
        run: pnpm audit --audit-level=high
      - name: pnpm-lock supply-chain check (HTTPS + registry.npmjs.org only)
        run: node scripts/check-supply-chain.mjs
