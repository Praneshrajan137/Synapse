name: SYNAPSE Frontend CI

on:
  push:
    branches: [main, develop, "sprint-*", "claude/*"]
    paths:
      - "frontend/**"
      - "proto/domain/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "proto/domain/**"
      - ".github/workflows/frontend.yml"

# A superseded pull-request push stops spending runner time: a newer push to the same PR
# cancels this workflow's in-progress run for the older head, whose verdict nobody can act
# on. Every other run is keyed by its own run id, so it shares a group with nothing and is
# never cancelled -- GitHub cancels a PENDING run when a newer one joins its group whatever
# `cancel-in-progress` says, so a sha key would let two pushes of one commit collide.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Lint • Typecheck • Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # R3.5: the EFFECTIVE fast-check example count, now that the console suite
      # inherits its budget from a profile instead of stating `{ numRuns: 100 }` at
      # every call site (`frontend/src/test/fc-budget.ts`, applied by
      # `frontend/src/test/setup.ts`). This variable is load-bearing, not decorative:
      # unset resolves to `dev` = 10 by design, because an unset variable is the LOCAL
      # case and under I-0 the local case must be the cheap one. CI must therefore say
      # what it wants out loud.
      #
      # `heavy` = 100 and not `ci` = 500, deliberately. 100 is exactly the budget every
      # one of the 48 removed call sites stated, so the inversion is COST-NEUTRAL: this
      # job runs the same number of examples it ran yesterday, and R3.5's ">= 100" is
      # met by the value the Property_Inventory_Gate used to require. `ci` would be a
      # 5x increase in console property work against a 15-minute budget nobody has
      # measured at that scale, which is a separate decision with its own evidence.
      HYPOTHESIS_PROFILE: heavy
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Biome lint
        run: pnpm lint

      - name: TypeScript strict
        # decision-quality-proof task 2.1 (R2.2, R2.3). Blocking, and it must stay
        # blocking. R2.3 is satisfied at BOTH scopes, which is the part that is easy
        # to break from a distance: this step carries no `continue-on-error`, and
        # neither does the `quality:` job, because
        # `workflow_shape_truth._continue_on_error_construct` reads a JOB-scoped
        # setting as discarding for every step in the job. A `continue-on-error` added
        # to `quality:` would therefore defeat this step without editing this line.
        # The `run:` is a single top-level command with no `&&`/`||`/`;` list, so
        # `final_list_element` returns it unchanged and no discarding construct is
        # present under the gate's own reading (R4.12).
        #
        # Why the propagation carries the weight it does, re-confirmed by reading the
        # `needs:` graph in this file rather than carried from a draft. Line numbers
        # are deliberately NOT cited: a comment in this file that quotes this file's
        # own offsets invalidates itself on the next edit, which is the drift R2's own
        # authoring notes ran into. The edges instead, each read off a `needs:` key --
        # `build` needs `quality`; `contract-fidelity` needs `quality`; `mutation`
        # needs `quality`; `e2e`, `e2e-visual`, `e2e-harness` and `mobile-lighthouse`
        # each need `build`; `effectiveness-ratchet` needs `e2e-harness`; and
        # `fe-invariants` needs [quality, e2e, e2e-visual, e2e-harness,
        # storybook-a11y]. NINE of this workflow's fifteen jobs are downstream of
        # this one command; the six that are not are `quality` itself,
        # `spec-typecheck`, `license-audit`, `sbom`, `audit-supply` and
        # `storybook-a11y`. Property 31's file
        # (`src/surfaces/__tests__/degradation-rendering.property.test.ts`) is inside
        # `tsconfig.json`'s `include`, so one type error there skips the whole
        # console-effectiveness spine -- which R2.11 requires
        # `scripts/audit/gate_surface.py` render as NOT EXECUTED, never as a pass
        # (I-7).
        run: pnpm typecheck

      - name: Vitest unit + property tests
        run: pnpm test:coverage

      - name: Upload coverage
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Upload Vitest run record (FE-INV attestation evidence, R8.7)
        # The `fe-invariants` job gates the registry on EXECUTED, non-skipped
        # assertions read from this file. Uploaded on failure too: a red suite is
        # still evidence of what ran, and a MISSING record must read as
        # `unavailable` to that gate rather than as a pass (I-7).
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: fe-invariant-vitest-report
          path: frontend/artifacts/test-reports/vitest.json
          retention-days: 7

  spec-typecheck:
    name: TypeScript strict — spec/ + tests/ (the trees tsconfig.json never checked)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # purpose-achievement-audit task 12.2. `tsconfig.json`'s `include` covers `src`,
    # the four config files, and exactly two files under `spec/effectiveness/`
    # (`harness.ts`, `e2e-entry.ts`). So `pnpm typecheck` and the `tsc --noEmit`
    # inside `pnpm build` have never checked `arbitraries.ts`, `run-ratchet.ts`,
    # `check-baseline.ts`, `real-stack-fidelity.ts`, `scorecard-emission.ts`,
    # `scorecard-gate.ts`, every property test in
    # `spec/effectiveness/__tests__/`, `spec/contract-fidelity/**`, or ANY e2e spec
    # under `tests/**`. `pnpm lint` is `biome check ./src`, so they are not linted
    # either. They execute under vitest/Playwright, esbuild-transpiled without a type
    # check. `frontend/tsconfig.spec.json` (new) is the project that checks them; its
    # header records why this is a separate project rather than a wider `include`.
    #
    # DELIBERATELY A STANDALONE JOB with no `needs:` and nothing depending on it.
    # Widening the base `include` would have put these files inside `pnpm build`, and
    # `build` gates `e2e`, `e2e-visual`, `e2e-harness`, `mobile-lighthouse`,
    # `effectiveness-ratchet` and `fe-invariants` -- one pre-existing error would have
    # taken the whole console-effectiveness spine to NOT EXECUTED. Isolated here, a
    # failure is a failure of exactly this gate.
    #
    # EXPECTED RED ON LANDING (I-7): this code has never been compiled, and it now
    # meets `noUncheckedIndexedAccess`, `exactOptionalPropertyTypes` and
    # `noUnusedLocals`. Errors in the four older property tests and in the e2e specs
    # are pre-existing debt becoming visible, not a regression. Blocking on purpose:
    # no `|| true`, no `continue-on-error`. The fix is to fix the types, never to
    # narrow the project back.
    #
    # A PREDICTION OF RED IS NOT A DISPENSATION (decision-quality-proof R2.15)
    # -----------------------------------------------------------------------
    # The paragraph above predicts this job fails on its first CI run. That prediction
    # licenses nothing. It does not license `continue-on-error` on this step or on this
    # job, it does not license narrowing `tsconfig.spec.json`'s `include` back, and it
    # does not license reading the red as "checked anyway".
    #
    # What it DOES oblige: WHILE this job reports one or more TypeScript errors, the
    # four declared property files under `frontend/spec/effectiveness/__tests__/`
    # (Properties 32, 33, 34, 36) are described as authored but NOT TYPE-CHECKED in
    # every document that refers to them. That obligation has a mechanical subject
    # rather than a prose one: each of the four carries
    # `type_check_project: frontend/tsconfig.spec.json` in
    # `infrastructure/quality/fe-invariant-attestation.yaml`, read by
    # `frontend/spec/check_fe_invariants.py`. Property 31's file lives under `src/` and
    # belongs to `quality`'s `pnpm typecheck`, not to this project -- the two verdicts
    # are separate and must not be reported as one.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: TypeScript strict (spec/ + tests/)
        # decision-quality-proof task 2.1 (R2.4, R2.5). No `continue-on-error` at step
        # scope and none on `spec-typecheck:` either -- a job-scoped setting would be
        # read as discarding for this step by
        # `workflow_shape_truth._continue_on_error_construct`. The `run:` is a single
        # top-level command with no `&&`/`||`/`;` list, so the gate's terminal reading
        # (`final_list_element`, which sees only the FINAL element of a command list,
        # R4.12) resolves to `pnpm typecheck:spec` itself. Its exit status is the
        # step's, the step's is the job's, and that is the whole point of the job.
        run: pnpm typecheck:spec

  build:
    name: Vite build + size budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Build
        run: pnpm build
      - name: Entry preloads exclude the heavy viz chunks (FE-INV-025)
        # Lists every asset dist/index.html loads before the app renders -- the module script,
        # each modulepreload / preload / stylesheet, and every chunk those reach by static
        # import -- with raw and gzip bytes, and FAILS naming the file when a `deck-`, `map-`
        # or `graph-` chunk is among them (FE-INV-025: async-only). A missing or empty
        # document fails too: nothing is not a pass (I-7). Not a byte budget; `viz-`/`visx-`
        # are listed, not forbidden, for the reason in the script's header.
        #
        # Blocking, and declared so in infrastructure/quality/blocking-steps.yaml by its exact
        # name: no `continue-on-error`, no `|| true`, one top-level command. `e2e`,
        # `e2e-visual`, `e2e-harness` and `mobile-lighthouse` need this job, so a heavy chunk
        # back on "/" stops them from running at all -- the mobile LCP spec would only
        # re-measure a regression this step has already named.
        run: node scripts/check-entry-preloads.mjs
      - name: Entry chunk <= 180 KB and react-vendor <= 70 KB, gzipped (FE-INV-014)
        # FE-INV-014 as reworded on 2026-11-01 (operator decision S13.2=a): the ENTRY CHUNK
        # ships <= 180 KB gzipped. `pnpm size` runs size-limit 11.2.0 over package.json's
        # "size-limit" block. Each entry sets `gzip: true`, so @size-limit/file gzips at level 9
        # where its default is brotli, and `running: false`, so no headless Chrome runs.
        # size-limit reads "180 KB" as 180,000 bytes. The entry's pattern is
        # `dist/assets/entry-*.js`, a prefix vite.config.ts's `entryFileNames` gives the entry
        # chunk alone. The step exits 1 when a chunk exceeds its limit, and also when a pattern
        # matches no file, so a rename cannot turn it into a pass.
        #
        # What the old step measured, on PR #84's build job (run 41298456048, job
        # 124824795769, sha 6ff4973): the check named "entry bundle (gzip)" printed 112.37 kB
        # BROTLIED, and its pattern `dist/assets/index-*.js` matched two chunks, the entry and
        # the lazy `index-yVVMv7SB.js` (6.17 kB gzip). react-vendor printed 67.84 kB gzip
        # against its 70 KB limit. Its `|| true` meant none of it could fail the job.
        #
        # What this step cannot see: the rest of the eager set. dist/index.html also loads
        # react-vendor, zod, query and runtime before the app renders, and the FE-INV-025 step
        # above printed the eager JS as 216587 B gzip (211.5 KiB) at that sha, above 180 KB.
        # FE-INV-014's description discloses that and claims nothing about it; the figure
        # predates the zod 4 port (f167098). For the same file the two steps print slightly
        # different gzip bytes: that table uses zlib's default level, this step level 9.
        #
        # Blocking, and declared so by this exact name in
        # infrastructure/quality/blocking-steps.yaml: no `|| true`, no `continue-on-error`,
        # one top-level command.
        run: pnpm size

  contract-fidelity:
    name: Contract fidelity drift (Req 1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Contract fidelity drift report
        # Runs against the checked-in OpenAPI snapshot (deterministic, offline).
        # Fails non-zero and names the endpoint/channel if an entitled
        # capability is uncovered/partial; out-of-scope never fails.
        run: pnpm contract:drift
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: contract-drift-report
          path: |
            frontend/spec/contract-fidelity/drift-report.json
            frontend/spec/contract-fidelity/drift-report.md
          retention-days: 14

  storybook-a11y:
    name: Storybook a11y - zero axe violations per story (FE-INV-031)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # FE-INV-031: every Storybook story has zero axe-core violations of the WCAG 2.0 and 2.1
    # level A and AA rules. The check lives in frontend/.storybook/test-runner.ts: its
    # `postVisit` hook runs @axe-core/playwright over `#storybook-root` after each story
    # renders and throws, naming each violation's id, impact and targets, so that story's
    # test fails. Every tool here is already in package.json (storybook,
    # @storybook/test-runner, @axe-core/playwright, Playwright) or on the runner image
    # (python3, curl): no new dependency (I-1).
    #
    # Same run policy as `e2e` (ADR-039): pull requests and `v*` tags only. No `needs:`, like
    # `spec-typecheck`: the static Storybook build does not use `build`'s bundle, and a red
    # `quality` would only hide this verdict, not change it.
    #
    # The run record is Jest's JSON (`--json --outputFile`), which
    # frontend/spec/check_fe_invariants.py reads in its Vitest/Jest shape. In the
    # test-runner's default mode every stories file IS a Jest test file, so
    # `testResults[].name` is that file's absolute path, for example
    # /home/runner/work/<repo>/<repo>/frontend/src/design-system/compounds/TierBadge.stories.tsx,
    # whose trailing segments are the registry's frontend/src/... spelling. `--no-index-json`
    # pins that mode: index-json mode would name generated files in a temporary directory,
    # and FE-INV-031 would read `not_executed`.
    #
    # What the check cannot see is stated in test-runner.ts's header: nodes outside the story
    # root, checks axe leaves incomplete (printed per story, never failed), and the
    # full-motion rendering.
    #
    # EXPECTED RED ON LANDING (I-7): reading the components predicts colour-contrast
    # violations in several stories. That red is the finding. It licenses no disabled rule and
    # no excluded story; the repair is to the components. `fe-invariants` needs this job, so a
    # red here also skips the registry gate, which scripts/audit/gate_surface.py renders as
    # NOT EXECUTED rather than as a pass.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the static Storybook
        # package.json `storybook:build` = `storybook build -o .storybook-static`. Storybook's
        # Vite builder keeps vite.config.ts's plugins and aliases and only `target` from its
        # `build` block, so the production chunk names do not apply here.
        run: pnpm storybook:build
      - name: Serve the static Storybook on 127.0.0.1:6006 (bounded wait)
        # Python's stdlib file server, backgrounded with its log in $RUNNER_TEMP so it holds no
        # pipe of this step; the runner stops it when the job ends. The loop waits at most
        # 30 s for iframe.html, the document the test-runner loads, and the final probe's exit
        # status is the step's: a server that never answers, or a build that produced no
        # iframe.html (a 404), fails here by name instead of as one refused story per test.
        run: |
          python3 -m http.server 6006 --bind 127.0.0.1 --directory .storybook-static > "$RUNNER_TEMP/storybook-http.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl --silent --fail --output /dev/null http://127.0.0.1:6006/iframe.html && break
            sleep 1
          done
          curl --silent --show-error --fail --output /dev/null http://127.0.0.1:6006/iframe.html
      - name: Every story has zero axe violations (WCAG 2.0/2.1 A and AA, FE-INV-031)
        # Blocking, and declared so by this exact name in blocking-steps.yaml: no `|| true`, no
        # `continue-on-error`, and the test run is the last command, so one failing story fails
        # the job. `--json --outputFile <path>` must stay LAST on the line: test-runner 0.19.1
        # declares `--outputFile` as a flag and appends the leftover argument (the path) after
        # every Jest option it forwards, so the path reaches Jest as `--outputFile`'s value only
        # when nothing follows it. Jest writes the file when stories fail too, but does not
        # create its directory, hence the `mkdir`.
        run: |
          mkdir -p artifacts/test-reports
          pnpm storybook:test --no-index-json --url http://127.0.0.1:6006 --maxWorkers 2 --json --outputFile artifacts/test-reports/storybook-a11y.json
      - name: Upload Storybook a11y run record (FE-INV attestation evidence, R8.7)
        # `fe-invariants` attests FE-INV-031 from this file. Uploaded on failure too, since a
        # record naming the failing stories is evidence; a missing record is an error here
        # rather than an absent artifact for the registry gate to trip over.
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: fe-invariant-storybook-a11y-report
          path: frontend/artifacts/test-reports/storybook-a11y.json
          if-no-files-found: error
          retention-days: 7

  fe-invariants:
    name: FE-INV registry coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The gate reads EXECUTED, non-skipped assertions from the Vitest/Playwright/Jest
    # JSON run records (R8.7 / R12.4) instead of calling `.exists()` on the files
    # the registry lists — `FE-INV-056` was `enforced` on the strength of a suite
    # that skips on its first line. It therefore consumes the run records produced
    # by `quality` (Vitest), `e2e` / `e2e-visual` / `e2e-harness` (Playwright) and
    # `storybook-a11y` (Jest, through @storybook/test-runner), and runs where those
    # run. Push-to-main produces neither the Playwright nor the Storybook record
    # (ADR-039: `pnpm preview` has no backend there), so this job does not execute
    # on that event; that gap is rendered by `scripts/audit/gate_surface.py` in
    # docs/state/GATE_SURFACE.md as NOT EXECUTED rather than reported as a pass.
    needs: [quality, e2e, e2e-visual, e2e-harness, storybook-a11y]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gate dependencies
        run: pip install pyyaml pydantic
      - name: Download Vitest run record
        uses: actions/download-artifact@v4
        with:
          name: fe-invariant-vitest-report
          path: frontend/artifacts/test-reports
      - name: Download Playwright run records
        uses: actions/download-artifact@v4
        with:
          pattern: fe-invariant-playwright-*-report
          merge-multiple: true
          path: frontend/artifacts/test-reports
      - name: Download Storybook a11y run record
        # Its own `name:`, outside the Playwright pattern above, so neither download can
        # fetch the other's file. `storybook-a11y` uploads it on success and failure.
        uses: actions/download-artifact@v4
        with:
          name: fe-invariant-storybook-a11y-report
          path: frontend/artifacts/test-reports
      - name: Validate FE-INV registry against executed assertions
        working-directory: .
        # No `|| true` and no `continue-on-error` (R8.9): exit 1 = an `enforced`
        # invariant has no executed, non-skipped assertion; exit 2 = the evidence
        # could not be read. Both are non-passing, because absence of proof is
        # never a pass (I-7). This job is EXPECTED to fail on `FE-INV-056` until
        # the browser harness lands (design E6 / task 11.1) — that failure is the
        # honest state and must not be silenced.
        run: |
          python frontend/spec/check_fe_invariants.py \
            --report frontend/artifacts/test-reports/vitest.json \
            --report frontend/artifacts/test-reports/playwright.json \
            --report frontend/artifacts/test-reports/playwright-visual.json \
            --report frontend/artifacts/test-reports/playwright-harness.json \
            --report frontend/artifacts/test-reports/storybook-a11y.json

  e2e:
    name: Playwright E2E + axe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    # Sprint 12 (ADR-039): E2E only runs against pull_request previews and
    # `v*` tag pushes. Push-to-main produces no useful E2E signal because
    # `pnpm preview` has no backend on the runner — every /api proxy returns
    # ECONNREFUSED and the suite fails by design. Backend-up signal is the
    # job of the cd-gcp.yml `Wait for health` step against the real VM.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Playwright E2E (blocking)
        # R8.9 (purpose-achievement-audit, task 11.2): every step of this job exits
        # with the exit status of the command it runs. The `|| true` that used to
        # live here is REMOVED and must not come back — `workflow_shape_truth`
        # fails naming this file and this step if it does.
        #
        # The removed rationale was real: this suite boots the app via `pnpm
        # preview` with NO backend, so /api proxy-errors and data-dependent
        # surfaces can exceed the 30s timeout under runner load. Discarding the
        # exit status was still the wrong remedy — it converted an unknown into a
        # pass, which is what I-7 forbids. Expect this job to be RED until the
        # underlying flakiness is fixed (a deterministic MSW/backend boot, or the
        # flaky specs moved to the harness suite, which serves its own build).
        # That red is the honest state of a suite that cannot currently pass; it is
        # not a reason to swallow the status again.
        #
        # NOTE: `fe-invariants` declares `needs: [quality, e2e, e2e-visual,
        # e2e-harness]`, so a red `e2e` job skips the FE-INV registry gate. That
        # coupling is real and is NOT fixed here; `scripts/audit/gate_surface.py`
        # renders a skipped job as NOT EXECUTED rather than as a pass.
        run: pnpm test:e2e --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Upload Playwright run record (FE-INV attestation evidence, R8.7)
        # The machine-readable record of which e2e assertions actually executed.
        # `fe-invariants` reads it; a skipped spec can no longer read as enforced.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fe-invariant-playwright-e2e-report
          path: frontend/artifacts/test-reports/playwright.json
          retention-days: 7

  e2e-visual:
    name: Visual regression gate (Req 14)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    # Real, blocking Visual_Regression_Gate. Playwright screenshots are
    # platform-specific and can ONLY be born on the Linux/Chromium runner CI uses
    # (committing macOS/Windows PNGs would never match — see
    # frontend/tests/e2e/visual/README.md). So the FIRST run generates the missing
    # `*-visual-linux.png` baselines on this runner and commits them back to the PR
    # branch (github-actions[bot]); every run thereafter compares against those
    # committed baselines and FAILS naming the changed Surface + Theme_Mode on a
    # real diff (Req 14.2/14.4). $0-cost / OSS — Playwright's built-in
    # toHaveScreenshot() diffing, no paid visual SaaS (Req 14.6, 20.2).
    #
    # Same run policy as `e2e` (ADR-039): PR-preview and `v*` tags only.
    # A GITHUB_TOKEN-authored push does not re-trigger workflows, so the baseline
    # commit does not recurse; this run's compare step is the in-run confirmation.
    permissions:
      contents: write
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        # Check out the PR head branch (not the detached merge ref) with a
        # push-capable token so freshly generated baselines can be committed back.
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Generate + commit Linux baselines if none are committed yet
        # Version-independent generate-if-absent guard (Playwright ^1.48 has no
        # `--update-snapshots=missing`): only when the snapshots dir has no PNGs do
        # we write them and commit back. Existing baselines are NEVER regenerated,
        # so this structurally cannot loop or churn on later runs.
        #
        # The PR branch name reaches the shell through `env:`, never spliced into the
        # script: a branch name is attacker-controlled on a public repository, and
        # `${{ github.head_ref }}` inside `run:` is expanded before bash parses it, so a
        # name such as `x$(cmd)` would execute (actionlint "potentially untrusted").
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          SNAP="tests/e2e/visual/visual-regression.spec.ts-snapshots"
          if [ -z "$(ls -A "$SNAP" 2>/dev/null)" ]; then
            echo "No committed baselines — generating on the Linux/Chromium runner."
            # `|| true`: update-mode may exit non-zero if a surface can't reach a
            # stable capture; we still commit whatever stable baselines were written
            # so `bash -e` does not abort before the commit/push (the compare step
            # below is the real gate).
            pnpm test:visual:update || true
            if [ -n "${HEAD_REF}" ] && [ -n "$(git status --porcelain -- "$SNAP")" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "$SNAP"
              git commit -m "test(visual): add CI-generated Linux screenshot baselines (Req 14)"
              git push origin "HEAD:${HEAD_REF}"
            fi
          else
            echo "Baselines already committed — skipping generation."
          fi
      - name: Visual regression compare against committed baselines (real gate)
        env:
          # A distinct run record for the `visual` project so the `fe-invariants`
          # gate can attest the Visual_Regression_Gate invariant from the assertions
          # that actually ran here (R8.7). Written by the compare run, which is the
          # gate — the generate-if-absent step above writes it first and is
          # overwritten.
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/test-reports/playwright-visual.json
        run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Upload Playwright visual run record (FE-INV attestation evidence, R8.7)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fe-invariant-playwright-visual-report
          path: frontend/artifacts/test-reports/playwright-visual.json
          retention-days: 7

  e2e-harness:
    name: Effectiveness harness leg ${{ matrix.leg }} of 5 (Req 1.3, 3, 7)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    # Same run policy as `e2e` (ADR-039): PR-preview and `v*` tags only. The
    # Effectiveness_Harness is a Scripted_Proxy driven entirely by the seeded MSW browser
    # worker and stream driver: it makes ZERO calls to any live or third-party endpoint. It
    # runs the Task_Completion_Tests (Jobs-To-Be-Done, Req 3) and the Resilience_Scenarios
    # (Req 7) on the fixed Linux/Chromium profile and emits the versioned
    # Effectiveness_Scorecard (test-results/effectiveness/scorecard.json, Req 4.1) that the
    # `effectiveness-ratchet` job below gates against. $0-cost / OSS only (Playwright + MSW,
    # both already in package.json; Req 20.3).
    #
    # WHAT IS DETERMINISTIC AND WHAT IS NOT (ADR-059, measured). The seed fixes the path, so
    # `steps`, `errorRate` and `interruptionPrecision` repeat exactly: the strict A/A of
    # finding 88 (run 38298457463, job 116358160071) read them identical in both attempts.
    # Millisecond latency does NOT repeat: the same A/A moved two of five JTBD latencies by
    # more than 10% at one sha and one seed. So this job is a MATRIX OF FIVE LEGS, each a whole
    # harness run on its own runner, and `effectiveness-ratchet` judges latency by the median
    # of the five against the baseline's own five samples, and requires the other three
    # metrics to be identical in all five. A disagreement among legs is a failure, because the
    # harness claims determinism for them.
    #
    # ARRIVAL. Each leg seals its scorecard with its leg index, the matrix size and the commit,
    # and uploads it with its harness run record as `effectiveness-leg-<n>`. The ratchet
    # refuses unless exactly legs 1..5 arrived, at one commit and one harness version: a
    # missing leg is a failure, never a median of fewer.
    #
    # THE FE-INV CONTRACT. `fe-invariants` downloads the pattern
    # `fe-invariant-playwright-*-report` with merge-multiple and reads `playwright-harness.json`.
    # Exactly ONE leg, leg 1, uploads `fe-invariant-playwright-harness-report`; legs 2..5 upload
    # nothing matching that pattern, so the merge cannot overwrite leg 1's record with another
    # leg's. Every leg's record also travels in its own `effectiveness-leg-<n>` artifact, which
    # the ratchet reads for R8.6/R8.8: a skip that happens in one leg shows only in that leg's
    # record.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      # One red leg must not cancel the other legs' measurements. The ratchet needs all five
      # anyway, and a failed leg skips it: non-passing, never a shorter verdict.
      fail-fast: false
      matrix:
        # 1..5, written out so every leg is visible on the run page. k = 5 is
        # `EFFECTIVENESS_LEG_COUNT` in frontend/src/lib/effectiveness-ratchet.ts. That is a
        # coupling, so each leg's seal refuses unless `strategy.job-total` equals it.
        leg: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build the e2e-mode bundle (the one that contains the harness)
        # `pnpm build:e2e` -> `dist-e2e/`, served by `pnpm preview:e2e` on :3001
        # (task 11.1). The PRODUCTION bundle `pnpm build` produces cannot contain
        # `window.__atlasHarness` by construction (AD-12), so building it here and
        # then asking the harness specs to drive the harness was a contradiction:
        # they would fail on the wrong thing.
        run: pnpm build:e2e
      - name: Task_Completion_Tests + Resilience_Scenarios (seeded, no live network)
        # `test:e2e:harness` runs `playwright.harness.config.ts`, whose `testMatch`
        # IS `HARNESS_SPEC_PATTERN` — the seven harness specs, on the deterministic
        # chromium project, against `dist-e2e/`.
        #
        # This replaces `pnpm test:e2e --project=chromium task-completion.jtbd
        # resilience.spec || true`, which selected ZERO harness specs: the
        # `chromium` project of `playwright.config.ts` now carries
        # `testIgnore: HARNESS_SPEC_PATTERN` (task 11.1), so those positional
        # filters matched nothing runnable. The consequence was that
        # `playwright-harness.json` held no executed FE-INV-056 assertion and the
        # registry gate reported `not_executed` — which the `|| true` then made
        # look like a green step.
        #
        # R8.9: no `|| true` and no `continue-on-error`. An unreachable harness, a
        # declared job that emits no row, a zero executed count, or any skipped
        # scenario is a FAILED result (R8.1, R8.2, R8.6, R8.8) — the JTBD suite's
        # `afterAll` throws rather than emit a shorter scorecard.
        env:
          # A distinct run record so the `fe-invariants` gate can tell a
          # harness-mode execution from the plain `e2e` one (R8.7). Every leg writes
          # one, and `effectiveness-ratchet` reads all five to detect a skipped
          # resilience scenario (R8.6) and a leg that selected no spec at all.
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/test-reports/playwright-harness.json
        run: pnpm test:e2e:harness
      - name: Seal the leg scorecard with its leg index, matrix size and commit (ADR-059)
        # Re-checks `scorecard.json` against the complete-or-failed emission rule and writes
        # `test-results/effectiveness/scorecard.leg.json`: the same record plus
        # `leg: { index, count, commitSha }`. It refuses an incomplete record, an index
        # outside 1..k, a `strategy.job-total` other than k (`EFFECTIVENESS_LEG_COUNT`) and a
        # commit that is not a 40-character sha, so a mis-sized matrix fails every leg by name.
        # Runs only when the harness step succeeded: a failed harness has no scorecard to seal,
        # and the leg is already red. The values reach the script through `env:`, never
        # spliced into `run:`.
        env:
          HARNESS_LEG: ${{ matrix.leg }}
          HARNESS_LEG_TOTAL: ${{ strategy.job-total }}
          HARNESS_COMMIT_SHA: ${{ github.sha }}
        run: pnpm effectiveness:ratchet seal
      - name: Upload Playwright harness run record (FE-INV attestation evidence, R8.7)
        # LEG 1 ONLY, and that is the whole contract with `fe-invariants`: it downloads
        # `fe-invariant-playwright-*-report` with merge-multiple, so a second leg uploading
        # this name would collide on upload, and a second leg uploading any matching name would
        # merge a second `playwright-harness.json` over this one. This is the run in which
        # FE-INV-054..057 are asserted. Uploaded on failure too: a record showing what was
        # skipped is exactly what must reach the gate, rather than a green "the file exists".
        if: always() && matrix.leg == 1
        uses: actions/upload-artifact@v4
        with:
          name: fe-invariant-playwright-harness-report
          path: frontend/artifacts/test-reports/playwright-harness.json
          retention-days: 7
      - name: Upload the leg scorecard and harness run record (ADR-059)
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          # One artifact per leg, named by the leg, so five legs never collide. The sealed
          # scorecard is what the ratchet reads; `scorecard.json` (written ONLY by a complete
          # run) and `scorecard.incomplete.json` (an incomplete run's partial measurement,
          # which R8.2 keeps away from the canonical path) travel for diagnosis. The paths
          # span `test-results/` and `artifacts/`, so the artifact is rooted at their common
          # ancestor, `frontend/`, and each downloaded leg directory mirrors a leg's
          # `frontend/` root -- the layout `run-ratchet.ts` reads.
          name: effectiveness-leg-${{ matrix.leg }}
          path: |
            frontend/test-results/effectiveness/scorecard.leg.json
            frontend/test-results/effectiveness/scorecard.json
            frontend/test-results/effectiveness/scorecard.incomplete.json
            frontend/artifacts/test-reports/playwright-harness.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-playwright-report-leg-${{ matrix.leg }}
          path: frontend/playwright-report
          retention-days: 7

  effectiveness-ratchet:
    name: Effectiveness ratchet (Req 4.3/4.4) - median of five legs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: e2e-harness
    # Downloads every leg's sealed scorecard and harness run record and compares the five legs
    # against the committed baseline (spec/effectiveness/scorecard.baseline.json) through the
    # pure comparator in @lib/effectiveness-ratchet (`pnpm effectiveness:ratchet`). It exits
    # NON-ZERO, naming the subject, when:
    #   * the arrival proof fails: not exactly legs 1..5, a leg claimed twice, or two commits
    #     or harness versions among them (ADR-059);
    #   * the legs disagree on steps, errorRate, a row's seed or harness version, or
    #     interruptionPrecision -- metrics the harness claims are deterministic;
    #   * steps, errorRate or interruptionPrecision regress beyond tolerance (Req 4.3), by the
    #     same rules as before;
    #   * a row's MEDIAN latency regresses: med_f - med_b > max(p * med_b, 3 * 1.4826 * MAD_b),
    #     where med_b and MAD_b come from the baseline's own five samples, never pooled with the
    #     fresh ones, and p is the committed `latencyPct`, 0.10, unchanged.
    # Latency is a noisy measurement, not a deterministic one, so the gate is a band around
    # measured noise rather than a byte comparison; ADR-059 records what it cannot see.
    # $0-cost / OSS only.
    #
    # R8.9: every step below exits with the exit status of the command it runs. No
    # `|| true`, no `continue-on-error`.
    #
    # EXPECTED RED ON LANDING (ADR-059, I-7). The committed baseline is still the one-run
    # placeholder: `schemaVersion: 1`, `steps: 20` / `latencyMs: 15000` on all five rows, no
    # stamps. The baseline check refuses that format BY NAME (`one-run-format`) before reading
    # its numbers, so the ratchet step and the R8.10 step both fail on that one reason. It
    # clears one way: a run whose five legs arrive, agree and carry clean records writes the
    # k-sample candidate through `buildBaseline` to the `effectiveness-baseline-candidate`
    # artifact, and an operator commits that file over the current baseline unedited, after
    # reading it against ADR-059's pre-registered A/A predictions -- never by editing a number,
    # typing a `capturedAt`, widening `latencyPct`, or relaxing a threshold.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - name: Download every leg scorecard and harness run record (ADR-059)
        # `download-artifact` is a `uses:` step, so the top-level `working-directory: frontend`
        # default does not apply and the path is repo-root-relative. No `merge-multiple`: each
        # `effectiveness-leg-<n>` artifact lands in its own directory under `legs/`, so no leg's
        # files can overwrite another's. Each such directory mirrors that leg's `frontend/`
        # root, and the ratchet reads `<leg>/test-results/effectiveness/scorecard.leg.json` and
        # `<leg>/artifacts/test-reports/playwright-harness.json`. What arrived is the evidence:
        # the ratchet counts the legs itself rather than trusting this step, and a leg whose
        # artifact is missing is a refusal, never a median of fewer.
        uses: actions/download-artifact@v4
        with:
          pattern: effectiveness-leg-*
          path: frontend/test-results/effectiveness/legs
      - name: Effectiveness ratchet (median of five legs vs committed baseline)
        # Re-applies the complete-or-failed emission rule to every leg's sealed record against
        # the real JOB_ORDER (R8.1, R8.2, R8.3, R8.8), reads all five harness run records for a
        # skip or an empty run (R8.6, R8.8), proves arrival, pools the legs, and writes the
        # measured k-sample candidate before its own blocking decision -- only from a clean
        # measurement -- so a rejected baseline has a measured replacement.
        run: pnpm effectiveness:ratchet
      - name: Effectiveness baseline is a measurement, not a ceiling (R8.10)
        # Blocking. `if: success() || failure()` is NOT a discarding construct: the
        # step still exits with the exit status of `pnpm effectiveness:baseline` and
        # a non-zero exit still fails the job. It is here so this gate reports even
        # when the ratchet step above already failed — and it runs AFTER the ratchet
        # on purpose, because the ratchet is what writes the measured candidate that
        # repairs a rejected baseline. Ordering it first would make its own fix
        # unreachable.
        if: success() || failure()
        run: pnpm effectiveness:baseline
      - name: Upload measured baseline candidate (commit this to clear R8.10)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: effectiveness-baseline-candidate
          path: frontend/test-results/effectiveness/scorecard.baseline.candidate.json
          retention-days: 14

  mobile-lighthouse:
    name: Mobile Lighthouse budget (Req 15.4/15.5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    # Same run policy as `e2e` (ADR-039): PR-preview and `v*` tags only. This is
    # the authoritative Web_Vitals_Budget gate for the Mobile_Reality_Profile
    # (Req 15.4): the OSS Lighthouse CI (@lhci/cli) audits the defined key routes
    # under a mobile form factor with a throttled 3G-class network + 4× CPU
    # slowdown (lighthouserc.mobile.json) and FAILS when a route falls below its
    # mobile budget — LCP ≤ 2.5s, CLS ≤ 0.1, TBT ≤ 300ms (the INP lab proxy)
    # (Req 15.5). The literal 360px/touch/3G reachability + INP/CLS checks live
    # in tests/e2e/mobile-reality.spec.ts (run by the `e2e` job). Routes are the
    # backend-free key entry routes (/login, /) because `pnpm preview` serves the
    # built app with no backend on the runner; deeper role-gated Surfaces are
    # covered by the authenticated Playwright mobile spec. $0-cost / OSS only —
    # Lighthouse is Apache-2.0 (Req 20.2). Uses the runner's pre-installed
    # Google Chrome (chrome-launcher auto-detects it).
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - name: Build
        run: pnpm build
      - name: Mobile-profile Lighthouse CI (key routes; budgets WARN on introduction)
        # Budgets are asserted at WARN in lighthouserc.mobile.json on introduction
        # (informational-until-ready + ratchet): the report
        # still records + uploads every metric and a crash still fails, but a cold
        # backend-free SPA missing the mobile Web-Vitals budget does not block the PR.
        # RATCHET: LCP/CLS/TBT return to `error` once prerender/critical-CSS/font work
        # lands (see budgets in lighthouserc.mobile.json).
        run: pnpm lhci:mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-mobile-report
          path: frontend/.lighthouseci
          retention-days: 14

  license-audit:
    name: License audit (I-1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - name: License audit (allow MIT/Apache-2.0/BSD/ISC/MPL-2.0)
        run: |
          npx --yes license-checker-rseidelsohn \
            --production \
            --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;BSD;ISC;MPL-2.0;CC0-1.0;CC-BY-4.0;Unlicense;0BSD;Python-2.0" \
            --excludePackages "synapse-console" \
            --summary

  mutation:
    name: Stryker mutation (FE-INV-006/008/012/028 — guardrails)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: quality
    # Sprint 12 (ADR-039): same rationale as e2e. Stryker is an authoring-
    # time signal — every PR shows the mutation impact of its diff, and
    # every tag release is gated. Push-to-main, where no review happens
    # between merge and CI run, is the wrong place to ratchet (a single
    # uncovered LOC drops the score below the break threshold and turns
    # main red without anyone to act on it). E-S12-14.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    env:
      # Stryker drives vitest, so it loads `src/test/setup.ts` and inherits the same
      # fast-check budget. Set explicitly for the same reason `quality` sets it, and to
      # the same value: leaving it unset would resolve to `dev` = 10 and quietly weaken
      # every property-based mutant kill behind an unchanged 85% break threshold. A gate
      # whose strength moves because an environment variable was not written down is the
      # failure mode this whole phase exists to remove.
      HYPOTHESIS_PROFILE: heavy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - name: Stryker mutation (break threshold 85% killed)
        run: pnpm mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: frontend/reports
          retention-days: 14

  sbom:
    name: CycloneDX SBOM (I-1 supply chain)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - name: Generate CycloneDX SBOM
        run: pnpm sbom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-sbom
          path: frontend/sbom.cdx.json
          retention-days: 90

  audit-supply:
    name: Supply-chain audit (pnpm audit + lockfile HTTPS/host check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - name: pnpm audit (high+ severity, production tree only)
        # I-1 supply-chain gate covers the SHIPPED artifact = production deps.
        # Build/dev tooling (Storybook/Vite/esbuild/Stryker/Playwright) is not
        # shipped; its advisory-DB drift must not block the PR. A high+ advisory
        # in a PRODUCTION dependency still fails here (correctly).
        run: pnpm audit --audit-level=high --prod
      - name: pnpm-lock supply-chain check (HTTPS + registry.npmjs.org only)
        run: node scripts/check-supply-chain.mjs
