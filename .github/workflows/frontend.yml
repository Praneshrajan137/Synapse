name: Synaptic Calm Frontend CI

on:
  push:
    branches: [main, develop, "sprint-*"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Type Check + Lint + Unit + Audits + Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check (tsc --strict)
        run: npm run typecheck
      - name: Biome lint + format check
        run: npm run lint
      - name: Unit + component tests
        run: npm run test
      - name: Forbidden imports (I-1)
        run: npm run audit:imports
      - name: License audit (no GPL/AGPL)
        run: npm run audit:licenses
      - name: Production build
        run: npm run build
      - name: Storybook build
        run: npm run build-storybook
      - name: Upload bundle stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: frontend/dist/bundle-stats.html
          if-no-files-found: ignore

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke tests
        run: npm run test:e2e:smoke
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
