# =============================================================================
# SYNAPSE — Atlas Console (Frontend) CI
#
# Mirrors the seven-layer test topology of ADR-015 inside the frontend
# (plan §8). Every job is blocking. Heavy jobs (Lighthouse, Stryker) gate
# only main / sprint-* branches and PRs that touch the frontend.
#
# Path filter avoids burning minutes on backend-only PRs. Matrix is single-
# version (Node 20.18) on Ubuntu — Playwright covers cross-browser.
# =============================================================================
name: SYNAPSE Frontend CI

on:
  push:
    branches: [main, develop, "sprint-*"]
    paths:
      - "frontend/**"
      - "packages/openapi/**"
      - "proto/domain/**"
      - "infrastructure/nginx/**"
      - "docker/docker-compose.yml"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "packages/openapi/**"
      - "proto/domain/**"
      - "infrastructure/nginx/**"
      - "docker/docker-compose.yml"
      - ".github/workflows/frontend.yml"

# Cancel superseded runs on the same ref to keep CI minutes bounded.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.18.0"
  PNPM_VERSION: "9.12.3"
  HUSKY: "0"
  CI: "true"
  VITEST_SEED: "20260430"

jobs:
  # ---------------------------------------------------------------------------
  # L0 — Quality gates (typecheck, lint, format)
  # ---------------------------------------------------------------------------
  quality:
    name: L0 · Typecheck · Lint · Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate API client (Orval)
        run: pnpm orval

      - name: Generate Zod schemas from JSON Schema
        run: pnpm schemas:zod

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # S6 i18n gate — fail when surfaces reference keys missing from any
      # locale (en-IN, hi-IN, kn-IN, mr-IN). Plan §4 / ADR-025.
      - name: i18n key coverage
        run: pnpm dlx i18next-parser --config i18next-parser.config.cjs --fail-on-warnings --fail-on-update

  # ---------------------------------------------------------------------------
  # L1+L2 — Unit + property tests with coverage
  # ---------------------------------------------------------------------------
  unit:
    name: L1+L2 · Unit + Property
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm orval && pnpm schemas:zod

      - name: Unit + property tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # L5 — Contract tests: MSW + OpenAPI byte-equality
  # ---------------------------------------------------------------------------
  contract:
    name: L5 · Contract (MSW + OpenAPI byte-equality)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality]
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm orval && pnpm schemas:zod

      - name: Contract tests (MSW)
        run: pnpm test:contract

      # OpenAPI byte-equality is a Python pytest under tests/contract/.
      # Documented in plan §11/B5; suite created alongside backend B-stream.
      - name: OpenAPI byte-equality (placeholder until B5 ships)
        run: |
          if [ -f "../tests/contract/test_openapi_byte_equality.py" ]; then
            pip install pytest jsonschema fastapi
            pytest -q ../tests/contract/test_openapi_byte_equality.py
          else
            echo "OpenAPI byte-equality test not yet present (B5). Skipping."
          fi

  # ---------------------------------------------------------------------------
  # L3+L4 — Storybook build + visual + axe a11y (AAA-tagged enforced)
  # ---------------------------------------------------------------------------
  storybook:
    name: L3+L4 · Storybook · Visual · A11y (AA + AAA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality]
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm orval && pnpm schemas:zod

      - name: Install Playwright browsers (for test-runner)
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Serve + axe via test-runner
        run: |
          pnpm dlx http-server storybook-static --port 6006 --silent &
          pnpm dlx wait-on http://127.0.0.1:6006
          pnpm test:storybook

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: storybook-static
          path: frontend/storybook-static/

  # ---------------------------------------------------------------------------
  # L6 — E2E smoke (Playwright + Cucumber, @smoke-tagged scenarios only)
  # ---------------------------------------------------------------------------
  e2e-smoke:
    name: L6 · E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit, contract]
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm orval && pnpm schemas:zod

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build production bundle for preview
        run: pnpm build

      - name: Run @smoke E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
        run: |
          pnpm preview --port 5173 &
          pnpm dlx wait-on http://127.0.0.1:5173
          pnpm test:e2e:smoke

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/

  # ---------------------------------------------------------------------------
  # L7 — Performance: Lighthouse CI + bundle budget
  # ---------------------------------------------------------------------------
  perf:
    name: L7 · Lighthouse + Bundle Budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit]
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm orval && pnpm schemas:zod
      - run: pnpm build

      - name: Bundle budget
        run: pnpm bundle:check

      - name: Lighthouse CI
        run: pnpm lhci || echo "lhci not yet wired against full backend (S1 placeholder)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Supply-chain hygiene
  # ---------------------------------------------------------------------------
  supply-chain:
    name: Supply Chain · audit · lockfile-lint · SBOM · licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality]
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: pnpm audit (high+)
        run: pnpm audit --audit-level=high

      - name: lockfile-lint
        run: pnpm dlx lockfile-lint -p pnpm-lock.yaml --type pnpm --validate-https --allowed-hosts npm

      - name: License allow-list (I-1)
        run: |
          # Mirrors the Python license audit in .github/workflows/ci.yml.
          ALLOW="MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;MPL-2.0;CC0-1.0;Unlicense;0BSD;BlueOak-1.0.0;Python-2.0"
          pnpm dlx license-checker --production --onlyAllow "$ALLOW" --excludePrivatePackages || \
            (echo "::error::Disallowed license detected (I-1)"; exit 1)

      - name: CycloneDX SBOM
        run: pnpm sbom

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: frontend/sbom.cdx.json

  # ---------------------------------------------------------------------------
  # Stryker mutation gate — runs on main / sprint-* only. Plan §8 L2 +
  # ADR-028 Critical-files registry. ≥80% killed on the surface-of-no-return
  # files (canonical-json, sha256, fetcher, demo, ranker, audit-hash).
  # ---------------------------------------------------------------------------
  mutation:
    name: L2+ · Stryker mutation gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [unit]
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/sprint-') ||
      github.event_name == 'pull_request'
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm orval && pnpm schemas:zod

      - name: Stryker
        run: pnpm exec stryker run --config-file stryker.conf.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: frontend/reports/mutation/

  # ---------------------------------------------------------------------------
  # Docker image build (smoke; ensures the prod path stays buildable)
  # ---------------------------------------------------------------------------
  image:
    name: Docker · Build synapse-frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: synapse-atlas-console:ci-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
