name: CD — GCP (primary deployment target)

# Fires on:
#   - push to main         → auto-deploy (tagged `main-<sha7>`, also `:main` + `:latest`)
#   - push of a `v*` tag   → explicit release (tagged with the version, also `:latest`)
#   - workflow_dispatch    → manual re-deploy of current main with optional dryrun
#
# Builds + signs + pushes every service image to Artifact Registry, then
# deploys to the GCE VM via IAP TCP tunnel (no public SSH).
#
# ADR-039 — pull-from-AR contract. The compose file at
# `docker/docker-compose.gcp.yml` references images by `image:` (never `build:`),
# and `verify_claims.py` (C26) fails CI on regression. This trigger fires on
# every merge to main so the VM is never more than one workflow run behind HEAD.
#
# Auth: Workload Identity Federation only. There are no JSON service-account
# keys in this repository's secrets. See infrastructure/gcp/terraform/wif.tf
# for the trust configuration.
#
# Prerequisites (one-time, via `make deploy-gcp-terraform`):
#   - WIF pool + provider trust this repo's OIDC tokens
#   - github_actions SA has roles/artifactregistry.writer,
#     roles/iap.tunnelResourceAccessor, roles/compute.osLogin
#   - Artifact Registry Docker repo "synapse" exists
#   - GCE VM "synapse-demo" is up with the gh-actions SA listed in iap_users
#
# Required repository variables (Settings → Secrets and variables → Actions):
#   GCP_PROJECT_ID         — your GCP project ID
#   GCP_REGION             — e.g. asia-south1
#   GCP_VM                 — e.g. synapse-demo
#   GCP_ZONE               — e.g. asia-south1-a
#   GCP_AR_REPO            — Artifact Registry repo id (default: synapse)
#   GCP_WIF_PROVIDER       — Terraform output wif_provider
#   GCP_WIF_SA             — Terraform output wif_service_account

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Docs/notebook-only changes must not rebuild 12 images + cycle the live VM.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "plans/**"
      - "notebooks/**"
  workflow_dispatch:
    inputs:
      dryrun:
        description: "Build + push + sign images, but skip the VM deploy"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # required by google-github-actions/auth (WIF)
  packages: read
  issues: write  # deploy-failure auto-issue (Deploy Truth, Sprint 14)

concurrency:
  group: cd-gcp
  cancel-in-progress: false

env:
  AR_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev
  AR_REPO_URL: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO || 'synapse' }}

jobs:
  # ── Build, push, sign each image in parallel ──────────────────────────────
  build-push-sign:
    name: Build + Cosign sign — ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # `entry` = the module the container's CMD imports. The import-smoke
        # step imports it inside the freshly built image, so a runtime dep
        # missing from the image (CI installs dev deps; images don't — the
        # jsonschema incident) fails HERE, before anything is deployed.
        # Frontend is static nginx: no Python entry, smoke skipped.
        include:
          - { image: api-gateway,          context: ".", dockerfile: api/Dockerfile,                          entry: api.main }
          - { image: orchestrator,         context: ".", dockerfile: orchestrator/Dockerfile,                 entry: orchestrator.inference.serve }
          - { image: digital-twin,         context: ".", dockerfile: digital_twin/Dockerfile,                 entry: digital_twin.inference.serve }
          - { image: demand-prophet,       context: ".", dockerfile: agents/demand_prophet/Dockerfile,        entry: agents.demand_prophet.inference.serve }
          - { image: routing-navigator,    context: ".", dockerfile: agents/routing_navigator/Dockerfile,     entry: agents.routing_navigator.inference.serve }
          - { image: inventory-sentinel,   context: ".", dockerfile: agents/inventory_sentinel/Dockerfile,    entry: agents.inventory_sentinel.inference.serve }
          - { image: freshness-guardian,   context: ".", dockerfile: agents/freshness_guardian/Dockerfile,    entry: agents.freshness_guardian.inference.serve }
          - { image: pricing-oracle,       context: ".", dockerfile: agents/pricing_oracle/Dockerfile,        entry: agents.pricing_oracle.inference.serve }
          - { image: disruption-shield,    context: ".", dockerfile: agents/disruption_shield/Dockerfile,     entry: agents.disruption_shield.inference.serve }
          - { image: supplier-trust,       context: ".", dockerfile: agents/supplier_trust/Dockerfile,        entry: agents.supplier_trust.inference.serve }
          - { image: sustainability-agent, context: ".", dockerfile: agents/sustainability_agent/Dockerfile,  entry: agents.sustainability_agent.inference.serve }
          - { image: frontend,             context: "frontend", dockerfile: frontend/Dockerfile,              entry: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: auth
        name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SA }}
          token_format: access_token

      - name: gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Docker auth for Artifact Registry
        run: gcloud --quiet auth configure-docker ${{ env.AR_HOST }}

      - name: Compute image tags
        id: tags
        run: |
          # Tagging strategy:
          #   push tag v0.10.0   → VERSION=0.10.0,    extra=:latest
          #   push branch main   → VERSION=main-abc1234, extras=:main, :latest
          #   workflow_dispatch  → VERSION=dryrun-abc1234, extras=:latest
          SHA7="${GITHUB_SHA::7}"
          EXTRA_TAGS=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            VERSION="main-${SHA7}"
            EXTRA_TAGS="${{ env.AR_REPO_URL }}/${{ matrix.image }}:main"
          else
            VERSION="dryrun-${SHA7}"
          fi
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "version=${VERSION}"
            echo "build_time=${BUILD_TIME}"
            echo "image_ref=${{ env.AR_REPO_URL }}/${{ matrix.image }}:${VERSION}"
            echo "image_latest=${{ env.AR_REPO_URL }}/${{ matrix.image }}:latest"
            echo "extra_tags=${EXTRA_TAGS}"
          } >> "$GITHUB_OUTPUT"

      - name: Build + push (multi-arch where possible)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: true
          sbom: true
          # Build-args propagate the deployed SHA into every image so the
          # frontend chip + GET /version can show what is actually running.
          # ADR-039 — visible build SHA.
          build-args: |
            VITE_BUILD_SHA=${{ github.sha }}
            VITE_BUILD_TIME=${{ steps.tags.outputs.build_time }}
            SYNAPSE_BUILD_SHA=${{ github.sha }}
            SYNAPSE_BUILD_TIME=${{ steps.tags.outputs.build_time }}
          tags: |
            ${{ steps.tags.outputs.image_ref }}
            ${{ steps.tags.outputs.image_latest }}
            ${{ steps.tags.outputs.extra_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.created=${{ steps.tags.outputs.build_time }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Import smoke (runtime-deps truth, Sprint 14)
        if: matrix.entry != ''
        run: |
          # Import the exact module the container's CMD runs, inside the
          # image just pushed (by digest — immutable). A runtime dependency
          # that exists in CI but not in the image fails here, before the
          # image is signed or deployed. This is precisely the test that
          # would have caught the jsonschema crash-loop (PR #42) pre-deploy.
          docker run --rm \
            "${{ steps.tags.outputs.image_ref }}@${{ steps.build.outputs.digest }}" \
            python -c "import importlib; importlib.import_module('${{ matrix.entry }}'); print('import-smoke OK: ${{ matrix.entry }}')"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Cosign sign (keyless, GitHub OIDC → Fulcio)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "${{ steps.tags.outputs.image_ref }}@${{ steps.build.outputs.digest }}"
          # Also sign :latest so verify_images.sh (which targets :latest by default) succeeds.
          # This is two signatures over the same digest — duplicate but cheap.
          cosign sign --yes \
            "${{ steps.tags.outputs.image_latest }}@${{ steps.build.outputs.digest }}"

  # ── Deploy to the GCE VM via IAP TCP tunnel ──────────────────────────────
  deploy-to-vm:
    name: Deploy to GCE VM (IAP)
    needs: build-push-sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.dryrun != 'true'
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SA }}
          # gcloud + IAP need an ID token, not an access token, when SSH'ing.
          create_credentials_file: true

      - name: gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure VM is running (handle nightly auto-stop)
        run: |
          # Sprint 10's ADR-036 sets a nightly auto-stop schedule on the GCE
          # VM to keep cost at near-zero. When CD fires during the stopped
          # window, IAP returns error 4003 ("failed to connect to backend")
          # because port 22 is unreachable on a stopped instance. Start it
          # idempotently — if already RUNNING, `start` is a no-op + 0 exit.
          # Then wait up to 90s for SSH to become reachable. E-S12-09.
          STATUS="$(gcloud compute instances describe ${{ vars.GCP_VM }} \
            --zone=${{ vars.GCP_ZONE }} --format='value(status)')"
          echo "Instance status before start: ${STATUS}"
          if [ "${STATUS}" != "RUNNING" ]; then
            echo "Starting ${{ vars.GCP_VM }}…"
            # A specific machine type in a single zone can be transiently out of
            # capacity (ZONE_RESOURCE_POOL_EXHAUSTED) — the boot disk is zonal so
            # we cannot fail over to another zone, and we do NOT silently upgrade
            # to a pricier machine type (cost stays at the e2-standard-8 baseline,
            # I-1). Capacity almost always returns within minutes, so retry the
            # SAME type with backoff (45,90,135,180,225s ≈ 11 min total) before
            # giving up with an actionable message.
            started=""
            for attempt in 1 2 3 4 5; do
              if gcloud compute instances start ${{ vars.GCP_VM }} \
                   --zone=${{ vars.GCP_ZONE }} --quiet 2>/tmp/vm_start.err; then
                started=1; break
              fi
              cat /tmp/vm_start.err
              if ! grep -q ZONE_RESOURCE_POOL_EXHAUSTED /tmp/vm_start.err; then
                echo "::error::instance start failed for a non-capacity reason"; exit 1
              fi
              wait=$((attempt * 45))
              echo "Zone capacity exhausted; retrying in ${wait}s (attempt ${attempt}/5)…"
              sleep "${wait}"
            done
            if [ -z "${started}" ]; then
              echo "::error::asia-south1-a has no e2-standard-8 capacity after 5 attempts (~11 min). Transient GCP constraint — re-run this deploy later, or temporarily widen the ADR-036 auto-stop window so the VM stays up between demos."
              exit 1
            fi
            # Boot + sshd + IAP backend can take ~30-60s on first start.
            for i in $(seq 1 18); do
              if gcloud compute ssh ${{ vars.GCP_VM }} \
                  --zone=${{ vars.GCP_ZONE }} --tunnel-through-iap --quiet \
                  --command='echo ssh-ready' 2>/dev/null; then
                echo "SSH reachable after ${i} attempts"
                break
              fi
              echo "...waiting for SSH (attempt ${i}/18)"
              sleep 5
            done
          fi

      - name: Ensure repo cloned on VM at this SHA
        env:
          GH_TOKEN_FOR_CLONE: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The repo is private — unauthenticated `git clone https://github.com/…`
          # returns "fatal: could not read Username for 'https://github.com':
          # No such device or address" in a non-interactive shell. Use the
          # workflow's GITHUB_TOKEN, which has read access to its own repo.
          # The token URL is built locally and passed via SSH command — it is
          # never written to the VM's git config, so it does not persist past
          # this step. Subsequent `git fetch` uses the credentials cached in
          # the existing remote (or re-uses the same authenticated URL when
          # cloning fresh). E-S12-10.
          CLONE_URL="https://x-access-token:${GH_TOKEN_FOR_CLONE}@github.com/${{ github.repository }}.git"
          gcloud compute ssh ${{ vars.GCP_VM }} \
            --zone=${{ vars.GCP_ZONE }} \
            --tunnel-through-iap \
            --quiet \
            --ssh-flag="-o ServerAliveInterval=30" \
            --ssh-flag="-o ServerAliveCountMax=20" \
            --command="set -e; \
                if [ ! -d ~/synapse/.git ]; then \
                  git clone ${CLONE_URL} ~/synapse; \
                fi; \
                cd ~/synapse && \
                git remote set-url origin ${CLONE_URL} && \
                git fetch --tags --quiet && \
                git checkout --quiet ${{ github.sha }} && \
                git remote set-url origin https://github.com/${{ github.repository }}.git"

      - name: Compute deploy version
        id: dv
        run: |
          # Same rules as build-push-sign; recomputed here because the deploy
          # job runs in its own ubuntu runner with no inherited outputs.
          SHA7="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            VERSION="main-${SHA7}"
          else
            VERSION="dryrun-${SHA7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Deploying::version=${VERSION} sha=${GITHUB_SHA}"

      - name: Push GCP compose + scripts (in case repo on VM lags)
        run: |
          # Write the runtime .env.gcp.version pointing the compose file at the
          # exact images this workflow just pushed. ADR-039: the VM never
          # builds; SYNAPSE_VERSION + SYNAPSE_AR_REPO_URL fully determine what
          # gets pulled.
          cat > /tmp/.env.gcp.version <<EOF
          # Auto-generated by .github/workflows/cd-gcp.yml — DO NOT EDIT BY HAND
          SYNAPSE_AR_REPO_URL=${{ env.AR_REPO_URL }}
          SYNAPSE_VERSION=${{ steps.dv.outputs.version }}
          SYNAPSE_BUILD_SHA=${{ github.sha }}
          EOF
          gcloud compute scp --tunnel-through-iap --zone=${{ vars.GCP_ZONE }} \
            docker/docker-compose.gcp.yml \
            infrastructure/gcp/backup_to_gcs.sh \
            infrastructure/gcp/verify_images.sh \
            /tmp/.env.gcp.version \
            ${{ vars.GCP_VM }}:~/synapse/

      - name: Ensure runtime env files exist
        run: |
          # docker compose is invoked with `--env-file .env.gcp --env-file
          # .env.gcp.local` (operator secret overlays). These are NOT created by
          # the workflow and were never provisioned for the `runner` user, so
          # compose aborted with "couldn't find env file". Every var in
          # docker-compose.gcp.yml already has a `:-default` EXCEPT
          # SYNAPSE_AR_REPO_URL, which .env.gcp.version supplies — so empty
          # overlay files are safe and the stack comes up on documented
          # defaults. Touch them idempotently; a Phase-B step replaces these
          # with Secret Manager-sourced values for real hardening.
          gcloud compute ssh ${{ vars.GCP_VM }} \
            --zone=${{ vars.GCP_ZONE }} \
            --tunnel-through-iap \
            --quiet \
            --ssh-flag="-o ServerAliveInterval=30" \
            --ssh-flag="-o ServerAliveCountMax=20" \
            --command="cd ~/synapse && touch .env.gcp .env.gcp.local && echo 'env overlays present:' && ls -la .env.gcp .env.gcp.local"

      - name: Cosign verify images BEFORE start
        run: |
          # IMPORTANT: env-var assignments before `chmod` only apply to chmod,
          # NOT to the chained `./verify_images.sh` after `&&`. Use `export`
          # so both vars are present in the subshell's environment for the
          # verifier. The metadata fallback (curl …/instance/attributes)
          # only works when this VM was created with the AR-repo attribute
          # set; relying on it caused the prior `not set and metadata lookup
          # failed` error. E-S12-13.
          gcloud compute ssh ${{ vars.GCP_VM }} \
            --zone=${{ vars.GCP_ZONE }} \
            --tunnel-through-iap \
            --quiet \
            --ssh-flag="-o ServerAliveInterval=30" \
            --ssh-flag="-o ServerAliveCountMax=20" \
            --command="set -e; cd ~/synapse && \
                       gcloud --quiet auth configure-docker ${{ env.AR_HOST }} && \
                       export GITHUB_REPO='${{ github.repository }}' && \
                       export SYNAPSE_AR_REPO_URL='${{ env.AR_REPO_URL }}' && \
                       chmod +x verify_images.sh && \
                       ./verify_images.sh"

      - name: Pull + restart stack
        run: |
          # --env-file order matters: later files override earlier ones. The
          # workflow-written .env.gcp.version pins SYNAPSE_VERSION last so it
          # cannot be silently overridden by a stale .env.gcp.local on the VM.
          # `--force-recreate --pull always` ensures: (1) every signed digest is
          # re-pulled from Artifact Registry, (2) running containers cycle even
          # if the tag string `:main` resolves to a new digest, (3) no stale
          # local layer can shadow the freshly pushed image. ADR-039.
          gcloud compute ssh ${{ vars.GCP_VM }} \
            --zone=${{ vars.GCP_ZONE }} \
            --tunnel-through-iap \
            --quiet \
            --ssh-flag="-o ServerAliveInterval=30" \
            --ssh-flag="-o ServerAliveCountMax=20" \
            --command="set -e; cd ~/synapse && \
                       gcloud --quiet auth configure-docker ${{ env.AR_HOST }} && \
                       echo '== Deploying:' && cat .env.gcp.version && \
                       echo '== Free disk before pull: stop current stack + prune ==' && \
                       echo '   (each agent image bundles a ~5GB CUDA layer; two coexisting' && \
                       echo '    stacks exceed the boot-disk containerd store. down keeps' && \
                       echo '    named volumes — postgres/neo4j data is preserved.)' && \
                       docker compose -f docker/docker-compose.gcp.yml \
                         --env-file .env.gcp --env-file .env.gcp.local --env-file .env.gcp.version \
                         down --remove-orphans || true && \
                       docker image prune -af >/dev/null 2>&1 || true && \
                       docker builder prune -af >/dev/null 2>&1 || true && \
                       df -h /var/lib/containerd /mnt/synapse-data 2>/dev/null | tail -3 || true && \
                       docker compose -f docker/docker-compose.gcp.yml \
                         --env-file .env.gcp --env-file .env.gcp.local --env-file .env.gcp.version \
                         pull && \
                       docker compose -f docker/docker-compose.gcp.yml \
                         --env-file .env.gcp --env-file .env.gcp.local --env-file .env.gcp.version \
                         up -d --pull always --force-recreate --remove-orphans && \
                       echo '== Running digests:' && \
                       docker compose -f docker/docker-compose.gcp.yml --env-file .env.gcp.version \
                         images --quiet | xargs -r -n1 docker inspect --format \
                         '{{.RepoTags}} -> {{.Id}}'"

      - name: Apply forward DB migrations (existing volume)
        run: |
          # docker-entrypoint-initdb.d only runs on an EMPTY data dir, so an
          # already-provisioned postgres_data volume never picks up new SQL.
          # Apply the idempotent forward migrations explicitly on every deploy.
          # Both files are pure ADD COLUMN/CREATE ... IF NOT EXISTS, so
          # re-running them is a no-op once applied; ON_ERROR_STOP=1 fails the
          # deploy loudly if one is ever not idempotent. -U/-d use the public
          # (non-secret) defaults from docker-compose.gcp.yml (synapse /
          # synapse_audit); the password lives in the container env, not here.
          gcloud compute ssh ${{ vars.GCP_VM }} \
            --zone=${{ vars.GCP_ZONE }} \
            --tunnel-through-iap \
            --quiet \
            --ssh-flag="-o ServerAliveInterval=30" \
            --ssh-flag="-o ServerAliveCountMax=20" \
            --command="cd ~/synapse && \
                       docker compose -f docker/docker-compose.gcp.yml --env-file .env.gcp --env-file .env.gcp.local exec -T postgres psql -U synapse -d synapse_audit -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/07_ws5_steering.sql && \
                       docker compose -f docker/docker-compose.gcp.yml --env-file .env.gcp --env-file .env.gcp.local exec -T postgres psql -U synapse -d synapse_audit -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/08_wsA_consensus_city.sql"

      - name: Provision Kafka topics (auto.create is disabled — pre-provision)
        run: |
          # The 17 inter-agent topics (infrastructure/kafka/topics.json) must be
          # pre-created (auto.create.topics is off). Without this, any produce
          # fails `UNKNOWN_TOPIC` and tier-4/outbox/firehose paths error. The
          # provisioner is idempotent (--if-not-exists). jq is required by the
          # script; install it if the runner image lacks it.
          gcloud compute ssh ${{ vars.GCP_VM }} \
            --zone=${{ vars.GCP_ZONE }} \
            --tunnel-through-iap \
            --quiet \
            --ssh-flag="-o ServerAliveInterval=30" \
            --ssh-flag="-o ServerAliveCountMax=20" \
            --command="cd ~/synapse && \
                       (command -v jq >/dev/null 2>&1 || sudo apt-get install -y jq >/dev/null 2>&1) && \
                       bash scripts/create_kafka_topics.sh"

      - name: Wait for health (max 5 min)
        run: |
          gcloud compute ssh ${{ vars.GCP_VM }} \
            --zone=${{ vars.GCP_ZONE }} \
            --tunnel-through-iap \
            --quiet \
            --ssh-flag="-o ServerAliveInterval=30" \
            --ssh-flag="-o ServerAliveCountMax=20" \
            --command="for i in \$(seq 1 30); do \
                         curl -sf http://localhost/healthz >/dev/null && echo 'Frontend OK' && exit 0; \
                         echo \"...not ready (\$i/30)\"; sleep 10; \
                       done; \
                       echo 'Health check timed out'; \
                       docker compose -f ~/synapse/docker/docker-compose.gcp.yml ps; \
                       exit 1"

      - name: Verify deploy truth (containers)
        run: |
          # Deploy Truth (Sprint 14): "Wait for health" only proves nginx
          # answers — the jsonschema incident shipped with 2 agents crash-
          # looping behind a green deploy. This asserts EVERY compose
          # service is running + healthy, RestartCount==0 (fresh deploy),
          # and one decision actually flows orchestrator -> outbox ->
          # Kafka. Any failure fails the deploy loudly.
          gcloud compute ssh ${{ vars.GCP_VM }} \
            --zone=${{ vars.GCP_ZONE }} \
            --tunnel-through-iap \
            --quiet \
            --ssh-flag="-o ServerAliveInterval=30" \
            --ssh-flag="-o ServerAliveCountMax=20" \
            --command="set -e; cd ~/synapse && \
                       (command -v python3 >/dev/null 2>&1 || sudo apt-get install -y python3 >/dev/null 2>&1) && \
                       python3 scripts/deploy/verify_live.py --on-vm --probe-decision"

      - name: Verify deploy truth (external)
        run: |
          # The user-facing assertion: from OUTSIDE the VM, the deployed
          # /version SHA must equal the commit this workflow is deploying
          # (kills the "months-stale link" failure mode), and every public
          # surface (healthz, topology, agents, decisions auth gate,
          # firehose WebSocket) must answer correctly.
          IP="$(gcloud compute instances describe ${{ vars.GCP_VM }} \
            --zone=${{ vars.GCP_ZONE }} \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')"
          HOST="$(echo "$IP" | tr '.' '-').nip.io"
          echo "Probing https://${HOST} expecting sha ${{ github.sha }}"
          python3 scripts/deploy/verify_live.py --external \
            --base-url "https://${HOST}" \
            --expect-sha "${{ github.sha }}"

      - name: Audit-chain integrity (Sprint 9 verifier)
        run: |
          gcloud compute ssh ${{ vars.GCP_VM }} \
            --zone=${{ vars.GCP_ZONE }} \
            --tunnel-through-iap \
            --quiet \
            --ssh-flag="-o ServerAliveInterval=30" \
            --ssh-flag="-o ServerAliveCountMax=20" \
            --command="cd ~/synapse && \
                       docker compose -f docker/docker-compose.gcp.yml --env-file .env.gcp --env-file .env.gcp.local \
                         exec -T orchestrator python -m orchestrator.audit.cli verify || \
                       echo 'WARN: audit verify returned non-zero (first deploy: empty chain is expected)'"

      - name: Tag-deploy summary
        run: |
          {
            echo "## CD-GCP deploy summary"
            echo ""
            echo "- **Trigger**      : \`${{ github.event_name }}\` on \`${{ github.ref_name }}\`"
            echo "- **Version tag**  : \`${{ steps.dv.outputs.version }}\`"
            echo "- **Commit**       : \`${{ github.sha }}\`"
            echo "- **Registry**     : \`${{ env.AR_REPO_URL }}\`"
            echo "- **VM**           : \`${{ vars.GCP_VM }}\` in \`${{ vars.GCP_ZONE }}\`"
            echo "- **Images signed**: 12 (Cosign keyless, GitHub OIDC → Fulcio)"
            echo ""
            echo "Verify the deploy from anywhere:"
            echo '```bash'
            echo "curl https://<host>/version    # should return git_sha=${{ github.sha }}"
            echo '```'
            echo ""
            echo "Admin UIs are behind IAP — open with:"
            echo '```bash'
            echo "gcloud compute start-iap-tunnel ${{ vars.GCP_VM }} 3000 --local-host-port=localhost:3000 --zone=${{ vars.GCP_ZONE }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open issue on deploy failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // Deploy Truth (Sprint 14): a failed deploy on main must be
            // LOUD — an issue + the email GitHub sends for it — never a
            // red icon nobody looks at. Dedupe per-SHA so retries of the
            // same commit don't spam.
            const sha = context.sha.substring(0, 7);
            const marker = `deploy-failure-${sha}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "deploy-failure",
            });
            if (open.data.some((i) => i.body && i.body.includes(marker))) {
              core.info(`open deploy-failure issue for ${sha} already exists`);
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy failed on main @ ${sha}`,
              body:
                `<!-- ${marker} -->\n` +
                `CD-GCP failed for commit \`${context.sha}\`.\n\n` +
                `- Run: ${runUrl}\n` +
                `- The live system may be STALE or BROKEN until this is fixed.\n` +
                `- Triage: check the failed step; \`make verify-live GCP_IP=<ip>\` ` +
                `shows what a user currently sees.\n`,
              labels: ["sev1", "deploy-failure", "auto-opened"],
            });
