# ============================================================================
# SYNAPSE pre-commit hooks - 14 hooks, every one local (no remote hook repository).
#
# Until truth session 5 this file did not parse, so no hook ever ran (TRUTH-MAP F-34). Now:
#   * a hook that checks what a CI step already checks runs that step's own `run:` text, read
#     from the workflow when the hook runs (scripts/hooks/run_ci_step.py): one definition;
#   * every other hook runs in the `hooks` job of .github/workflows/hooks.yml over the whole tree;
#   * gitleaks alone is local-only: it reads the staged index, which only a developer's machine
#     has. CI's secret scan is security.yml's gitleaks step.
# Install with `pre-commit install`; run everything with `pre-commit run --all-files`.
# ============================================================================
repos:
  - repo: local
    hooks:
      # --- Mirrors of CI steps (ci.yml). The `args` name the workflow, the job and the steps. ---
      - id: ruff-check
        name: ruff-check (ci.yml Ruff lint)
        entry: python scripts/hooks/run_ci_step.py
        args: [.github/workflows/ci.yml, quality-gates, "Ruff lint"]
        language: system
        pass_filenames: false
        files: '^(packages/synapse_common|agents|orchestrator)/.*\.py$'

      - id: ruff-format
        name: ruff-format (ci.yml Ruff format check)
        entry: python scripts/hooks/run_ci_step.py
        args: [.github/workflows/ci.yml, quality-gates, "Ruff format check"]
        language: system
        pass_filenames: false
        files: '^(packages/synapse_common|agents|orchestrator)/.*\.py$'

      - id: mypy-strict
        # The two blocking mypy steps. The agents step is informational in CI
        # (continue-on-error), so the hook does not block on it either.
        name: mypy-strict (ci.yml MyPy strict, packages and orchestrator)
        entry: python scripts/hooks/run_ci_step.py
        args:
          - .github/workflows/ci.yml
          - quality-gates
          - "MyPy strict type check (packages — blocking)"
          - "MyPy strict type check (orchestrator — blocking)"
        language: system
        pass_filenames: false
        files: '^(packages/synapse_common|orchestrator)/.*\.py$'

      - id: schema-validate
        name: schema-validate (ci.yml Schema validation)
        entry: python scripts/hooks/run_ci_step.py
        args: [.github/workflows/ci.yml, quality-gates, "Schema validation"]
        language: system
        pass_filenames: false
        files: '(agent_card\.json|mcp_tools\.json|\.schema\.json)$'

      - id: spec-validate
        name: spec-validate (ci.yml Spec validation)
        entry: python scripts/hooks/run_ci_step.py
        args: [.github/workflows/ci.yml, quality-gates, "Spec validation"]
        language: system
        pass_filenames: false
        files: '^agents/.*spec\.yaml$|^docs/specs/agent_spec_schema\.json$'

      - id: reward-isolation
        name: reward-isolation (ci.yml Reward isolation check, I-2)
        entry: python scripts/hooks/run_ci_step.py
        args: [.github/workflows/ci.yml, quality-gates, "Reward isolation check (I-2)"]
        language: system
        pass_filenames: false
        files: 'rewards\.py$'

      - id: no-paid-apis
        name: no-paid-apis (ci.yml No paid API imports, I-1)
        entry: python scripts/hooks/run_ci_step.py
        args: [.github/workflows/ci.yml, quality-gates, "No paid API imports (I-1 — BLOCKING)"]
        language: system
        pass_filenames: false
        files: '^(agents|orchestrator|packages|api|digital_twin|data_fabric|ml_pipelines|scripts|uplift)/'

      - id: spec-coverage
        name: spec-coverage (ci.yml Spec coverage, threshold 99)
        entry: python scripts/hooks/run_ci_step.py
        args: [.github/workflows/ci.yml, quality-gates, "Spec coverage (Sprint 13 §Phase 5)"]
        language: system
        pass_filenames: false
        files: '^agents/.*(spec\.yaml|\.py)$'

      - id: no-raw-hex
        name: no-raw-hex (ci.yml No raw colour literals, INV-CLR-009)
        entry: python scripts/hooks/run_ci_step.py
        args:
          - .github/workflows/ci.yml
          - chromatic-color-gates
          - "No raw colour literals in components (INV-CLR-009)"
        language: system
        pass_filenames: false
        files: '^frontend/src/'

      # --- Hooks no other job runs: the `hooks` job of hooks.yml runs them over the tree. ---
      - id: jitter-enforcement
        name: jitter-enforcement (ADR-016)
        entry: python scripts/hooks/jitter_enforcement.py
        language: python
        files: '\.py$'

      - id: contract-validate
        name: contract-validate (consumer-driven contracts)
        entry: python scripts/hooks/contract_validate.py
        language: python
        files: '^agents/[^/]+/contracts/[^/]+_contract\.py$'

      - id: kv-cache-check
        name: kv-cache-check (I-13, ADR-021)
        entry: python scripts/hooks/kv_cache_check.py
        language: python
        files: '^(orchestrator/llm/context_builder\.py|orchestrator/llm/ollama_client\.py|orchestrator/consensus/protocol\.py)$'

      - id: color-spec-validate
        name: color-spec-validate
        entry: python scripts/hooks/color_spec_validate.py
        language: python
        files: '^design-system/color/(color-system\.spec\.yml|schema/color-spec\.schema\.json)$'
        pass_filenames: false
        additional_dependencies: ["pyyaml>=6.0,<7.0", "jsonschema>=4.18,<5.0"]

      # --- Local only: inspects the staged index (WS-11 cross-cutting section 3.2). ---
      - id: gitleaks
        name: gitleaks (local only)
        entry: |
          bash -c '
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks protect --staged --redact --no-banner
          else
            echo "gitleaks not installed, so this hook checked nothing; install from https://github.com/gitleaks/gitleaks"
          fi
          '
        language: system
        pass_filenames: false
        always_run: true
