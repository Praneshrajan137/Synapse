# ============================================================================
# SYNAPSE Pre-Commit Hooks — 11 hooks enforcing architectural invariants
# ============================================================================
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        name: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        name: mypy-strict
        args: [--strict]
        additional_dependencies:
          - pydantic>=2.7.0
          - types-PyYAML

  - repo: local
    hooks:
      - id: schema-validate
        name: schema-validate
        entry: python scripts/validate_schemas.py
        language: python
        files: '(agent_card\.json|mcp_tools\.json|\.schema\.json)$'
        pass_filenames: false

      - id: spec-validate
        name: spec-validate
        entry: python -c "import yaml, json, jsonschema, sys; spec=yaml.safe_load(open(sys.argv[1])); schema=json.load(open('docs/specs/agent_spec_schema.json')); jsonschema.validate(spec, schema); print(f'OK {sys.argv[1]}')"
        language: python
        files: 'spec\.yaml$'
        additional_dependencies: [pyyaml, jsonschema]

      - id: reward-isolation
        name: reward-isolation
        entry: python -c "
import sys, ast
for f in sys.argv[1:]:
    tree = ast.parse(open(f).read())
    for node in ast.walk(tree):
        if isinstance(node, ast.ImportFrom) and node.module and 'agents.' in node.module:
            parts = node.module.split('.')
            if len(parts) >= 2 and parts[1] != f.split('/')[1]:
                print(f'FAIL {f}: Cross-agent import from {node.module} violates I-2')
                sys.exit(1)
print('OK Reward isolation verified')
"
        language: python
        files: 'rewards\.py$'

      - id: no-paid-apis
        name: no-paid-apis
        entry: python -c "
import sys
PAID = ['import openai', 'from openai', 'import anthropic', 'from anthropic',
        'import cohere', 'from cohere', 'import replicate', 'from replicate']
for f in sys.argv[1:]:
    content = open(f).read()
    for pattern in PAID:
        if pattern in content:
            print(f'FAIL {f}: Paid API import detected: {pattern} — violates I-1')
            sys.exit(1)
print('OK No paid API imports')
"
        language: python
        files: '\.py$'

      - id: jitter-enforcement
        name: jitter-enforcement
        entry: python -c "
import sys
for f in sys.argv[1:]:
    content = open(f).read()
    if 'time.sleep' in content and 'retry_with_jitter' not in content and 'test_' not in f:
        print(f'FAIL {f}: time.sleep without retry_with_jitter — violates ADR-016')
        sys.exit(1)
print('OK Jitter enforcement verified')
"
        language: python
        files: '\.py$'

      - id: spec-coverage
        name: spec-coverage
        entry: python scripts/check_spec_coverage.py
        language: python
        files: '(spec\.yaml|test_spec\.py)$'
        pass_filenames: false
        additional_dependencies: [pyyaml]

      - id: contract-validate
        name: contract-validate
        entry: python -c "
import sys, importlib.util, ast
for f in sys.argv[1:]:
    try:
        tree = ast.parse(open(f, encoding='utf-8').read())
    except SyntaxError as exc:
        print(f'FAIL {f}: syntax error — {exc}')
        sys.exit(1)
    imports_common_models = any(
        isinstance(n, ast.ImportFrom)
        and n.module
        and n.module.startswith('synapse_common')
        for n in ast.walk(tree)
    )
    has_pydantic_base = any(
        isinstance(n, ast.ClassDef)
        and any(
            (isinstance(b, ast.Name) and b.id in {'BaseModel', 'RootModel'})
            or (isinstance(b, ast.Attribute) and b.attr in {'BaseModel', 'RootModel'})
            for b in n.bases
        )
        for n in ast.walk(tree)
    )
    if not (imports_common_models or has_pydantic_base):
        print(f'FAIL {f}: contract module must import from synapse_common or define a Pydantic model — violates ADR-013')
        sys.exit(1)
print('OK Contract modules validated')
"
        language: python
        files: 'contracts/.*\.py$'

      - id: kv-cache-check
        name: kv-cache-check
        entry: python -c "
import sys, re
BAD = [
    (re.compile(r'f\"[^\"]*\\{[^}]+\\}[^\"]*\"'), 'f-string in KV-cache-sensitive file — breaks ADR-021 stable prefix'),
    (re.compile(r\"f'[^']*\\{[^}]+\\}[^']*'\"), 'f-string in KV-cache-sensitive file — breaks ADR-021 stable prefix'),
    (re.compile(r'\\.format\\('), '.format() in KV-cache-sensitive file — breaks ADR-021 stable prefix'),
    (re.compile(r'time\\.time\\(\\)'), 'time.time() in KV-cache-sensitive file — breaks ADR-021 stable prefix'),
    (re.compile(r'datetime\\.now\\('), 'datetime.now() in KV-cache-sensitive file — breaks ADR-021 stable prefix'),
]
for f in sys.argv[1:]:
    content = open(f, encoding='utf-8').read()
    # Skip lines inside docstrings / comments by checking full file; approximation acceptable for pre-commit.
    for line_no, line in enumerate(content.splitlines(), 1):
        stripped = line.strip()
        if stripped.startswith('#') or stripped.startswith('\"\"\"') or stripped.startswith(\"'''\"):
            continue
        for pat, msg in BAD:
            if pat.search(line):
                print(f'FAIL {f}:{line_no}: {msg}')
                print(f'  >>> {stripped}')
                sys.exit(1)
print('OK KV-cache stable prefix preserved')
"
        language: python
        files: '(orchestrator/llm/context_builder\.py|orchestrator/llm/ollama_client\.py|orchestrator/consensus/protocol\.py)$'

      - id: no-raw-hex
        name: no-raw-hex
        entry: python scripts/lint_chromatic_hex.py
        language: python
        files: 'frontend/src/.*\.(jsx?|tsx?)$'

      - id: color-spec-validate
        name: color-spec-validate
        entry: python -c "import yaml,json,jsonschema; jsonschema.validate(yaml.safe_load(open('design-system/color/color-system.spec.yml')), json.load(open('design-system/color/schema/color-spec.schema.json'))); print('OK color-system.spec.yml')"
        language: python
        files: '(color-system\.spec\.yml|color-spec\.schema\.json)$'
        pass_filenames: false
        additional_dependencies: [pyyaml, jsonschema]

      # WS-11 cross-cutting §3.1 — enforce the workflow-rule that CLAUDE.md
      # carries in prose ("NEVER use `git worktree add` in this repo").
      # The May 2026 sprawl incident produced ~50K LOC of unmerged parallel
      # rewrites; this hook makes any reintroduction of `.claude/worktrees/`
      # fail commit time rather than CI time.
      - id: no-worktrees
        name: no-worktrees
        entry: python -c "import pathlib,sys; bad=[p for p in pathlib.Path('.claude/worktrees').glob('*') if p.exists()] if pathlib.Path('.claude/worktrees').exists() else []; sys.exit(0 if not bad else (print('FAIL: .claude/worktrees/ must be empty (CLAUDE.md Workflow Rules). Bad paths:', bad) or 1))"
        language: python
        pass_filenames: false
        always_run: true

      # WS-11 cross-cutting §3.2 — gitleaks on every commit. Prevents a
      # `.env` slip-through; pattern-based, not name-based.
      - id: gitleaks
        name: gitleaks
        entry: |
          bash -c '
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks protect --staged --redact --no-banner
          else
            echo "gitleaks not installed; install from https://github.com/gitleaks/gitleaks"
            exit 0  # do not block when not installed locally — CI still gates
          fi
          '
        language: system
        pass_filenames: false
        always_run: true
