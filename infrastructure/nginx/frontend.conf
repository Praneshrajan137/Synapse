# ---------------------------------------------------------------------------
# SYNAPSE Atlas Console — in-container nginx config.
#
# This file ships INSIDE the synapse-frontend image and serves the built
# Vite static assets on :8080. The OUTER reverse-proxy
# (infrastructure/nginx/nginx.conf) terminates port 80 and routes / to this
# container as `synapse-frontend:8080`.
#
# Why two nginx layers?
#   - Outer nginx owns CSP, rate-limiting, request-id injection, CORS.
#   - Inner nginx owns SPA routing (index.html fallback), cache headers,
#     and brotli/gzip on static assets.
# Splitting them keeps the outer config infrastructure-owned and the inner
# config app-owned (CODEOWNERS @frontend-team).
# ---------------------------------------------------------------------------

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression (static assets only). Brotli requires nginx-mod-brotli; the
    # nginx-unprivileged base image does not ship it, so gzip is sufficient.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # Long-cache the hashed asset bundles (vite emits content-hashed filenames).
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Web app manifest, robots — short cache.
    location ~* \.(webmanifest|json|xml|txt)$ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Health probe — used by Docker HEALTHCHECK and the outer nginx upstream.
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain";
        return 200 "ok\n";
    }

    # SPA fallback. Any path that isn't a static asset returns index.html so
    # TanStack Router can take over client-side. Cache index.html for 0s so a
    # deploy is visible immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Hide nginx version on responses.
    server_tokens off;
}
