# ============================================================================
# SYNAPSE Nginx — GCP deployment edge with TLS termination
#
# HTTP (80) — redirects to HTTPS, except /.well-known/acme-challenge/ for renewals
# HTTPS (443) — terminates TLS, proxies to frontend / orchestrator / grafana
#
# Cert paths assume the host's /etc/letsencrypt is bind-mounted (see
# docker-compose.gcp.yml). Renewal runs on the host via certbot.timer; nginx
# picks up new certs on `docker exec synapse-nginx nginx -s reload` (or restart).
# ============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # Docker-internal addresses bypass rate limiting (load testing, internal probes)
    geo $is_internal {
        default         0;
        172.16.0.0/12   1;
        10.0.0.0/8      1;
        192.168.0.0/16  1;
    }

    map $is_internal $api_limit_key {
        0   $binary_remote_addr;
        1   "";
    }

    limit_req_zone $api_limit_key zone=api_limit:10m rate=100r/m;
    limit_req_zone $api_limit_key zone=ws_limit:10m rate=30r/m;

    log_format synapse '$remote_addr - $request_id [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'rt=$request_time';

    access_log /var/log/nginx/access.log synapse;

    # SSL hardening (Mozilla intermediate profile, May 2026)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    upstream api          { server synapse-api:8000; }
    upstream orchestrator { server synapse-orchestrator:8085; }
    upstream frontend     { server synapse-frontend:8080; }
    upstream grafana      { server synapse-grafana:3000; }
    upstream prometheus   { server synapse-prometheus:9090; }

    # ── HTTP → HTTPS redirect (allow ACME challenge + healthcheck through) ──
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Docker healthcheck endpoint (alpine wget can't follow HTTPS redirects)
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS — the real app ─────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name 34-180-49-108.nip.io;

        ssl_certificate     /etc/letsencrypt/live/34-180-49-108.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/34-180-49-108.nip.io/privkey.pem;

        set $req_id $request_id;
        proxy_set_header X-Request-ID $req_id;
        add_header X-Request-ID $req_id always;

        # CORS — same-origin only (the frontend lives on this same domain)
        set $cors_origin "";
        if ($http_origin = "https://34-180-49-108.nip.io") {
            set $cors_origin $http_origin;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" always;
        add_header Access-Control-Max-Age 3600 always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # ── API → API gateway (handles auth, decisions, agents, demo, telemetry) ─
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        # ── Deployed-version truth (ADR-039) ────────────────────────────────
        # The API gateway exposes GET /version (build SHA + time baked at image
        # build). nginx only proxies /api/* to the gateway, so a bare /version
        # would otherwise fall through to the SPA. Map it explicitly so the
        # documented `curl https://…/version` deploy-truth check works.
        location = /version {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://api/version;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 10s;
        }

        # ── Orchestrator direct (admin debug; firewall already restricts) ──
        location /orchestrator/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://orchestrator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ── WebSockets (firehose lives on the API gateway) ─────────────────
        location /ws/ {
            limit_req zone=ws_limit burst=10 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }

        # ── Grafana ─────────────────────────────────────────────────────────
        # GF_SERVER_ROOT_URL in .env.gcp must end with /grafana/ for nav to
        # generate correct links. GF_SERVER_SERVE_FROM_SUB_PATH not strictly
        # needed for v11 with proper root_url, but harmless to add later.
        location /grafana/ {
            proxy_pass http://grafana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Grafana live-tail (WebSocket)
        location /grafana/api/live/ {
            proxy_pass http://grafana/api/live/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # ── Prometheus (admin only — already gated by firewall, but keep nginx restrictive too) ─
        location /prometheus/ {
            allow 10.0.0.0/8;
            allow 157.51.0.0/16;
            deny all;
            proxy_pass http://prometheus/;
            proxy_set_header Host $host;
        }

        # ── Frontend (everything else) ──────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
