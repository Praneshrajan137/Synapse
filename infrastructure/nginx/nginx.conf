# SYNAPSE API Gateway — Nginx Reverse Proxy
# Security: Rate limiting, CORS whitelist, request ID injection, CSP

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # Docker-internal addresses bypass rate limiting (load testing)
    geo $is_internal {
        default         0;
        172.16.0.0/12   1;
        10.0.0.0/8      1;
        192.168.0.0/16  1;
    }

    map $is_internal $api_limit_key {
        0   $binary_remote_addr;
        1   "";
    }

    # Rate limiting: 100 req/min per external IP; internal IPs exempt
    limit_req_zone $api_limit_key zone=api_limit:10m rate=100r/m;
    limit_req_zone $api_limit_key zone=ws_limit:10m rate=30r/m;

    # Logging with request ID
    log_format synapse '$remote_addr - $request_id [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'rt=$request_time';

    access_log /var/log/nginx/access.log synapse;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Permissions-Policy — disable APIs we never use. Tightens the browser's
    # available attack surface on the SPA. Camera/mic/geolocation are
    # explicitly forbidden because no Atlas Console surface needs them.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    # HSTS — only when serving over TLS. Local dev keeps this off (no force-ssl).
    # In production set HSTS_MAX_AGE>0 to enable; left commented for dev:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ─── Content-Security-Policy (B7 — plan §11) ──────────────────────────────
    # Strict, with reporting. Trusted Types prevents DOM-XSS via innerHTML
    # without an explicit policy (DOMPurify creates the policy in
    # src/shared/markdown/render.ts). MapLibre needs blob: workers; Deck.gl
    # uses inline shaders so 'unsafe-inline' is required for style and a
    # nonce-controlled inline-script ban is enforced (no 'unsafe-inline' for
    # script-src — Vite builds without inline scripts in production).
    #
    # connect-src includes the same origin (covers /api/v1/stream/ SSE) and
    # localhost dev origins. Adjust for your prod domain in the deploy overlay.
    set $atlas_csp "default-src 'self'; \
script-src 'self'; \
script-src-elem 'self'; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data: blob:; \
font-src 'self' data:; \
worker-src 'self' blob:; \
connect-src 'self' ws://localhost:* wss://localhost:* http://localhost:* https://*.tiles.openfreemap.org https://demotiles.maplibre.org; \
frame-ancestors 'none'; \
form-action 'self'; \
base-uri 'self'; \
object-src 'none'; \
upgrade-insecure-requests; \
require-trusted-types-for 'script'; \
trusted-types atlas-dompurify atlas-router default; \
report-to atlas-csp";
    add_header Content-Security-Policy $atlas_csp always;
    # Reporting API endpoint — both the new Reporting-Endpoints header and
    # the legacy Report-To. Both point at /api/v1/rum (router rum.py
    # accepts application/reports+json + application/csp-report).
    add_header Reporting-Endpoints "atlas-csp=\"/api/v1/rum\"" always;
    add_header Report-To "{\"group\":\"atlas-csp\",\"max_age\":10886400,\"endpoints\":[{\"url\":\"/api/v1/rum\"}]}" always;
    # Legacy CSP report-uri (browsers that haven't shipped Reporting API yet).
    add_header Content-Security-Policy-Report-Only $atlas_csp always;

    upstream orchestrator {
        server synapse-orchestrator:8085;
    }

    # synapse-frontend serves the production static bundle on :8080 (see
    # frontend/Dockerfile + infrastructure/nginx/frontend.conf). The dev
    # server (vite) listens on :3001 and is reached directly without nginx.
    # Plan §11 / B6: previous value :5173 (Vite preview default) caused a
    # phantom upstream — corrected here.
    upstream frontend {
        server synapse-frontend:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Inject X-Request-ID
        set $req_id $request_id;
        proxy_set_header X-Request-ID $req_id;
        add_header X-Request-ID $req_id always;

        # CORS whitelist
        set $cors_origin "";
        if ($http_origin ~* "^https?://localhost(:[0-9]+)?$") {
            set $cors_origin $http_origin;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        # X-CSRF: double-submit token for BFF cookie session (ADR-027).
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID, X-CSRF" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age 3600 always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # SSE bridge for Kafka topic tails. Plan §11/B1 + ADR-026.
        # MUST be matched BEFORE /api/ so the buffering-off settings apply.
        # X-Accel-Buffering: no is set by sse_starlette too; this is belt+braces.
        location /api/v1/stream/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://orchestrator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Disable response buffering so each SSE event flushes immediately.
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            # SSE heartbeat is 15s; allow up to 24h before idle close, since
            # ops sessions span a shift.
            proxy_read_timeout 24h;
            chunked_transfer_encoding on;
        }

        # BFF auth (Atlas Console — plan §11/B3 + ADR-027). Cookies pass through
        # by default; we ensure Set-Cookie is propagated to the browser and that
        # the SameSite=Strict cookie reaches the gateway.
        location /auth/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://orchestrator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Make sure Set-Cookie isn't stripped on the response path.
            proxy_pass_header Set-Cookie;
            proxy_read_timeout 30s;
        }

        # API routes — proxy to orchestrator until a dedicated gateway exists.
        # Note: /api/v1/stream/ is matched first (SSE-specific block above).
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://orchestrator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Pass cookies + CSRF header through to the BFF for session resolution.
            proxy_pass_header Set-Cookie;
            proxy_read_timeout 30s;
        }

        # Orchestrator direct
        location /orchestrator/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://orchestrator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket for HITL escalation (existing /ws/escalation).
        # Kept WS-only — Kafka tails moved to SSE per ADR-026.
        location /ws/ {
            limit_req zone=ws_limit burst=10 nodelay;
            proxy_pass http://orchestrator;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}
