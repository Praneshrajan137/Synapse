# SYNAPSE API Gateway — Nginx Reverse Proxy
# Security: Rate limiting, CORS whitelist, request ID injection, CSP

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # Docker-internal addresses bypass rate limiting (load testing)
    geo $is_internal {
        default         0;
        172.16.0.0/12   1;
        10.0.0.0/8      1;
        192.168.0.0/16  1;
    }

    map $is_internal $api_limit_key {
        0   $binary_remote_addr;
        1   "";
    }

    # Rate limiting: 100 req/min per external IP; internal IPs exempt
    limit_req_zone $api_limit_key zone=api_limit:10m rate=100r/m;
    limit_req_zone $api_limit_key zone=ws_limit:10m rate=30r/m;

    # Logging with request ID
    log_format synapse '$remote_addr - $request_id [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'rt=$request_time';

    access_log /var/log/nginx/access.log synapse;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:* wss://localhost:*" always;

    upstream orchestrator {
        server synapse-orchestrator:8085;
    }

    upstream frontend {
        server synapse-frontend:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Inject X-Request-ID
        set $req_id $request_id;
        proxy_set_header X-Request-ID $req_id;
        add_header X-Request-ID $req_id always;

        # CORS whitelist
        set $cors_origin "";
        if ($http_origin ~* "^https?://localhost(:[0-9]+)?$") {
            set $cors_origin $http_origin;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" always;
        add_header Access-Control-Max-Age 3600 always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # API routes — proxy to orchestrator until a dedicated gateway exists
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://orchestrator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # Orchestrator direct
        location /orchestrator/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://orchestrator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket for HITL
        location /ws/ {
            limit_req zone=ws_limit burst=10 nodelay;
            proxy_pass http://orchestrator;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}
