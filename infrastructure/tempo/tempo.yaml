# Grafana Tempo — trace store for SYNAPSE distributed tracing.
# Receives OTLP from the Synaptic Calm frontend (browser SDK) and, in
# future, from the Python services. Self-hosted, zero cost (invariant
# I-1). Query it from the existing Grafana via a Tempo datasource.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

usage_report:
  reporting_enabled: false
