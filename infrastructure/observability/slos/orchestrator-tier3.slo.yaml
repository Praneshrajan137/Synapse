version: "prometheus/v1"
service: "orchestrator"
labels:
  team: synapse
  tier: tier_3
slos:
  - name: "orchestrator-tier3-latency"
    objective: 97.0
    description: Tier-3 multi-agent consensus must complete in <15 s p99 (I-10).
    sli:
      events:
        error_query: |
          sum(rate(synapse_consensus_duration_seconds_bucket{tier="tier_3",le="15"}[{{.window}}]))
        total_query: |
          sum(rate(synapse_consensus_duration_seconds_count{tier="tier_3"}[{{.window}}]))
    alerting:
      name: orchestrator-tier3-latency-burn
      labels:
        severity: page
      annotations:
        summary: Tier-3 latency budget burning
        runbook_url: https://github.com/Praneshrajan137/synapse/blob/main/docs/runbooks/brownout_active.md
      page_alert:
        labels:
          severity: page
      ticket_alert:
        labels:
          severity: ticket
