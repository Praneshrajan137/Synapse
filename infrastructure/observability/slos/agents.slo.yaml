# SYNAPSE Agent inference SLOs (Sprint 8, WS-4).
#
# One SLO per agent for inference latency. Thresholds derived from the
# tier each agent typically operates at (per its A2A handler default).

version: synapse-slo/v1
service: synapse-agents
labels:
  team: synapse-platform

slos:
  - name: demand_prophet_inference_latency
    description: "demand_prophet inference completes under 500ms p99 (Tier 2 SLA, INV-DP-008)"
    target_sli: 99.0
    window_days: 28
    metric:
      type: latency_bucket
      bucket_metric: synapse_inference_latency_seconds_bucket
      threshold_seconds: 0.5
      labels:
        agent_name: demand_prophet
    burn_rates:
      - severity: page
        long_window: 1h
        short_window: 5m
        burn: 14.4
      - severity: ticket
        long_window: 6h
        short_window: 30m
        burn: 6.0

  - name: routing_navigator_inference_latency
    description: "routing_navigator inference completes under 100ms p99 (Tier 1)"
    target_sli: 99.5
    window_days: 28
