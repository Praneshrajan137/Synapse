      bucket_metric: synapse_inference_latency_seconds_bucket
      threshold_seconds: 0.1
      labels:
        agent_name: routing_navigator
    burn_rates:
      - severity: page
        long_window: 1h
        short_window: 5m
        burn: 14.4
      - severity: ticket
        long_window: 6h
        short_window: 30m
        burn: 6.0

