  - name: kafka_consumer_lag
    description: "Kafka consumer-group lag stays below 1000 messages p99"
    target_sli: 99.0
    window_days: 28
    metric:
      type: availability_ratio
      good_query: |
        sum(synapse_kafka_consume_lag < bool 1000)
      total_query: |
        sum(synapse_kafka_consume_lag >= bool 0)
    burn_rates:
      - severity: ticket
        long_window: 1h
        short_window: 5m
        burn: 14.4
