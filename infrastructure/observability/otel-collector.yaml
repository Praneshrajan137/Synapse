# SYNAPSE OpenTelemetry Collector config (v4.0 §15)
# Ingests OTLP (HTTP on 4318, gRPC on 4317) from every agent+orchestrator
# via synapse_common.tracing. Exports to Jaeger (trace UI) and Prometheus
# (via pushgateway, already wired in docker-compose.yml).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 2s
    send_batch_size: 512
  memory_limiter:
    check_interval: 2s
    limit_mib: 256

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  logging:
    loglevel: warn

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, logging]
