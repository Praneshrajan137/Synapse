# SOPS configuration for SYNAPSE secrets (Sprint 9 §M-sec-7).
#
# Encrypt with:  sops --encrypt --in-place infrastructure/secrets/<env>.yaml
# Decrypt with:  sops --decrypt infrastructure/secrets/<env>.yaml
#
# Each environment uses a separate age recipient. Generate keys with:
#   age-keygen -o ~/.config/sops/age/keys.txt
# Then set SOPS_AGE_KEY_FILE in your shell + register the public key here.

creation_rules:
  - path_regex: 'infrastructure/secrets/dev\.(.+)\.yaml$'
    # Replace this placeholder with your dev age public key before committing
    # real encrypted values. The repo ships a dev.example.yaml that is NOT encrypted.
    age: REPLACE_WITH_DEV_AGE_PUBLIC_KEY

  - path_regex: 'infrastructure/secrets/staging\.(.+)\.yaml$'
    age: REPLACE_WITH_STAGING_AGE_PUBLIC_KEY

  - path_regex: 'infrastructure/secrets/prod\.(.+)\.yaml$'
    age: REPLACE_WITH_PROD_AGE_PUBLIC_KEY
