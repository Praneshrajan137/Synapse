# Sprint 9 §M-sec-7 — example secrets payload (NOT encrypted; pattern only).
#
# To bootstrap a real dev environment:
#   1. cp dev.example.yaml dev.local.yaml
#   2. fill in real values
#   3. sops --encrypt --in-place dev.local.yaml   (assumes .sops.yaml age key set)
#   4. commit dev.local.yaml ONLY in its encrypted form
#
# Production / staging follow the same flow with their respective age keys.

pinecone:
  api_key: REPLACE_WITH_PINECONE_API_KEY
  environment: us-west1-gcp

langsmith:
  api_key: REPLACE_WITH_LANGSMITH_API_KEY
  project: synapse-dev

neo4j:
  username: neo4j
  password: REPLACE_WITH_NEO4J_PASSWORD

postgres:
  username: synapse_app
  password: REPLACE_WITH_POSTGRES_PASSWORD

# Sprint 9 anchorage — GitHub Releases upload uses GITHUB_TOKEN from the runtime.
audit_anchor:
  github_repo: Praneshrajan137/synapse
  release_tag: audit-anchors
