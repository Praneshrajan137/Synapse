  - alert: orchestrator-tier4-latency-burn-1h-5m
    expr: ((1 - (sum(rate(synapse_consensus_duration_seconds_bucket{tier="tier_4",le="120"}[1h]))
      / sum(rate(synapse_consensus_duration_seconds_count{tier="tier_4"}[1h])))) >
      0.72000) and ((1 - (sum(rate(synapse_consensus_duration_seconds_bucket{tier="tier_4",le="120"}[5m]))
      / sum(rate(synapse_consensus_duration_seconds_count{tier="tier_4"}[5m])))) >
