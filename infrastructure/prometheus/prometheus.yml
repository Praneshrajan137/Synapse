# ============================================================================
# SYNAPSE Prometheus Configuration
# ============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alert_rules.yml"
  - "alert_rules_sprint4.yml"
  - "sprint5_alert_rules.yml"

scrape_configs:
  # ── Prometheus self-monitoring ──
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── Infrastructure Exporters ──
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "redis"
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-jmx-exporter:9404"]
        labels:
          service: "kafka"
  - job_name: "neo4j"
    metrics_path: /metrics
    static_configs:
      - targets: ["neo4j:2004"]
        labels:
          service: "neo4j"

  # ── Agent Services (Bengaluru) ──
  - job_name: "synapse-agents"
    static_configs:
      - targets:
          - "demand-prophet:8001"
          - "routing-navigator:8002"
          - "inventory-sentinel:8003"
          - "freshness-guardian:8004"
          - "pricing-oracle:8005"
          - "disruption-shield:8006"
          - "supplier-trust:8007"
          - "sustainability-agent:8008"
        labels:
          city: "bengaluru"

  # ── Agent Services (Mumbai — Sprint 6) ──
  - job_name: "synapse-agents-mumbai"
    static_configs:
      - targets:
          - "demand-prophet-mumbai:8000"
          - "routing-navigator-mumbai:8000"
          - "inventory-sentinel-mumbai:8000"
          - "freshness-guardian-mumbai:8000"
          - "pricing-oracle-mumbai:8000"
          - "disruption-shield-mumbai:8000"
          - "supplier-trust-mumbai:8000"
          - "sustainability-agent-mumbai:8000"
        labels:
          city: "mumbai"

  # ── Orchestrator (Sprint 4) ──
  - job_name: "synapse-orchestrator"
    static_configs:
      - targets: ["orchestrator:8085"]

  # ── MLflow ──
  - job_name: "mlflow"
    static_configs:
      - targets: ["mlflow:5000"]

  # ── API Gateway ──
  - job_name: "api-gateway"
    static_configs:
      - targets: []
    # api:8000
