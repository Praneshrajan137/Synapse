# SYNAPSE — Per-package coverage floors (Sprint 13 §Phase 2 / ADR pending)
#
# These are the mechanical CI gates enforced by `scripts/coverage_per_package.py`.
# Each row is the MEASURED current floor minus a small regression buffer,
# never an aspirational target. Floors ratchet upward only — operator step is
# `python scripts/coverage_ratchet.py --apply` after a coverage-improving PR.
#
# The 84.0 target on every row is the Sprint-13 destination. Get there over many PRs.
#
# Provenance: floor numbers below are seeded from
# `docs/state/coverage-baseline-2026-05-29.md`. Rows marked CI-MUST-MEASURE
# carry zero local signal (the deps aren't installed on the Windows dev box);
# the CI Linux runner's first post-merge run replaces them with verified numbers.
#
# Schema:
#   packages.<path>:
#     line:        float — line+branch combined %, the gate metric
#     target:      float — Sprint-13 destination (always 84.0)
#     note:        str   — provenance, why this number, and what blocks ratchet
#
# Coverage modes:
#   The pytest run uses `--cov-branch`, so the `line` field is actually the
#   combined line+branch number coverage.py emits in the "TOTAL ... Cover" column.
#   We do not split them — that would double-count gates without adding signal.

target: 84.0  # documented destination for every package; not enforced directly

packages:
