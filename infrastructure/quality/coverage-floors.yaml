# Ratchet protocol (per `scripts/coverage_ratchet.py`):
#   - After each PR that adds tests, run `python scripts/coverage_ratchet.py`.
#   - If MEASURED - floor > 2.0 on any package, the helper prints a proposed
#     bump and waits for `--apply` to write it back.
#   - The bump lands as part of the same PR (or the very next one), so the
#     improvement is locked in mechanically.
#   - Floors NEVER decrease. A regression is supposed to fail CI — that is
#     the entire point. To intentionally lower a floor (e.g., for a deletion
#     that removes covered code), submit the floor change as a separate
#     reviewed PR with explicit justification.
