    target: 84.0
    note: "Sprint 13 Phase 3 (round 2) -- TARGET REACHED: measured 84.54% on 2026-05-29. Floor ratcheted 60.5 -> 75.5 -> 83.5 across 2 PRs covering budget/dbc/reward_shadow/outbox/schema_registry (round 1) + dpdpa cascade/outbox-enqueue/KafkaHeaderCarrier/langsmith disabled-path (round 2). Total +118 tests in synapse_common alone, 153 -> 239 passing. Remaining gap to 84% target is now <0.5pp -- next PR can push to 90+ by adding tracing.py OTel inject-path tests (currently 39%)."

