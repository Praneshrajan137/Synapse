# NO TOTAL IS ASSERTED HERE, DELIBERATELY (R4.10). Recorded because it is the whole
# lesson of this task.
#
# The implementation plan said: "The ledger row reads `unlabelled-advisory=10`; static
# re-derivation yields 9 across 6 files. The residual is not reproducible by reading. Do
# not invent it -- let the corrected gate report the count." Two independent static
# censuses agreed on 9 across 6 files. Both were wrong, and so is any fixed number
# written down here: the count is a function of the tree and the reading, and BOTH moved
