# SYNAPSE -- Declarative document-number pins (AD-3; R7.5, R7.8, R7.10, R11.8, R14.3)
#
# `scripts/audit/doc_truth.py` reads this table instead of carrying one bespoke
# claim function per number (task 2.5). Adding a pin is a data edit, which is
# what makes Requirement 7's eight-number sweep affordable and R7.5/R7.10 total
# rather than per-number.
#
# Read contract: `encoding='utf-8'` on every read (E-S13-07).
#
# Row shape:
#   id         str  -- stable identifier, also the ClaimResult name
#   kind       str  -- threshold | flag | blocking-gate | required-job
#   required   bool -- a required pin that cannot be evaluated makes doc_truth
#                      report UNAVAILABLE; an `ok` sibling never masks it (R1.6)
#   document   str  -- repo-relative path of the governance document
#   anchor     str  -- Python regex with a named group `value`, matched against
#                      the document text. MUST match exactly one line.
#   source     str  -- the mechanical source of truth
#   extractor  str  -- yaml_path:<dotted> | json_path:<jsonpath> | regex:<pattern>
#   compare    str  -- numeric | string | count
#   scale      str  -- identity | percent_of_fraction (doc states 80, source 0.80)
#
# A pin whose document value and source value differ FAILs naming both sides.
# Extraction is a pure regex/yaml/json read, hence idempotent -- which is what
# design Property 5's round-trip clause asserts.
#
# Extractor semantics (scripts/audit/doc_truth.py, task 2.5). Every extractor
# yields an ORDERED SET of raw source strings -- raw, so a failure detail can
# quote the source byte-for-byte (`0.70`, not `0.7`):
#   yaml_path:<dotted>   walks the YAML node tree; a `[]` segment fans out over a
#                        sequence (`required[].job` -> every declared job name)
#   json_path:$.<dotted> the same walk over a JSON document
#   regex:<pattern>      every match of the pattern; the named group `value` when
#                        present, else group 1, else the whole match
#
# Comparison semantics -- driven by `compare` ALONE, never by `kind`, so a pin's
# verdict is readable from its own row:
#   numeric  the documented value equals the single extracted value after `scale`
#   string   the documented value is a member of the extracted set
#   count    the documented value (digits, or an English number word such as
#            `two`, since governance prose spells small counts) equals the number
#            of DISTINCT extracted values. An empty extraction is the honest count
#            `0` and FAILs against a non-zero claim -- it is never an unavailable.
#
# `kind` classifies which mechanical source family a pin resolves against and is
# reported with the verdict: threshold/flag -> a config or workflow value;
# blocking-gate -> the generated docs/state/GATE_SURFACE.md record (R11.8);
# required-job -> infrastructure/quality/required-checks.yaml (R14.3).

version: 1

pins:
  # -------------------------------------------------------------------------
  # Coverage target (CLAUDE.md Testing Rules)
  # -------------------------------------------------------------------------
  - id: coverage-target
    kind: threshold
    required: true
    document: CLAUDE.md
    anchor: 'target \*\*(?P<value>[\d.]+)% line\+branch'
    source: infrastructure/quality/coverage-floors.yaml
    extractor: 'yaml_path:target'
    compare: numeric
    scale: identity

  # -------------------------------------------------------------------------
  # Spec-coverage threshold -- the one number the audit found genuinely pinned.
  # Migrated verbatim from doc_truth.py::_claim_spec_threshold (task 2.5).
  # -------------------------------------------------------------------------
  - id: spec-coverage-threshold
    kind: threshold
    required: true
    document: CLAUDE.md
    anchor: 'CI gate `--threshold (?P<value>\d+)`'
    source: .github/workflows/ci.yml
    extractor: 'regex:check_spec_coverage\.py --threshold (?P<value>\d+)'
    compare: numeric
    scale: identity

  # -------------------------------------------------------------------------
  # Frontend Stryker break -- KNOWN DRIFT, see `drift:` below. R7.8.
  # -------------------------------------------------------------------------
  - id: stryker-break
    kind: threshold
    required: true
    document: CLAUDE.md
    anchor: 'Frontend Stryker `break: (?P<value>\d+)`'
    source: frontend/stryker.conf.json
    extractor: 'json_path:$.thresholds.break'
    compare: numeric
    scale: identity

  # -------------------------------------------------------------------------
  # Mutation survival ceilings (CLAUDE.md Testing Rules -> mutation.yml)
  # -------------------------------------------------------------------------
  - id: mutation-survival-rewards
    kind: threshold
    required: true
    document: CLAUDE.md
    anchor: 'Mutation survival: <(?P<value>\d+)% rewards'
    source: .github/workflows/mutation.yml
    extractor: 'regex:--threshold (?P<value>\d+) --label "rewards/'
    compare: numeric
    scale: identity

  - id: mutation-survival-guardrails
    kind: threshold
    required: true
    document: CLAUDE.md
    anchor: 'Mutation survival: <\d+% rewards, <(?P<value>\d+)% guardrails/audit'
    source: .github/workflows/mutation.yml
    extractor: 'regex:--threshold (?P<value>\d+) --label "guardrails"'
    compare: numeric
    scale: identity

  # -------------------------------------------------------------------------
  # Replay floors -- the two numbers with no gate at all before this feature.
  # Anchors are scoped to the Sprint-9 phrasing ("floor (gate added") so they
  # cannot match the superseded Sprint-8 line "KV-cache 0.65 floor".
  # -------------------------------------------------------------------------
  - id: kv-cache-floor
    kind: threshold
    required: true
    document: CLAUDE.md
    anchor: 'KV-cache (?P<value>[\d.]+) floor \(gate added'
    source: infrastructure/quality/replay-floors.yaml
    extractor: 'yaml_path:floors.kv_cache_hit_rate.value'
    compare: numeric
    scale: identity

  - id: tier-routing-floor
    kind: threshold
    required: true
    document: CLAUDE.md
    anchor: 'tier-routing (?P<value>\d+)% floor \(gate added'
    source: infrastructure/quality/replay-floors.yaml
    extractor: 'yaml_path:floors.tier_routing_accuracy.value'
    compare: numeric
    scale: percent_of_fraction

  # -------------------------------------------------------------------------
  # Flag pin (R7.10) -- KNOWN DRIFT, see `drift:` below.
  # -------------------------------------------------------------------------
  - id: cov-fail-under
    kind: flag
    required: true
    document: docs/state/CURRENT.md
    anchor: 'enforces `--cov-fail-under=(?P<value>\d+)`'
    source: .github/workflows/ci.yml
    extractor: 'regex:--cov-fail-under=(?P<value>\d+)'
    compare: numeric
    scale: identity

  # -------------------------------------------------------------------------
  # Blocking-gate pin (R11.8) -- activated by task 2.5 now that task 2.12 has
  # generated docs/state/GATE_SURFACE.md.
  #
  # The extractor deliberately does NOT read the `Propagates` column. That column
  # reports reachability and propagation JOINTLY by design, so these two steps
  # render `CONDITIONAL` on `tag:v*` and `NOT EXECUTED` elsewhere: the deploy job
  # is weekly / tag / dispatch only (CLAUDE.md's own deploy-cadence bullet), so no
  # trigger can ever render `yes` for them. A pin reading that column could only
  # be satisfied by weakening the generated record, which is forbidden.
  #
  # It resolves instead against the `Declared-blocking anchors` section, whose Step
  # cells are annotated with the command each step runs for exactly this purpose.
  # `verify_live.py` appears in a Step cell ONLY in that section, so requiring it
  # scopes the match without parsing section headings; requiring `declared blocking`
  # in the Note cell keeps the blocking declaration itself load-bearing. Six rows
  # match (two steps x three triggers); the two DISTINCT step names are the count
  # the CLAUDE.md line claims.
  #
  # Known tension, recorded not resolved: R11.8's literal clause asks the generated
  # record to show a governance-declared blocking gate propagating on `push:main`.
  # These steps cannot, by the deliberate weekly cadence. That gap is enforced by
  # blocking-steps.yaml + workflow_shape_truth (the steps must not become
  # warn-only) rather than by this pin.
  - id: cd-gcp-blocking-verify-steps
    kind: blocking-gate
    required: true
    document: CLAUDE.md
    anchor: 'ends with (?P<value>two) BLOCKING verify steps'
    source: docs/state/GATE_SURFACE.md
    extractor: 'regex:\| (?P<value>Verify deploy truth [^|]*verify_live\.py[^|]*) \| [^|]* \| declared blocking'
    compare: count
    scale: identity

  # -------------------------------------------------------------------------
  # ADR-055 / twin decision-relevance (decision-quality-proof task 8.2).
  #
  # Source is `digital_twin/simulation/policy.yaml`, the single committed
  # simulation-parameter file design E2c.2 names. The document side is ADR-055,
  # the Decision_Relevance_Record. Only values ADR-055 ACTUALLY STATES are
  # pinned here -- pinning a number the ADR does not state would create a pin
  # whose document side can never resolve, which is precisely the dead-extractor
  # shape C75 (`pin_extractor_truth`) exists to catch.
  #
  # The materiality margin, the utilisation ladder and the near-saturation band
  # are DELIBERATELY ABSENT: R5.2 forbids pinning them before measurement, and
  # they are listed under `deferred:` in the policy file with their owning task.
  # -------------------------------------------------------------------------

  # The shortage weight, read from newsvendor.py::cost_under rather than chosen.
  - id: regret-weight-shortage
    kind: threshold
    required: true
    document: docs/adr/ADR-055-twin-decision-relevance.md
    anchor: '\|\s+`stockout_rate`\s+\|\s+(?P<value>[\d.]+)\s+\|'
    source: digital_twin/simulation/policy.yaml
    extractor: 'yaml_path:regret_objective.weights.stockout_rate'
    compare: numeric
    scale: identity

  # The holding weight, read from newsvendor.py::cost_over rather than chosen.
  # Together with the row above this pins the 8:1 critical ratio the objective
  # inherits from the inventory agent's own reward.
  - id: regret-weight-holding
    kind: threshold
    required: true
    document: docs/adr/ADR-055-twin-decision-relevance.md
    anchor: '\|\s+`avg_on_hand_units`\s+\(normalised\)\s+\|\s+(?P<value>[\d.]+)\s+\|'
    source: digital_twin/simulation/policy.yaml
    extractor: 'yaml_path:regret_objective.weights.on_hand'
    compare: numeric
    scale: identity

  # R6.15 reads BOTH of the next two from the Decision_Relevance_Record. Without
  # them declared there, R6.15 is unsatisfiable -- which is why ADR-055 D6
  # declares them rather than leaving them to a later amendment.
  - id: negative-control-seed-sets
    kind: threshold
    required: true
    document: docs/adr/ADR-055-twin-decision-relevance.md
    anchor: 'Independent seed sets: (?P<value>\d+)'
    source: digital_twin/simulation/policy.yaml
    extractor: 'yaml_path:negative_control.independent_seed_sets'
    compare: numeric
    scale: identity

  - id: negative-control-rate-tolerance
    kind: threshold
    required: true
    document: docs/adr/ADR-055-twin-decision-relevance.md
    anchor: 'exceed `(?P<value>[\d.]+)`'
    source: digital_twin/simulation/policy.yaml
    extractor: 'yaml_path:negative_control.max_proven_gain_rate'
    compare: numeric
    scale: identity

  # ADR-055 D2.5. The materiality margin's DERIVATION RULE is pre-registered before
  # checkpoint A; only its magnitude is instantiated afterwards from the measured
  # distribution (R5.2). This pin covers the rule's one chosen input. The derived
  # margin itself is NOT pinned here yet, because
  # `regret_objective.materiality_margin.value` is still `null` and a pin against a
  # null extracts nothing while comparing green -- the `None == None` hole C75 exists
  # to close. Task 10.4 adds that pin in the same commit as the value.
  #
  # THAT PIN IS DRAFTED AND PARKED, not merely deferred: see
  # `materiality-margin-derived-value` under `pending_pins:` below. It cannot stand
  # here yet for a SECOND reason beyond the null source, found in session 2r-pre and
  # recorded in that entry's comment -- ADR-055 D2.5 does not yet state the derived
  # value as a literal, so the pin has no document line to anchor to. Read both
  # entries together; neither is complete without the other.
  - id: materiality-margin-service-points
    kind: threshold
    required: true
    document: docs/adr/ADR-055-twin-decision-relevance.md
    anchor: 'service_points = (?P<value>[\d.]+)'
    source: digital_twin/simulation/policy.yaml
    extractor: 'yaml_path:regret_objective.materiality_margin.derivation.service_points'
    compare: numeric
    scale: identity

# ---------------------------------------------------------------------------
# Pins whose resolution source does not exist yet.
#
# These are NOT evaluated by doc_truth. Listing them here keeps the AD-3 shape
# recorded without standing up a pin whose verdict would describe a decision
# nobody has taken yet. They move into `pins:` in the task named by
# `activates_after`, which is a pure data edit: task 2.5 implements all four
# kinds and all three extractor families, so no code change is needed to
# activate one.
#
# `cd-gcp-blocking-verify-steps` graduated into `pins:` above when task 2.12
# generated docs/state/GATE_SURFACE.md; its drafted `| yes |` extractor is
# recorded in that entry's comment as the shape that could not resolve.
#
# This section is a work record, NOT a suppression: nothing reads it as a pass.
# ---------------------------------------------------------------------------
pending_pins:
  # `activates_after` CORRECTED by task 12.5. It read "task 2.17", and 2.17 has
  # landed -- so the next reader would have activated a pin that FAILs. The premise
  # moved; the conclusion did not.
  #
  # 2.17 added `push: branches: [main]` to mutation.yml (R11.5), which closes the
  # merge-commit hole: a regression on a gated target now fails the merge commit's
  # run. It does NOT make the job eligible to be a required status check, because
  # eligibility is decided by the `pull_request` trigger and that is still
  # path-filtered -- a PR touching no mutation target never produces the check, so a
  # required status would wait forever. required-checks.yaml's `ineligible:` entry for
  # `mutation-fast` records exactly this and says so in its own detail.
  #
  # Activated today the pin resolves and FAILs: `yaml_path:required[].job` yields
  # `[truth-gates, quality-gates, uplift-verify]` and `compare: string` asks whether
  # `mutation-fast` is a member. It is not. That FAIL would convert a documented,
  # attributable gap into an unattributable red gate, which is the trade this whole
  # section exists to avoid.
  #
  # The alternative was rephrasing the claim this pin guards -- CLAUDE.md's "Python
  # `mutmut` is PR-gated on changed ... via `mutation-fast` job (C30)". Not taken.
  # The sentence is defensible at the level it speaks about: the job runs on pull
  # requests and its exit status propagates, so its red run is a real signal. The gap
  # is R14's boundary finding -- a red run blocks a merge only through branch
  # protection, which is not in this tree. Rewording governance prose to dissolve a
  # recorded gap is the same class of operator decision as promoting the job, and it
  # would move the anchor this pin is written against. Left recorded in two files
  # rather than argued away (I-7).
  - id: mutation-fast-required-job
    kind: required-job
    required: true
    document: CLAUDE.md
    anchor: 'via `(?P<value>mutation-fast)` job \(C30\)'
    source: infrastructure/quality/required-checks.yaml
    extractor: 'yaml_path:required[].job'
    compare: string
    scale: identity
    activates_after: >-
      an operator decision that makes `mutation-fast` eligible AND promotes it into
      `required:` -- concretely, widening `mutation.yml`'s `pull_request` trigger
      beyond its path filter (or adding a no-op reporting path for a PR touching no
      mutation target), then declaring the job in
      infrastructure/quality/required-checks.yaml. This is NOT a task in this
      feature: the declaration records the gap with its reasoning, and closing it is
      a policy change rather than an audit finding.

  # DRAFTED AND PARKED IN SESSION 2r-pre (finding 20). Task 10.4's own instruction --
  # and the note above `materiality-margin-service-points` in `pins:` -- says to add
  # this pin "in the same commit as the value". Doing that literally, today, would
  # stand up a pin that CANNOT RESOLVE, and the gate that would report it is not the
  # one a reader would expect.
  #
  # THE DEFECT. A pin is a triple: document anchor, mechanical source, extractor. The
  # source side is fine once the value lands. The DOCUMENT side has nothing to match.
  # A repo-wide grep for the derived value finds it in exactly three places, and none
  # is pinnable:
  #   * SESSION_PROTOCOL.md -- whose own rule is "There is no count in this document,
  #     and there should never be one again". Anchoring here contradicts its purpose.
  #   * HANDOFF.md -- OVERWRITTEN every session by protocol. A pin anchored there dies
  #     at the next close.
  #   * this file's sibling ratchets.json, inside the `note` prose of the
  #     `materiality-margin-service-points` entry -- a JSON note, not a document.
  # ADR-055 D2.5, which the sibling pin above anchors to, deliberately stops at "one
  # service point costs `0.08` objective units, so the margin is `service_points *
  # 0.08`". It states no derived literal.
  #
  # WHICH GATE REPORTS IT, AND WHY THAT MATTERS. `doc_truth.documented_value` requires
  # the anchor to match EXACTLY ONE LINE; zero matches raises `_Unresolvable`, whose
  # docstring is "Always becomes a `skip`, never a pass". Because this pin is
  # `required: true`, that skip is NOT absorbable: doc_truth's own module docstring
  # records the non-maskable rule (R1.4, R1.6) -- "If a required claim cannot be
  # evaluated ... the aggregate verdict is `unavailable`, and no number of `ok`
  # siblings can supply a passing verdict". So C56 would go SKIP -- not FAIL -- and a
  # SKIP is not a PASS (I-7).
  #
  # `pin_extractor_truth` (C75) would report GREEN throughout. Its docstring says it
  # runs every declared extractor against its declared source "unconditionally,
  # independent of whether the document anchor matched". It probes the source side
  # only, so 15 of 15 would resolve while C56 was silent. A reader would see C56
  # non-passing after a regeneration and conclude the regeneration had failed.
  #
  # AND IT WOULD UNDO THE REPAIR IT SITS BESIDE. C56's status is inside the PASS /
  # FAIL / SKIP counts that `ledger_gen` and `readme_gen` project, so standing this
  # pin up after task 26's regeneration commits would immediately re-stale
  # docs/state/CURRENT.md and README.md. That is why task 26's regeneration is
  # sequenced AFTER the margin lands, not before.
  #
  # THE ALTERNATIVE THAT WAS AVAILABLE AND REJECTED: `required: false`. A non-required
  # claim's skip does not force `unavailable`, so the pin could stand here today
  # without touching C56. It is not taken. This pin guards the threshold that decides
  # whether Finding 4 is falsified; a pin that cannot fail is not a pin, and
  # downgrading a claim to make it safe is exactly the assertion-weakening R2.10
  # forbids. Parking a correct pin is honest; landing a toothless one is not.
  - id: materiality-margin-derived-value
    kind: threshold
    required: true
    document: docs/adr/ADR-055-twin-decision-relevance.md
    # THE ANCHOR MUST BE DISTINCTIVE, and this is a real trap rather than a style note.
    # D2.5 already contains the rule's own code-block line,
    #   materiality_margin = service_points * 0.01 * weight(1 - fill_rate)
    # so a naive anchor of `materiality_margin = (?P<value>[\d.]+)` is safe ONLY
    # because `service_points` does not match `[\d.]+`. That is luck, not design, and
    # the exactly-one-line contract means a second matching line is as fatal as none.
    # The `derives` verb below is what makes the match unambiguous, so the amendment
    # must write the value in a sentence using it, on ONE line.
    anchor: 'derives `materiality_margin = (?P<value>[\d.]+)`'
    source: digital_twin/simulation/policy.yaml
    extractor: 'yaml_path:regret_objective.materiality_margin.value'
    compare: numeric
    scale: identity
    activates_after: >-
      task 10.4, at checkpoint A, and BOTH conditions must hold before this entry
      moves into `pins:` -- moving it while either is unmet is the defect described
      above. (a) `regret_objective.materiality_margin.value` in
      digital_twin/simulation/policy.yaml is non-null, instantiated from the committed
      rule and accepted by `policy.py::materiality_margin`, which re-derives it and
      refuses a value the rule does not produce. (b) ADR-055 D2.5 states the derived
      value as a literal on EXACTLY ONE line matching the anchor above, landed as a
      D2.5 amendment with its own amendment-log line -- and, per D2.5's own rule that
      "any future amendment ... lands before the run judged against the amended text",
      landed BEFORE the second twin-regret dispatch rather than after it. No
      additional ratchets.json entry is owed: the derived value has no independent
      degree of freedom, moving only when `service_points` moves, and that input
      already carries `direction: down`.

# ---------------------------------------------------------------------------
# Known drift at the commit that introduced this file.
#
# Recorded so the pin failures are attributable, NOT to excuse them. doc_truth
# does not read this section and does not skip these pins: they FAIL until the
# document or the configuration is corrected in the task named below.
# ---------------------------------------------------------------------------
drift:
  # RESOLVED, and retired from `drift:` per this block's own convention that it
  # "records drift that is still live" (see the cov-fail-under note below for the
  # precedent). Kept as a note because the finding is historically load-bearing:
  # it is the R7.8 config-agreement hole that ratchets.json was built to make
  # visible, and `gate-mutations.yaml` still cites the 26-vs-50 shape.
  #
  # WAS: `pin: stryker-break, document_value: 26, source_value: 50` -- CLAUDE.md
  # said `break: 26` while frontend/stryker.conf.json shipped 50 (bumped
  # 2026-05-29 after json-canonical.ts reached 96.30% kill rate), and the C16
  # ratchet constant `STRYKER_BREAK_NOW = 26` sat below the shipped value, so a
  # regression 50 -> 26 PASSED.
  #
  # The recorded remediation ("update CLAUDE.md and the ratchet constant to the
  # shipped 50") is COMPLETE and verified mechanically, not by assertion:
  #   * the `stryker-break` pin now resolves `ok` -- CLAUDE.md and
  #     frontend/stryker.conf.json both read 50;
  #   * `ratchet_truth` reports `stryker-break` with guard_symbol
  #     `STRYKER_BREAK_NOW`, guard_value 50.0, agrees_with_shipped true,
  #     outcome pass.
  #
  # Retired during decision-quality-proof task 8.3. Leaving it as a live entry
  # made `test_every_recorded_drift_entry_is_still_mechanically_real` fail
  # correctly: a record claiming a hole that has been closed is precisely the
  # stale-claim class this spec exists to eliminate, and the honest repair is to
  # retire the record rather than to relax the test (R2.10 -- fix the subject).

  # RESOLVED in task 2.8 (ledger_gen). docs/state/CURRENT.md row C15 stated
  # `--cov-fail-under=64` against a ci.yml that ships `--cov-fail-under=0` -- the
  # number described a workflow step Sprint 13 removed when the per-package floors
  # (row C28) superseded the aggregate gate (audit finding R7.10). The row now
  # states the shipped `0` and says why it is inert, so the `cov-fail-under` pin
  # resolves rather than failing. Kept as a note, not an entry: `drift:` records
  # drift that is still live.
