# Stateful infra for k3s — Kafka, Redis, Neo4j, Postgres, Ollama.
# Uses local-path-provisioner (bundled with k3s) for PVC storage.
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: kafka, namespace: synapse}
spec:
  serviceName: kafka
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports: [{containerPort: 9092}]
          env:
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: CLUSTER_ID, value: "synapse-kafka-cluster"}
          volumeMounts: [{name: data, mountPath: /var/lib/kafka/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: synapse}
spec:
  clusterIP: None
  selector: {app: kafka}
  ports: [{port: 9092, targetPort: 9092}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: neo4j, namespace: synapse}
spec:
  serviceName: neo4j
  replicas: 1
  selector: {matchLabels: {app: neo4j}}
  template:
    metadata: {labels: {app: neo4j}}
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports: [{containerPort: 7687}, {containerPort: 7474}]
          env:
            - {name: NEO4J_AUTH, valueFrom: {secretKeyRef: {name: synapse-neo4j, key: auth}}}
            - {name: NEO4J_server_memory_heap_max__size, value: "2G"}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: neo4j, namespace: synapse}
spec:
  selector: {app: neo4j}
  ports: [{port: 7687, name: bolt}, {port: 7474, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: synapse}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: synapse}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
