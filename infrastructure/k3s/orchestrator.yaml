apiVersion: apps/v1
kind: Deployment
metadata: {name: orchestrator, namespace: synapse}
spec:
  replicas: 2
  selector: {matchLabels: {app: orchestrator}}
  template:
    metadata: {labels: {app: orchestrator}}
    spec:
      containers:
        - name: orchestrator
          image: ghcr.io/synapse/orchestrator:latest
          ports: [{containerPort: 8085, name: http}]
          env:
            - {name: OLLAMA_URL, value: http://ollama.synapse.svc.cluster.local:11434}
            - {name: POSTGRES_DSN, valueFrom: {secretKeyRef: {name: synapse-postgres, key: dsn}}}
            - {name: SYNAPSE_OTEL_ENDPOINT, value: "http://otel-collector.synapse.svc.cluster.local:4318/v1/traces"}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "4", memory: 8Gi}
          livenessProbe:
            httpGet: {path: /health, port: 8085}
            initialDelaySeconds: 45
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /ready, port: 8085}
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: orchestrator, namespace: synapse}
spec:
  selector: {app: orchestrator}
  ports: [{port: 8085, targetPort: 8085, name: http}]
