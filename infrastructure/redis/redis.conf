# ============================================================================
# SYNAPSE Redis 7 Configuration
# Purpose: Feature caching (Feast online store), session state, fallback queue (I-7)
# ============================================================================

# ── Network ──
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60

# ── Memory ──
maxmemory 512mb
maxmemory-policy allkeys-lru

# ── Persistence (AOF for durability) ──
appendonly yes
appendfsync everysec
appendfilename "synapse.aof"

# ── Snapshotting ──
save 900 1
save 300 10
save 60 10000

# ── Streams (Kafka fallback per I-7) ──
stream-node-max-bytes 4096
stream-node-max-entries 100

# ── Performance ──
hz 10
dynamic-hz yes
aof-use-rdb-preamble yes

# ── Logging ──
loglevel notice
logfile ""

# ── Security (dev environment) ──
# In production: requirepass, rename-command CONFIG ""
protected-mode no
