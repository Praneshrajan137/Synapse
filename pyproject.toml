[project]
name = "synapse"
version = "0.1.0"
description = "Supply Yield Network with Autonomous Planning, Sensing & Execution"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "A", "SIM", "TCH"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "deal.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pymoo.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pinecone.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "confluent_kafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langsmith.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["packages/tests", "agents", "orchestrator", "tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "contract: consumer-driven contract tests (Layer 3)",
    "metamorphic: metamorphic ML behavioral invariant tests (Layer 4)",
    "integration: cross-agent integration tests",
    "fuzz: Schemathesis API fuzz tests (Layer 2)",
    "chaos: chaos engineering tests",
    "oracle: digital twin oracle tests",
    "mutation: mutation testing targets",
]
asyncio_mode = "strict"
addopts = "--strict-markers -v --tb=short"

[tool.coverage.run]
source = ["packages/synapse_common", "agents", "orchestrator"]
omit = ["*/tests/*", "*/training/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
