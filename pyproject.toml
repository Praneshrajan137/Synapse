[project]
name = "synapse"
version = "0.1.0"
description = "Supply Yield Network with Autonomous Planning, Sensing & Execution"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "A", "SIM", "TCH"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

# Math-heavy modules follow mathematical naming conventions (capital letters
# for matrices, R for radius). N806/N803 relaxed here so code reads like
# the equations it implements.
[tool.ruff.lint.per-file-ignores]
"agents/inventory_sentinel/models/l2_bandit.py" = ["N806"]
"agents/routing_navigator/models/cvrptw.py" = ["N806", "N803"]
"agents/routing_navigator/inference/pipeline.py" = ["N806"]
"agents/supplier_trust/inference/pipeline.py" = ["E501"]
# JSON-Schema registry uses ValidationError at runtime (formatter arg);
# SchemaViolation is intentionally named to express "contract violation".
"packages/synapse_common/schema_registry.py" = ["TC002", "N818"]
# InvariantViolation mirrors SchemaViolation — intentionally named for the
# spec-postcondition contract concept, not a generic *Error (ADR-040).
"packages/synapse_common/invariants.py" = ["N818"]
# TrainingContractViolation mirrors InvariantViolation — the training-truth
# contract concept (ADR-042), deliberately a *Violation not a generic *Error.
"packages/synapse_common/training_contract.py" = ["N818"]
# Spec-assertion + reward-safety test bodies use UPPER_CASE for the spec
# constants under test (THRESHOLD, BUDGET_MS, FORBIDDEN_KEYS) so the test reads
# like the invariant it checks; nested `if`s mirror the spec's guard structure;
# one explanatory comment exceeds the line limit. Test-readability conventions,
# not production code.
"agents/*/tests/test_spec_assertions.py" = ["N806", "SIM102"]
"agents/*/tests/test_reward_safety.py" = ["E501"]
"agents/*/tests/test_spec.py" = ["N806", "SIM102"]
# Role and BreakerState are intentionally `(str, Enum)` (not StrEnum) — the
# `Role.X` repr is relied on in auth/breaker logging + serialisation; switching
# the base would change `str()` output. UP042 is a style preference here.
"packages/synapse_common/auth/jwt_manager.py" = ["UP042"]
"packages/synapse_common/breakers.py" = ["UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# synapse_common lives in packages/; add it to the search path so mypy resolves
# `import synapse_common.*` from orchestrator/, agents/ and digital_twin/ without
# spurious import-not-found cascades.
mypy_path = "packages"

[[tool.mypy.overrides]]
module = "deal.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# python-jose ships no type stubs and there is no types-python-jose on PyPI.
module = "jose.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
