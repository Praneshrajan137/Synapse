# ============================================================================
# SYNAPSE Chromatic System — Formal Specification (SDD layer)
#
# Spec-first: this file is the single source of truth for the color system.
# Every INV-CLR invariant below has a matching test in tests/ — enforced by
# scripts/check-spec-coverage.mjs. See ADR-025.
#
# NOTE: filename is `.spec.yml` (not `spec.yaml`) so the repo's agent
# `spec-validate` pre-commit hook does NOT validate it against the agent
# schema. The `color-spec-validate` hook validates it against
# schema/color-spec.schema.json instead.
# ============================================================================
system_name: synapse-color
version: "2.0.0"
description: >
  Perceptual OKLCH design-token color system for the SYNAPSE multi-agent
  quick-commerce platform. Encodes agent identity, decision tier, and
  confidence as orthogonal perceptual dimensions; dual-theme; governed by
  contrast and color-vision-deficiency invariants. v1.1.0 (ADR-044, additive
  — frozen agent hues untouched) adds the honesty states (degraded,
  synthetic), the agent process-state chroma-rationing grammar, and the
  urgency/arrival motion vocabulary. v2.0.0 (ADR-048) is the cobalt reversal:
  the foundation moves from warm graphite to a cool blue-graphite (H250), the
  brand/focus/tier signature moves from warm brass (H65) to royal cobalt
  (H250), the pricing_oracle agent identity is re-hued off amber-gold to
  deep blue-violet (H80 -> H270, under the INV-CLR-012 version-bump clause),
  and warning + the confidence caution band move off gold to orange (H50/H55)
  so the cool cobalt chrome owns the blue band while warm caution stays the
  complementary pop.

principles:
  - id: PR-CLR-001
    statement: >
      Orthogonal Encoding — nominal data (agent identity) maps to OKLCH Hue;
      ordinal data (decision tier) maps to OKLCH Lightness; continuous data
      (confidence) maps to a diverging scale interpolated in OKLab. Each data
      type uses the perceptual dimension that natively fits it.
  - id: PR-CLR-002
    statement: >
      Every hue is earned — a color exists only as the encoding of one domain
      concept. No decorative or arbitrary color. Enforced by INV-CLR-009.
  - id: PR-CLR-003
    statement: >
      Color is an enhancement, never the sole carrier of meaning. Every
      color-coded state is mirrored by text, icon, or shape (INV-CLR-011).
  - id: PR-CLR-004
    statement: >
      Author in OKLCH, deliver gamut-mapped. Authored chroma may exceed sRGB;
      the build maps every emitted value into gamut (INV-CLR-008).

thresholds:
  wcag_text_normal: 4.5
  wcag_text_large: 3.0
  wcag_ui_component: 3.0
  apca_primary_lc: 75.0
  apca_secondary_lc: 60.0
  apca_tertiary_lc: 45.0
  agent_pair_min_hue_deg: 20.0
  agent_pair_min_deltaeok: 0.090
  agent_pair_min_deltaeok_cvd: 0.020
  semantic_min_deltaeok: 0.080
  semantic_min_deltaeok_cvd: 0.020
  confidence_gate_low: 0.70
  confidence_gate_high: 0.80
  # v1.1.0 (ADR-044) — honesty states + interaction recipes.
  # degraded_max_chroma: the degraded state is DRAINED — running on reduced
  # information must read as visibly less saturated than every full state.
  degraded_max_chroma: 0.08
  degraded_min_chroma_gap: 0.05
  # Interaction tints are color-mix() recipes in component CSS (the vars hold
  # full oklch() colours, not channels — see build.mjs banner). The recipe
  # constants are specified HERE so the contrast invariant (INV-CLR-018) can
  # pin them; the FE must use these exact mix percentages.
  interaction_hover_alpha_light: 0.06
  interaction_hover_alpha_dark: 0.08
  interaction_selected_alpha_light: 0.14
  interaction_selected_alpha_dark: 0.18
  interaction_disabled_alpha: 0.38
  # v1.2.0 (ADR-045) — Obsidian depth recipes. Elevation is surface-step +
  # top-edge highlight + ambient shadow; borders are reserved for interactive
  # and alert states (dark theme; light keeps hairlines; hc keeps strong
  # borders). The glow is a NEUTRAL brand-tinted constant — ADR-044 rejected
  # posture-driven ambience; degradation is a marker, never a mood.
  surface_highlight_alpha_dark: 0.04
  ambient_glow_alpha: 0.04

invariants:
  - id: "INV-CLR-001"
    description: "Every semantic token resolves to a concrete value in both light and dark themes"
    assertion: "for all t in semantic_tokens: t.resolved('light') is not None and t.resolved('dark') is not None"
    severity: critical

  - id: "INV-CLR-002"
    description: "Every text-on-surface pair meets WCAG 2.1 AA contrast in both themes"
    assertion: "wcag(text, surface) >= 4.5 for body text and >= 3.0 for large text, both themes"
    severity: critical

  - id: "INV-CLR-003"
    description: "Every text-on-surface pair meets its APCA Lc target for its emphasis tier, both themes"
    assertion: "abs(apca(text,surface)) >= apca_primary_lc for primary, >= apca_secondary_lc for secondary, >= apca_tertiary_lc for tertiary"
    severity: high

  - id: "INV-CLR-004"
    description: "All 28 agent-identity color pairs are perceptually distinct under normal vision"
    assertion: "for all pairs (a,b): hue_distance(a,b) >= agent_pair_min_hue_deg and deltaEOK(a,b) >= agent_pair_min_deltaeok, both themes"
    severity: critical

  - id: "INV-CLR-005"
    description: "The 8 agent colors remain mutually distinguishable under deuteranopia, protanopia, and tritanopia simulation"
    assertion: "for each cvd in {deuter,protan,trit}: min pairwise deltaEOK(cvd(a),cvd(b)) >= agent_pair_min_deltaeok_cvd"
    severity: critical

  - id: "INV-CLR-006"
    description: "Decision-tier colors are strictly monotonic in OKLCH lightness, encoding tier order (I-8)"
    assertion: "L(tier1) > L(tier2) > L(tier3) > L(tier4)"
    severity: critical

  - id: "INV-CLR-007"
    description: "Confidence color map is continuous and traverses red->amber->green->teal; stops anchored exactly at the I-5 gates"
    assertion: "confidence stops at positions {0.00,0.70,0.80,1.00}; hue strictly increasing across stops; confidenceColor continuous on [0,1]"
    severity: critical

  - id: "INV-CLR-008"
    description: "Every emitted color value is within sRGB gamut"
    assertion: "for all emitted tokens: inGamut('rgb', token.value) is True"
    severity: high

  - id: "INV-CLR-009"
    description: "No raw hex/rgb/hsl color literal appears in frontend component source — color only via tokens"
    assertion: "grep for #rrggbb / rgb( / hsl( in frontend/src/**/*.{jsx,js} returns nothing outside generated files"
    severity: critical

  - id: "INV-CLR-010"
    description: "The token build is deterministic — rebuilding yields byte-identical dist artifacts"
    assertion: "sha256(build()) == sha256(build()) for tokens.css, tokens.ts, tailwind-preset.cjs, tokens.json"
    severity: high

  - id: "INV-CLR-011"
    description: "Color is never the sole information channel — every color-coded state also carries text, icon, or shape"
    assertion: "every status/tier/confidence/agent affordance in frontend exposes a non-color signal"
    severity: high

  - id: "INV-CLR-012"
    description: "The agent-to-hue assignment is frozen; changing it requires a version bump and a supersede note"
    assertion: "agent hue map matches the frozen registry; the 8 agent keys are exactly the SYNAPSE agent set"
    severity: high

  - id: "INV-CLR-013"
    description: "prefers-reduced-motion, prefers-contrast, and forced-colors each have a defined fallback in tokens.css"
    assertion: "tokens.css contains @media blocks for prefers-reduced-motion, prefers-contrast, and forced-colors"
    severity: high

  - id: "INV-CLR-014"
    description: "The 5 semantic state colors are mutually distinguishable in both themes and under CVD simulation. (Agent/semantic hue families intentionally overlap — risk is red, value is gold — and are kept apart by disjoint UI roles, not hue distance; see ADR-025.)"
    assertion: "for all semantic pairs (s1,s2): deltaEOK >= semantic_min_deltaeok normal and >= semantic_min_deltaeok_cvd under each CVD"
    severity: high

  - id: "INV-CLR-015"
    description: "v1.1.0: the distinctness matrix extends to all 7 semantic states (5 + degraded + synthetic) — mutually distinguishable in both themes and under CVD simulation"
    assertion: "for all pairs over {success,warning,danger,info,neutral,degraded,synthetic}: deltaEOK >= semantic_min_deltaeok normal and >= semantic_min_deltaeok_cvd under each CVD, both themes"
    severity: high

  - id: "INV-CLR-016"
    description: "The degraded state is chroma-drained: running on reduced information must read as visibly less saturated than every full-saturation state (the VSUP philosophy as a state token)"
    assertion: "C(degraded) <= degraded_max_chroma in both themes AND C(degraded) <= min(C(success),C(warning),C(danger),C(info)) - degraded_min_chroma_gap"
    severity: high

  - id: "INV-CLR-017"
    description: "Agent process-state chroma factors are strictly monotone with cognitive activity and never zero — identity must remain legible even when interrupted"
    assertion: "0 < interrupted < waiting < thinking < debating < acting == 1.0; escalated == 1.0 (escalated composes with the danger ring, not a colour change)"
    severity: high

  - id: "INV-CLR-018"
    description: "Text over interaction-tinted surfaces still passes the contrast invariants — hover and selected tints (the color-mix recipes pinned in thresholds) never push body text below WCAG AA / APCA primary; disabled (interaction_disabled_alpha) is the one documented exemption"
    assertion: "for each theme: wcag(text.primary, mix(text.primary,a_hover,surface)) >= wcag_text_normal and abs(apca) >= apca_primary_lc; same for mix(brand.base,a_selected,surface)"
    severity: high

  - id: "INV-CLR-019"
    description: "atlas-console-elevation Property 20: every semantic colour token resolves to a concrete, non-empty value in EVERY Theme_Mode (light, dark, hc). hc is the [data-theme=\"hc\"] override layered over the :root/dark defaults in frontend/src/styles/tokens.css; a token not overridden by hc inherits the base value. An unresolved/empty/`initial` token fails the check naming the specific token and Theme_Mode, never substituting a raw colour literal (Req 5.2, 5.3)."
    assertion: "for all semantic colour tokens t, for all mode in {light,dark,hc}: resolve(t, mode) is a concrete non-empty value (override-or-base cascade), never empty/initial; a miss fails naming (token, mode)"
    severity: critical

  - id: "INV-CLR-020"
    description: "atlas-console-elevation Property 21: decision-tier lightness is strictly monotone (L(tier1) > L(tier2) > L(tier3) > L(tier4)) and the confidence diverging scale has non-decreasing OKLCH hue as confidence increases, in every theme — the ordinal (Lightness) and continuous (diverging) encodings never invert (Req 5.4)."
    assertion: "for all themes: L(tier1) > L(tier2) > L(tier3) > L(tier4); and for all v1 <= v2 in [0,1]: hue(confidenceColor(v2)) >= hue(confidenceColor(v1))"
    severity: critical

  - id: "INV-CLR-021"
    description: "atlas-console-elevation Property 22: WCAG 2.1 AA contrast holds for every text/component-on-surface pair in every theme (>= 4.5:1 body text, >= 3.0:1 large text and UI components) (Req 5.6)."
    assertion: "for all contrast pairs (text,surface), for all themes: wcag(text, surface) >= wcag_text_normal (and >= wcag_ui_component)"
    severity: critical

  - id: "INV-CLR-022"
    description: "atlas-console-elevation Property 23: absolute APCA Lc meets its emphasis-tier target (primary >= 75, secondary >= 60, tertiary >= 45) for every text-on-surface pair in every theme (Req 5.7)."
    assertion: "for all contrast pairs (text,surface,tier), for all themes: abs(apca(text,surface)) >= apca_{tier}_lc"
    severity: high

  - id: "INV-CLR-023"
    description: "atlas-console-elevation Property 24: all 28 unordered agent-colour pairs differ by at least the minimum pairwise deltaEOK under deuteranopia, protanopia, and tritanopia simulation in every theme (Req 5.8)."
    assertion: "for all agent pairs (a,b), for all themes, for all cvd in {deuter,protan,trit}: deltaEOK(cvd(a),cvd(b)) >= agent_pair_min_deltaeok_cvd"
    severity: critical

  - id: "INV-CLR-024"
    description: "atlas-console-elevation Property 25: the degraded state chroma is at/below degraded_max_chroma AND at least degraded_min_chroma_gap below the chroma of every full-saturation semantic state, in every theme (Req 5.9)."
    assertion: "for all themes, for all full states s in {success,warning,danger,info}: C(degraded) <= degraded_max_chroma and C(degraded) <= C(s) - degraded_min_chroma_gap"
    severity: high

  - id: "INV-CLR-025"
    description: "atlas-console-elevation Property 26: colour is never the sole channel — every confidence value maps to a textual zone label and every agent affordance carries a stable textual key plus a token reference, so colour-coded affordances always retain a non-colour (text/icon/shape) signal (Req 5.10)."
    assertion: "for all v in [0,1]: confidenceZone(v) in {low,escalation,autonomous}; and for all agents a: a is a non-empty text key and agentVar(a) is a var(--color-agent-*) token reference"
    severity: high
  - id: "PRE-CLR-001"
    description: "All token JSON files validate against the DTCG token schema"
    check: "jsonschema.validate(token_file, dtcg_tokens_schema) passes for every file in tokens/"
  - id: "PRE-CLR-002"
    description: "Every {reference} in the token graph resolves to a defined token"
    check: "no dangling references after resolution"

postconditions:
  - id: "POST-CLR-001"
    description: "Every color in dist/tokens.json is sRGB in-gamut and has a valid hex fallback"
    check: "inGamut('rgb', value) and /^#[0-9a-f]{6}$/.test(hexFallback)"
  - id: "POST-CLR-002"
    description: "dist artifacts are committed and match a fresh build"
    check: "git diff --exit-code design-system/color/dist/ is empty after build"

metamorphic_relations:
  - id: "MR-CLR-001"
    description: "Theme inversion preserves legibility"
    transform: "switch every surface/text pair from light theme to dark theme"
    expected: "WCAG and APCA contrast invariants (INV-CLR-002/003) hold in both themes"
  - id: "MR-CLR-002"
    description: "Color-vision-deficiency simulation preserves agent distinctness"
    transform: "apply deuteranopia / protanopia / tritanopia simulation to the agent palette"
    expected: "agent colors remain mutually distinguishable (INV-CLR-005)"
  - id: "MR-CLR-003"
    description: "Increasing confidence advances along the red->teal axis"
    transform: "increase a confidence value in [0,1]"
    expected: "the mapped color's OKLCH hue coordinate is non-decreasing"
  - id: "MR-CLR-004"
    description: "Degradation (chroma rationing) preserves identity"
    transform: "apply any factor.agentstate scalar f < 1 to an agent identity color: (L, C, H) -> (L, C*f, H)"
    expected: "chroma strictly decreases, lightness is unchanged, hue is unchanged (|dH| < 2 deg) — state never masquerades as a different agent"

palettes:
  surface:
    description: "Elevation ramp — hue-tinted neutrals, canvas to overlay"
    encoding: neutral
    members: [canvas, panel, raised, overlay, border-subtle, border-strong]
  agent:
    description: "8 agent identities — categorical, encoded on the Hue axis"
    encoding: hue
    members:
      - demand_prophet
      - routing_navigator
      - inventory_sentinel
      - freshness_guardian
      - pricing_oracle
      - disruption_shield
      - supplier_trust
      - sustainability_agent
  tier:
    description: "4 decision tiers — ordinal, encoded on the Lightness axis (I-8)"
    encoding: lightness
    members: [tier-1, tier-2, tier-3, tier-4]
  confidence:
    description: "Confidence — continuous diverging scale, gated at 0.70/0.80 (I-5)"
    encoding: diverging
    members: [low, escalation-band, autonomous]
  semantic:
    description: "State feedback — success, warning, danger, info, neutral, plus the v1.1.0 honesty states degraded (fallback-path output, chroma-drained) and synthetic (traffic-generator decisions)"
    encoding: categorical
    members: [success, warning, danger, info, neutral, degraded, synthetic]
  processstate:
    description: "Agent process states — chroma-rationing factors over the frozen identity hue (interrupted/waiting/thinking/debating/acting/escalated); not colours of their own"
    encoding: chroma-factor
    members: [interrupted, waiting, thinking, debating, acting, escalated]

testing_layers:
  - layer: "1-SDD"
    applies: "Every INV-CLR has a test; check-spec-coverage.mjs blocks gaps"
  - layer: "2-Fuzz"
    applies: "Random OKLCH inputs and random confidence in [0,1] never crash the resolver and always yield in-gamut output"
  - layer: "3-Contract"
    applies: "Token JSON validates against dtcg-tokens.schema.json; tokens.ts exposes a typed API"
  - layer: "4-Metamorphic"
    applies: "Theme inversion and CVD simulation as metamorphic transforms (MR-CLR-001/002/003)"
  - layer: "5-DbC"
    applies: "Pre/postconditions on resolveToken, interpolateConfidence, gamutMap"
  - layer: "6-Oracle"
    applies: "Independently-computed reference WCAG/APCA values as the oracle for contrast.mjs"
  - layer: "7-Mutation"
    applies: "Mutating token values (swap two agent hues, shift a tier lightness) must fail the suite"
