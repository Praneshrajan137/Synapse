# ============================================================================
# SYNAPSE — Docker Compose for Google Cloud (amd64, e2-standard-8)
# 8 vCPU / 32 GB RAM / 100 GB pd-ssd (data disk mounted at /mnt/synapse-data)
# All images are amd64 / multi-arch — no `platform:` overrides needed.
# ============================================================================

x-common-env: &common-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REDIS_URL: redis://redis:6379/0
  NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-synapse_graph_2026}
  FEAST_REPO_PATH: /app/data_fabric/feast
  MLFLOW_TRACKING_URI: http://mlflow:5000
  PINECONE_API_KEY: ${PINECONE_API_KEY:-}
  PINECONE_INDEX_NAME: synapse-playbooks
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGSMITH_PROJECT: synapse-production
  OLLAMA_BASE_URL: http://host.docker.internal:11434
  PYTHONPATH: /app

x-extra-hosts: &extra-hosts
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # ── Infrastructure ────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: synapse-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: synapse-kafka-cluster-001
    ports: ["9092:9092"]
    volumes: ["kafka_data:/tmp/kraft-combined-logs"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 | grep ApiVersion || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 4G }

  redis:
    image: redis:7-alpine
    container_name: synapse-redis
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 1G }

  neo4j:
    image: neo4j:5-community
    container_name: synapse-neo4j
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-synapse_graph_2026}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_apoc_export_file_enabled=true
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ../infrastructure/neo4j:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 2G }

  postgres:
    image: postgres:16-alpine
    container_name: synapse-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synapse_audit}
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapse_audit_2026}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Sequenced 01-06 so docker-entrypoint-initdb.d applies them in order.
      # Sprint 7 outbox + Sprint 9 audit chain MUST run last (extend earlier tables).
      # Source of truth: orchestrator/audit/migrations/ (mirrored here per E-S9-14).
      - ../infrastructure/postgres/init_audit.sql:/docker-entrypoint-initdb.d/01_init_audit.sql:ro
      - ../infrastructure/postgres/02_sprint4_consensus.sql:/docker-entrypoint-initdb.d/02_sprint4_consensus.sql:ro
      - ../infrastructure/postgres/03_p1_override.sql:/docker-entrypoint-initdb.d/03_p1_override.sql:ro
      - ../infrastructure/postgres/04_p3_city.sql:/docker-entrypoint-initdb.d/04_p3_city.sql:ro
      - ../infrastructure/postgres/03_sprint7_outbox.sql:/docker-entrypoint-initdb.d/05_sprint7_outbox.sql:ro
      - ../infrastructure/postgres/04_sprint9_audit_chain.sql:/docker-entrypoint-initdb.d/06_sprint9_audit_chain.sql:ro
      # Phase A (WS-A): steering table (was silently dropped from the mounts —
      # left /api/v1/steering broken) + city column on audit_consensus (lets the
      # decisions feed read the real write-target table). Both fully idempotent.
      # The "Apply forward DB migrations" CD step also runs these against the
      # already-initialised live volume (initdb.d only fires on an empty datadir).
      - ../infrastructure/postgres/06_ws5_steering.sql:/docker-entrypoint-initdb.d/07_ws5_steering.sql:ro
      - ../infrastructure/postgres/07_wsA_consensus_city.sql:/docker-entrypoint-initdb.d/08_wsA_consensus_city.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse} -d ${POSTGRES_DB:-synapse_audit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 1G }

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: synapse-mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: ["mlflow_data:/mlflow"]
    # Deploy Truth (Sprint 14): every service must carry a healthcheck so the
    # post-deploy "all containers healthy" assertion is total, not partial.
    # The mlflow image is python-slim (no curl/wget) — probe via stdlib.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 1G }

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: synapse-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=14d"
      - "--web.enable-lifecycle"
    ports: ["9090:9090"]
    volumes:
      - ../infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../infrastructure/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 1G }

  grafana:
    image: grafana/grafana:11.1.0
    container_name: synapse-grafana
    depends_on:
      prometheus: { condition: service_started }
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-synapse_grafana_2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    ports: ["3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ../infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # ── Agents (Sprint 2) ────────────────────────────────────────────────────
  # NOTE (ADR-039): all SYNAPSE services pull pre-built, cosign-signed images
  # from Artifact Registry. The CD workflow (.github/workflows/cd-gcp.yml)
  # builds + signs + pushes on every merge to main and on `v*` tag pushes.
  # NEVER reintroduce a `build:` directive here — `scripts/audit/verify_claims.py`
  # check C26 will fail CI if anyone does.
  demand-prophet:
    image: ${SYNAPSE_AR_REPO_URL}/demand-prophet:${SYNAPSE_VERSION:-latest}
    pull_policy: always
    container_name: synapse-demand-prophet
    environment: *common-env
    <<: *extra-hosts
    ports: ["8081:8001"]
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1.5G }

  routing-navigator:
    image: ${SYNAPSE_AR_REPO_URL}/routing-navigator:${SYNAPSE_VERSION:-latest}
    pull_policy: always
    container_name: synapse-routing-navigator
    environment: *common-env
    <<: *extra-hosts
    # serve.py has no __main__ block; run uvicorn directly so the HTTP server actually starts
    command: ["python", "-m", "uvicorn", "agents.routing_navigator.inference.serve:app", "--host", "0.0.0.0", "--port", "8002"]
    ports: ["8082:8002"]
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1.5G }

  inventory-sentinel:
    image: ${SYNAPSE_AR_REPO_URL}/inventory-sentinel:${SYNAPSE_VERSION:-latest}
    pull_policy: always
    container_name: synapse-inventory-sentinel
    environment: *common-env
    <<: *extra-hosts
    # serve.py has no __main__ block; run uvicorn directly so the HTTP server actually starts
    command: ["python", "-m", "uvicorn", "agents.inventory_sentinel.inference.serve:app", "--host", "0.0.0.0", "--port", "8003"]
    ports: ["8083:8003"]
    depends_on:
      kafka: { condition: service_healthy }
      demand-prophet: { condition: service_started }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1.5G }

  # ── Agents (Sprint 3) ────────────────────────────────────────────────────
  freshness-guardian:
    image: ${SYNAPSE_AR_REPO_URL}/freshness-guardian:${SYNAPSE_VERSION:-latest}
    pull_policy: always
    container_name: synapse-freshness-guardian
    environment: *common-env
    <<: *extra-hosts
    ports: ["8084:8004"]
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 1G }

  pricing-oracle:
    image: ${SYNAPSE_AR_REPO_URL}/pricing-oracle:${SYNAPSE_VERSION:-latest}
    pull_policy: always
    container_name: synapse-pricing-oracle
    environment: *common-env
    <<: *extra-hosts
    ports: ["8085:8005"]
    depends_on:
      kafka: { condition: service_healthy }
      demand-prophet: { condition: service_started }
      freshness-guardian: { condition: service_started }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1.5G }

  disruption-shield:
    image: ${SYNAPSE_AR_REPO_URL}/disruption-shield:${SYNAPSE_VERSION:-latest}
    pull_policy: always
    container_name: synapse-disruption-shield
    environment: *common-env
    <<: *extra-hosts
    ports: ["8086:8006"]
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1.5G }

  supplier-trust:
    image: ${SYNAPSE_AR_REPO_URL}/supplier-trust:${SYNAPSE_VERSION:-latest}
    pull_policy: always
    container_name: synapse-supplier-trust
    environment: *common-env
    <<: *extra-hosts
    ports: ["8087:8007"]
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 1G }

  sustainability-agent:
    image: ${SYNAPSE_AR_REPO_URL}/sustainability-agent:${SYNAPSE_VERSION:-latest}
    pull_policy: always
    container_name: synapse-sustainability-agent
    environment: *common-env
    <<: *extra-hosts
    ports: ["8088:8008"]
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 768M }

  # ── Digital Twin ─────────────────────────────────────────────────────────
  digital-twin:
    image: ${SYNAPSE_AR_REPO_URL}/digital-twin:${SYNAPSE_VERSION:-latest}
    pull_policy: always
    container_name: synapse-digital-twin
    environment:
      <<: *common-env
      # Override common-env PYTHONPATH so synapse_common at /app/packages is importable
      # (digital_twin Dockerfile copies packages there but doesn't pip-install them like agents do)
      PYTHONPATH: /app:/app/packages
    <<: *extra-hosts
    ports: ["8089:8009"]
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 2G }

  # ── Orchestrator ─────────────────────────────────────────────────────────
  orchestrator:
    image: ${SYNAPSE_AR_REPO_URL}/orchestrator:${SYNAPSE_VERSION:-latest}
    pull_policy: always
    container_name: synapse-orchestrator
    environment:
      <<: *common-env
      SYNAPSE_ORCHESTRATOR_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SYNAPSE_ORCHESTRATOR_REDIS_URL: redis://redis:6379
      SYNAPSE_ORCHESTRATOR_NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      SYNAPSE_ORCHESTRATOR_OLLAMA_BASE_URL: http://host.docker.internal:11434
      SYNAPSE_ORCHESTRATOR_POSTGRESQL_URL: postgresql+asyncpg://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD:-synapse_audit_2026}@postgres:5432/${POSTGRES_DB:-synapse_audit}
      SYNAPSE_ORCHESTRATOR_PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      SYNAPSE_ORCHESTRATOR_CONFIDENCE_THRESHOLD: "0.7"
      # Sprint 9 operational gates (defaults match orchestrator/eval/thresholds)
      SYNAPSE_AUDIT_CHAIN_ENABLED: "true"
      SYNAPSE_KV_CACHE_FLOOR: "0.70"
      SYNAPSE_TIER_ROUTING_FLOOR: "0.80"
    <<: *extra-hosts
    ports: ["8090:8085"]
    depends_on:
      kafka:    { condition: service_healthy }
      redis:    { condition: service_healthy }
      neo4j:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1.5G }

  # ── API Gateway (public-facing auth, /api/v1/*, /ws/* — sits in front of orchestrator) ─
  # NB: the image name in Artifact Registry is `api-gateway` (matches the
  # `cd-gcp.yml` build matrix); the local service name stays `api` so the
  # rest of the compose graph (depends_on, healthcheck URLs) is undisturbed.
  api:
    image: ${SYNAPSE_AR_REPO_URL}/api-gateway:${SYNAPSE_VERSION:-latest}
    pull_policy: always
    container_name: synapse-api
    environment:
      <<: *common-env
      # Override common-env PYTHONPATH so synapse_common at /app/packages is importable
      PYTHONPATH: /app:/app/packages
      SYNAPSE_ORCHESTRATOR_URL: http://orchestrator:8085
      SYNAPSE_KAFKA_BOOTSTRAP: kafka:9092
      SYNAPSE_PROMETHEUS_URL: http://prometheus:9090
      SYNAPSE_NEO4J_URI: bolt://neo4j:7687
      SYNAPSE_NEO4J_USER: ${NEO4J_USER:-neo4j}
      SYNAPSE_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-synapse_graph_2026}
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD:-synapse_audit_2026}@postgres:5432/${POSTGRES_DB:-synapse_audit}
      SYNAPSE_COOKIE_SECURE: "true"
    <<: *extra-hosts
    ports: ["8000:8000"]
    depends_on:
      orchestrator: { condition: service_healthy }
      kafka:        { condition: service_healthy }
      neo4j:        { condition: service_healthy }
      postgres:     { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  # ── Frontend ─────────────────────────────────────────────────────────────
  # The `VITE_BUILD_SHA` build-arg is set by cd-gcp.yml at IMAGE BUILD TIME (in
  # CI), not at compose-up time. Runtime users see it in the footer chip and
  # via `GET /version` on the API gateway. See ADR-039.
  frontend:
    image: ${SYNAPSE_AR_REPO_URL}/frontend:${SYNAPSE_VERSION:-latest}
    pull_policy: always
    container_name: synapse-frontend
    depends_on:
      - orchestrator
    ports: ["3001:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # ── nginx (HTTP/HTTPS edge — terminates TLS via Let's Encrypt bind mount) ─
  # /etc/letsencrypt on the host (populated by certbot in setup_gcp_vm.sh) is
  # mounted read-only inside the container. nginx.conf reads cert from
  # /etc/letsencrypt/live/$DOMAIN_NAME/.
  nginx:
    image: nginx:1.25-alpine
    container_name: synapse-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../infrastructure/nginx/nginx.gcp.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      orchestrator: { condition: service_healthy }
      frontend:     { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

volumes:
  kafka_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  mlflow_data:
  prometheus_data:
  grafana_data:

# ============================================================================
# RESOURCE BUDGET (e2-standard-8: 8 vCPU / 32 GB RAM + 16 GB swap)
# ============================================================================
# Infrastructure: Kafka(4G) + Redis(1G) + Neo4j(2G) + Postgres(1G)
#                 + MLflow(1G) + Prometheus(1G) + Grafana(512M)  = ~10.5 GB
# Sprint 2 Agents: DP(1.5G) + RN(1.5G) + IS(1.5G)                = ~4.5 GB
# Sprint 3 Agents: FG(1G) + PO(1.5G) + DS(1.5G) + ST(1G) + SA(768M) = ~6 GB
# Digital Twin: 2 GB
# Orchestrator: 1.5 GB
# Frontend + nginx: 768 MB
# Ollama (host, deepseek-r1:7b): ~4-5 GB
# OS + overhead: ~2 GB
# TOTAL: ~31 GB → fits the 32 GB VM with the 16 GB swap as overflow buffer.
# ============================================================================
