# docker/docker-compose.mumbai.yml
# Mumbai overlay — extends base docker-compose.yml
# Usage: docker compose -f docker/docker-compose.yml -f docker/docker-compose.mumbai.yml up -d
#
# INVARIANT I-1: All images are open-source or free-tier, $0 cost.
# INVARIANT I-11: Each Mumbai agent container is isolated.
# ERROR PATTERN E-S6-10: NEVER use this file without base docker-compose.yml.

services:
  osrm-mumbai:
    # OSRM_IMAGE defaults to the Docker Hub amd64 image for local developer
    # flows. On ARM64 (Oracle Cloud) the workflow sets:
    #   OSRM_IMAGE=ghcr.io/<owner>/synapse-osrm-arm64:v5.27.1
    # built from infrastructure/osrm/Dockerfile.osrm-arm64 (see ADR / Part J
    # of the Sprint 6 plan).
    image: ${OSRM_IMAGE:-osrm/osrm-backend:latest}
    container_name: synapse-osrm-mumbai
    ports:
      - "5001:5000"
    volumes:
      - ../data/mumbai:/data:ro
    command: osrm-routed --algorithm mld /data/mumbai_extract.osrm
    networks:
      - agents-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/route/v1/driving/72.8777,19.0760;72.8307,19.0176 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  demand-prophet-mumbai:
    build:
      context: ../agents/demand_prophet
      dockerfile: Dockerfile
    container_name: synapse-demand-prophet-mumbai
    environment:
      - CITY=mumbai
      - OSRM_HOST=osrm-mumbai
      - OSRM_PORT=5000
      - FEAST_REPO=data_fabric/feast/mumbai
      - NEO4J_URI=bolt://neo4j:7687
      - KAFKA_BOOTSTRAP=kafka:9092
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_STAGE=Staging
      - REDIS_DB=1
      - AGENT_ID=demand_prophet_mumbai
    depends_on:
      osrm-mumbai:
        condition: service_healthy
    networks:
      - agents-net
      - infra-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  routing-navigator-mumbai:
