# ============================================================================
# SYNAPSE Docker Compose — Full Development Stack
# Total cost: $0 (all open-source / free-tier)
# Uses Apache Kafka in KRaft mode (no ZooKeeper required)
# ============================================================================

x-common-labels: &common-labels
  labels:
    project: "synapse"
    version: "0.1.0"

networks:
  infra-net:
    driver: bridge
    name: synapse-infra
  agents-net:
    driver: bridge
    name: synapse-agents
  frontend-net:
    driver: bridge
    name: synapse-frontend

volumes:
  kafka-data:
  neo4j-data:
  neo4j-logs:
  postgres-data:
  redis-data:
  mlflow-data:
  prometheus-data:
  grafana-data:

services:
  # ════════════════════════════════════════════════════════════════════════════
  # LAYER 1: Core Infrastructure
  # ════════════════════════════════════════════════════════════════════════════

  kafka:
    image: apache/kafka:3.9.0
    container_name: synapse-kafka
    <<: *common-labels
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: synapse-kafka-cluster-001
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - infra-net
      - agents-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 | grep ApiVersion || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: synapse-redis
    <<: *common-labels
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ../infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - infra-net
      - agents-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # E6 elevation: prometheus.yml scrapes redis-exporter:9121 and
  # kafka-jmx-exporter:9404; CLAUDE.md notes Redis/Kafka don't expose /metrics
  # natively. These sidecar containers translate native metrics to a
  # Prometheus-readable surface so the Grafana dashboards have data.
  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: synapse-redis-exporter
    <<: *common-labels
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - infra-net
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  kafka-jmx-exporter:
    image: bitnami/jmx-exporter:1.0.1
    container_name: synapse-kafka-jmx-exporter
    <<: *common-labels
    command: ["9404", "/etc/jmx-exporter/config.yml"]
    volumes:
      - ../infrastructure/prometheus/kafka_jmx_exporter.yml:/etc/jmx-exporter/config.yml:ro
    ports:
      - "9404:9404"
    networks:
      - infra-net
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: synapse-neo4j
    <<: *common-labels
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/synapse_graph_2026}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ../infrastructure/neo4j:/var/lib/neo4j/import
    networks:
      - infra-net
      - agents-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: synapse-postgres
    <<: *common-labels
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-synapse_audit}
      - POSTGRES_USER=${POSTGRES_USER:-synapse}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-synapse_audit_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../infrastructure/postgres/init_audit.sql:/docker-entrypoint-initdb.d/01_init_audit.sql:ro
      - ../infrastructure/postgres/02_sprint4_consensus.sql:/docker-entrypoint-initdb.d/02_sprint4_consensus.sql:ro
      - ../infrastructure/postgres/03_sprint7_outbox.sql:/docker-entrypoint-initdb.d/03_sprint7_outbox.sql:ro
      - ../infrastructure/postgres/04_sprint9_audit_chain.sql:/docker-entrypoint-initdb.d/04_sprint9_audit_chain.sql:ro
    networks:
      - infra-net
      - agents-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse} -d ${POSTGRES_DB:-synapse_audit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # LAYER 2: ML & Feature Infrastructure
  # ════════════════════════════════════════════════════════════════════════════

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: synapse-mlflow
    <<: *common-labels
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    networks:
      - infra-net
      - agents-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/api/2.0/mlflow/experiments/search?max_results=1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # LAYER 3: Observability
  # ════════════════════════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: synapse-prometheus
    <<: *common-labels
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ../infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../infrastructure/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ../infrastructure/prometheus/alert_rules_sprint4.yml:/etc/prometheus/alert_rules_sprint4.yml:ro
      - ../infrastructure/prometheus/sprint5_alert_rules.yml:/etc/prometheus/sprint5_alert_rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - infra-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: synapse-grafana
    <<: *common-labels
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-synapse_grafana_2026}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - infra-net
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # LAYER 4: Utility Services
  # ════════════════════════════════════════════════════════════════════════════

  # ════════════════════════════════════════════════════════════════════════════
  # LAYER 5: Orchestrator (Sprint 4)
  # ════════════════════════════════════════════════════════════════════════════

  orchestrator:
    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    container_name: synapse-orchestrator
    <<: *common-labels
    environment:
      - SYNAPSE_ORCHESTRATOR_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SYNAPSE_ORCHESTRATOR_REDIS_URL=redis://redis:6379
      - SYNAPSE_ORCHESTRATOR_NEO4J_URI=bolt://neo4j:7687
      - SYNAPSE_ORCHESTRATOR_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - SYNAPSE_ORCHESTRATOR_POSTGRESQL_URL=postgresql+asyncpg://synapse_app:synapse_app_2026@postgres:5432/synapse_audit
      - SYNAPSE_ORCHESTRATOR_PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - SYNAPSE_ORCHESTRATOR_CONFIDENCE_THRESHOLD=0.7
    ports:
      - "8085:8085"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agents-net
      - infra-net
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: synapse-kafka-ui
    <<: *common-labels
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_CLUSTERS_0_NAME=synapse-local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    ports:
      - "8080:8080"
    networks:
      - infra-net
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # LAYER 6: Sprint 5 — Security & Evaluation
  # ════════════════════════════════════════════════════════════════════════════

  nginx:
    image: nginx:1.25-alpine
    container_name: synapse-nginx
    <<: *common-labels
    ports:
      - "80:80"
    volumes:
      - ../infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net
      - agents-net
    depends_on:
      - orchestrator
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: synapse-dragonfly
    <<: *common-labels
    ports:
      - "6380:6379"
    ulimits:
      memlock: -1
    networks:
      - infra-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Observability (v4.0 §15) ───────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: synapse-jaeger
    <<: *common-labels
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "14250:14250"  # collector gRPC
    networks:
      - infra-net
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    container_name: synapse-otel-collector
    <<: *common-labels
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ../infrastructure/observability/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    depends_on:
      - jaeger
    networks:
      - infra-net
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.7.0
    container_name: synapse-pushgateway
    <<: *common-labels
    ports:
      - "9091:9091"
    networks:
      - infra-net
    restart: unless-stopped
