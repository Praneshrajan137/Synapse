# ============================================================================
# SYNAPSE Inventory Sentinel -- Formal Behavioral Specification (SDD)
# ============================================================================
agent_name: inventory_sentinel
version: "1.0.0"
description: >
  Three-level Hierarchical Multi-Agent RL for inventory management.
  L1 Strategic (cluster-wide), L2 Tactical (per-store), L3 Operational (shelf).
  Cross-store training via Flower federated learning (I-11).

architecture:
  l1_strategic: "PPO via RLlib -- cluster of 5 stores"
  l2_tactical: "PPO conditioned on L1 output -- per-store, per-SKU"
  l3_operational: "Permutation-based shelf priority ranking"
  federated: "Flower FedAvg -- gradient-only aggregation (I-11)"

invariants:
  - id: "INV-IS-001"
    description: "Safety stock multiplier within bounds [1.0, 3.0]"
    assertion: "1.0 <= output.safety_stock_multiplier <= 3.0"
    severity: critical

  - id: "INV-IS-002"
    description: "Reorder quantity is non-negative"
    assertion: "output.quantity >= 0"
    severity: critical

  - id: "INV-IS-003"
    description: "Action type is valid enum"
    assertion: "output.action_type in {'reorder', 'transfer', 'markdown'}"
    severity: critical

  - id: "INV-IS-004"
    description: "Confidence bounded [0, 1]"
    assertion: "0.0 <= output.confidence <= 1.0"
    severity: critical

  - id: "INV-IS-005"
    description: "Output validates against inventory_action.schema.json"
    assertion: "jsonschema.validate(output.dict(), inventory_action_schema) passes"
    severity: critical

  - id: "INV-IS-006"
    description: "Federated gradient-only aggregation -- no raw data leaves store (I-11)"
    assertion: "flower_client sends only model_parameters, never raw_data"
    severity: critical

  - id: "INV-IS-007"
    description: "Reorder point is non-negative"
    assertion: "output.reorder_point >= 0"
    severity: critical

  - id: "INV-IS-008"
    description: "Output serialization is deterministic (I-13)"
    assertion: "output.to_deterministic_json() == output.to_deterministic_json()"
    severity: critical

preconditions:
  - id: "PRE-IS-001"
    description: "Store ID valid"
    check: "store_id in valid_store_ids"

  - id: "PRE-IS-002"
    description: "SKU list non-empty"
    check: "1 <= len(sku_ids) <= 1000"

  - id: "PRE-IS-003"
    description: "Demand forecast available"
    check: "demand_forecast is not None"

postconditions:
  - id: "POST-IS-001"
    description: "Action generated for each requested SKU"
    check: "len(actions) == len(sku_ids)"

  - id: "POST-IS-002"
    description: "Kafka message published to synapse.inventory.state"
    check: "kafka_publish_success == True"

state_machine:
  initial_state: "IDLE"
  states: ["IDLE", "PROPOSING", "DEBATING", "EXECUTING", "LEARNING", "ERROR"]
  transitions:
    - from: "IDLE"
      to: "PROPOSING"
      trigger: "inventory_check_triggered"
      guard: "kafka_healthy and feast_available"
      timeout_seconds: 2
    - from: "PROPOSING"
      to: "DEBATING"
      trigger: "proposal_submitted"
      timeout_seconds: 5
    - from: "DEBATING"
      to: "EXECUTING"
      trigger: "consensus_reached"
      timeout_seconds: 30
    - from: "EXECUTING"
      to: "LEARNING"
      trigger: "execution_confirmed"
      timeout_seconds: 10
    - from: "LEARNING"
      to: "IDLE"
      trigger: "policy_updated"
      timeout_seconds: 5
    - from: "PROPOSING"
      to: "ERROR"
      trigger: "exception_raised"
    - from: "EXECUTING"
      to: "ERROR"
      trigger: "exception_raised"
    - from: "ERROR"
      to: "IDLE"
      trigger: "error_handled"
      timeout_seconds: 30

metamorphic_relations:
  - id: "MR-IS-001"
    description: "Higher conformal interval width increases safety stock multiplier"
    transform: "double conformal_width for all horizons"
    expected: "safety_stock_multiplier increases"

  - id: "MR-IS-002"
    description: "Zero demand forecast triggers no reorder"
    transform: "set all demand forecast values to 0"
    expected: "no reorder action generated (only markdown if near expiry)"

contracts:
  - producer: "inventory_sentinel"
    expectations:
      - "proposal includes utility_score, confidence, justification_trace"
      - "actions include safety_stock_multiplier in [1.0, 3.0]"
      - "all reorder quantities are non-negative"

reward:
  weights: {}
  scale: 1.0
  notes: L1/L2/L3 rewards use inline magic numbers; Sprint 8 contract-only, Sprint
    9 promotes named weights.
