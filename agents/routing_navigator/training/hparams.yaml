# SYNAPSE Routing Navigator -- Training Hyperparameters
model:
  encoder_layers: 6
  encoder_heads: 8
  encoder_dim: 128
  decoder_hidden: 128
  student_hidden_1: 256
  student_hidden_2: 128

training:
  num_episodes: 500000
  batch_size: 64
  learning_rate: 0.0001
  gamma: 0.99
  entropy_coeff: 0.01
  seed: 42
  algorithm: "REINFORCE"
  baseline: "self_critical"

distillation:
  temperature: 3.0
  alpha: 0.7
  epochs: 100
  student_lr: 0.001

reward:
  w_time: 0.4
  w_fuel: 0.2
  w_freshness: 0.25
  w_fairness: 0.15
