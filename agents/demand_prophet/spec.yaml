# ============================================================================
# SYNAPSE Demand Prophet -- Formal Behavioral Specification (SDD)
# Auto-generates test_spec.py via: python scripts/generate_tests_from_spec.py
# ============================================================================
agent_name: demand_prophet
version: "1.0.0"
description: >
  Heterogeneous Graph Transformer + Temporal Fusion Transformer hybrid
  for multi-horizon demand forecasting with conformal prediction intervals.
  Highest-dependency agent: 5 agents consume forecasts.

architecture:
  graph_encoder: "HGTConv (PyTorch Geometric)"
  temporal_backbone: "Custom TFT (PyTorch)"
  fusion: "Learned sigmoid gating"
  uncertainty: "MAPIE conformal prediction"
  horizons: ["15min", "1h", "6h", "24h", "7d"]

invariants:
  - id: "INV-DP-001"
    description: "Every forecast includes conformal intervals"
    assertion: "output.lower_90 is not None and output.upper_90 is not None"
    severity: critical

  - id: "INV-DP-002"
    description: "90% conformal interval achieves >=85% empirical coverage"
    assertion: "empirical_coverage(output.lower_90, output.upper_90, actuals) >= 0.85"
    severity: critical

  - id: "INV-DP-003"
    description: "Confidence score is bounded [0, 1]"
    assertion: "0.0 <= output.confidence <= 1.0"
    severity: critical

  - id: "INV-DP-004"
    description: "Forecast horizons match VALID_HORIZONS set"
    assertion: "set(output.horizons.keys()) == {'15min', '1h', '6h', '24h', '7d'}"
    severity: high

  - id: "INV-DP-005"
    description: "Output validates against demand_forecast.schema.json"
    assertion: "jsonschema.validate(output.dict(), demand_forecast_schema) passes"
    severity: critical

  - id: "INV-DP-006"
    description: "All forecast values are non-negative"
    assertion: "all(v >= 0 for v in output.horizons.values())"
    severity: critical

  - id: "INV-DP-007"
    description: "Drift detection flag set when distribution shift detected"
    assertion: "if kl_divergence > 0.1 then output.drift_detected == True"
    severity: high

  - id: "INV-DP-008"
    description: "Inference latency within Tier 2 SLA"
    assertion: "inference_latency_ms < 500"
    severity: high

  - id: "INV-DP-009"
    description: "Output serialization is deterministic (I-13)"
    assertion: "output.to_deterministic_json() == output.to_deterministic_json()"
    severity: critical

preconditions:
  - id: "PRE-DP-001"
    description: "SKU count within batch limit"
    check: "1 <= len(sku_ids) <= 500"

  - id: "PRE-DP-002"
    description: "Store ID exists in knowledge graph"
    check: "store_id in valid_store_ids"

  - id: "PRE-DP-003"
    description: "Historical data availability"
    check: "len(historical_demand) >= 7"

  - id: "PRE-DP-004"
    description: "All requested horizons are valid"
    check: "set(horizons).issubset({'15min', '1h', '6h', '24h', '7d'})"

postconditions:
  - id: "POST-DP-001"
    description: "Output count matches input count"
    check: "len(forecasts) == len(sku_ids)"

  - id: "POST-DP-002"
    description: "Inference latency within SLA"
    check: "inference_latency_ms < 500"

  - id: "POST-DP-003"
    description: "Drift detection flag set when KL divergence exceeds threshold"
    check: "if kl_divergence > 0.1 then drift_detected == True"

  - id: "POST-DP-004"
    description: "Kafka message published to synapse.demand.forecast"
    check: "kafka_publish_success == True"

  - id: "POST-DP-005"
    description: "MLflow metrics logged"
    check: "mlflow_log_success == True"

state_machine:
  initial_state: "IDLE"
  states: ["IDLE", "PROPOSING", "DEBATING", "EXECUTING", "LEARNING", "ERROR"]
  transitions:
    - from: "IDLE"
      to: "PROPOSING"
      trigger: "forecast_request_received"
      guard: "kafka_healthy and feast_available"
      timeout_seconds: 2
    - from: "PROPOSING"
      to: "DEBATING"
      trigger: "proposal_submitted"
      guard: "confidence >= 0.0"
      timeout_seconds: 5
    - from: "DEBATING"
      to: "EXECUTING"
      trigger: "consensus_reached"
      guard: "orchestrator_approved"
      timeout_seconds: 30
    - from: "EXECUTING"
      to: "LEARNING"
      trigger: "execution_confirmed"
      timeout_seconds: 10
    - from: "LEARNING"
      to: "IDLE"
      trigger: "policy_updated"
      timeout_seconds: 5
    - from: "PROPOSING"
      to: "ERROR"
      trigger: "exception_raised"
    - from: "EXECUTING"
      to: "ERROR"
      trigger: "exception_raised"
    - from: "ERROR"
      to: "IDLE"
      trigger: "error_handled"
      timeout_seconds: 30

metamorphic_relations:
  - id: "MR-DP-001"
    description: "Doubled historical demand increases 24h forecast by >20%"
    transform: "multiply all historical demand values by 2"
    expected: "24h forecast increases by >20%"

  - id: "MR-DP-002"
    description: "Weekend vs weekday inputs produce different forecasts"
    transform: "change day_of_week from Monday to Saturday"
    expected: "forecasts must differ"

  - id: "MR-DP-003"
    description: "IPL match event injection increases snack/beverage forecast"
    transform: "inject IPL match event signal"
    expected: "snack and beverage category forecast increases"

  - id: "MR-DP-004"
    description: "Permuting SKU ID order does not change forecasts"
    transform: "shuffle sku_ids list order"
    expected: "per-SKU forecasts unchanged (order invariance)"

contracts:
  - producer: "demand_prophet"
    expectations:
      - "output includes lower_90, upper_90, drift_detected, confidence fields"
      - "all forecast values are non-negative"
      - "conformal interval width > 0 for all horizons"
      - "sku_id and store_id are non-empty strings"
      - "horizons dict contains all 5 requested keys"
      - "proposal includes utility_score, confidence, justification_trace per A2A spec"

reward:
  weights:
    crps_weight: 1.0
    calibration_weight: 0.5
    event_weight: 0.1
  scale: 1.0
  notes: Reward = -crps_weight*CRPS - calibration_weight*calibration_gap + event_weight*event_bonus.
    Shadow mode ADR-031.

alerts:
- invariant_id: INV-DP-002
  threshold_metric: avg_over_time(synapse_demand_prophet_coverage_p90{}[5m])
  comparison: lt
  threshold: 0.85
  window: 10m
  severity: critical
  runbook: https://github.com/Praneshrajan137/synapse/blob/main/docs/runbooks/conformal_coverage_loss.md
- invariant_id: INV-DP-006
  threshold_metric: sum(rate(synapse_demand_prophet_negative_horizon_total[5m]))
  comparison: gt
  threshold: 0.0
  window: 1m
  severity: critical
  runbook: https://github.com/Praneshrajan137/synapse/blob/main/docs/runbooks/forecast_negative_values.md
