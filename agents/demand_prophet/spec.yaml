agent_name: demand_prophet
version: "0.1.0"

invariants:
  - id: "INV-DP-001"
    description: "Every forecast includes conformal intervals"
    assertion: "output.lower_90 is not None and output.upper_90 is not None"
    severity: critical
  - id: "INV-DP-002"
    description: "90% conformal interval achieves >=85% empirical coverage"
    assertion: "empirical_coverage(output.lower_90, output.upper_90, actuals) >= 0.85"
    severity: critical
  - id: "INV-DP-003"
    description: "Confidence score is bounded [0, 1]"
    assertion: "0.0 <= output.confidence <= 1.0"
    severity: critical
  - id: "INV-DP-004"
    description: "Forecast horizons match VALID_HORIZONS set"
    assertion: "set(output.horizons.keys()) == {'15min', '1h', '6h', '24h', '7d'}"
    severity: high
  - id: "INV-DP-005"
    description: "Output validates against demand_forecast.schema.json"
    assertion: "jsonschema.validate(output.dict(), demand_forecast_schema) passes"
    severity: critical

preconditions:
  - id: "PRE-DP-001"
    description: "SKU count within batch limit"
    check: "len(sku_ids) <= 500"
  - id: "PRE-DP-002"
    description: "Store ID exists in knowledge graph"
    check: "store_id in valid_store_ids"
  - id: "PRE-DP-003"
    description: "Historical data availability"
    check: "len(historical_demand) >= 7 (days)"

postconditions:
  - id: "POST-DP-001"
    description: "Output count matches input count"
    check: "len(forecasts) == len(sku_ids)"
  - id: "POST-DP-002"
    description: "Inference latency within SLA"
    check: "inference_latency_ms < 500"
  - id: "POST-DP-003"
    description: "Drift detection flag set when KL divergence exceeds threshold"
    check: "if kl_divergence > 0.1 then drift_detected == True"

state_machine:
  initial_state: "IDLE"
  states: ["IDLE", "PROPOSING", "DEBATING", "EXECUTING", "LEARNING", "ERROR"]
  transitions:
    - from: "IDLE"
      to: "PROPOSING"
      trigger: "forecast_request_received"
      guard: "kafka_healthy and feast_available"
      timeout_seconds: 2
    - from: "PROPOSING"
      to: "DEBATING"
      trigger: "proposal_submitted"
      guard: "confidence >= 0.0"
      timeout_seconds: 5
    - from: "DEBATING"
      to: "EXECUTING"
      trigger: "consensus_reached"
      guard: "orchestrator_approved"
      timeout_seconds: 30
    - from: "EXECUTING"
      to: "LEARNING"
      trigger: "execution_confirmed"
      timeout_seconds: 10
    - from: "LEARNING"
      to: "IDLE"
      trigger: "policy_updated"
      timeout_seconds: 5
    - from: "PROPOSING"
      to: "ERROR"
      trigger: "exception_raised"
    - from: "ERROR"
      to: "IDLE"
      trigger: "error_handled"
      timeout_seconds: 30

metamorphic_relations:
  - id: "MR-DP-001"
    description: "Doubled historical demand increases 24h forecast by >20%"
    transform: "multiply all historical demand values by 2"
    expected: "24h forecast increases by >20%"
  - id: "MR-DP-002"
    description: "Weekend vs weekday inputs produce different forecasts"
    transform: "change day_of_week from Monday to Saturday"
    expected: "forecasts must differ"
  - id: "MR-DP-003"
    description: "IPL match event injection increases snack/beverage forecast"
    transform: "inject IPL match event signal"
    expected: "snack and beverage category forecast increases"
  - id: "MR-DP-004"
    description: "Permuting SKU ID order does not change forecasts"
    transform: "shuffle sku_ids list order"
    expected: "per-SKU forecasts unchanged (order invariance)"

contracts:
  - producer: "demand_prophet"
    expectations:
      - "output includes lower_90, upper_90, drift_detected, confidence fields"
      - "all forecast values are non-negative"
      - "sku_id and store_id are non-empty strings"
