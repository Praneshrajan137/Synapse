# SYNAPSE Frontend — nginx server block (mounted under /etc/nginx/conf.d/).
# Sits behind the project nginx ingress at infrastructure/nginx/nginx.conf
# (which already terminates /api and /ws). This block serves the SPA assets
# with strict cache + security headers (FE-INV-014, FE-INV-015).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets — immutable, year-long cache.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PMTiles blob (FE-P4, self-hosted basemap; I-1).
    location /tiles/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Healthcheck for compose / k8s.
    location = /healthz {
        access_log off;
        return 200 "ok";
        default_type text/plain;
    }

    # SPA fallback — never cache the entry HTML.
    location / {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # CSP for the SPA shell. `connect-src 'self'` keeps API/WS in-origin
        # because the project ingress proxies them. No SaaS endpoints
        # whitelisted — FE-INV-001 holds (I-1).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri /api/v1/csp-report" always;
        try_files $uri $uri/ /index.html;
    }
}
