<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="SYNAPSE Console — command center for an autonomous quick-commerce supply chain."
    />
    <meta name="theme-color" content="#06080f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Paint-critical self-hosted face (ADR-045): Space Grotesk sets the Shell wordmark and
         Mission Control's hero title above the fold, and is 22 KB. Inter is deliberately NOT
         preloaded: its 344 KB competed with the entry JS for the 3G mobile profile's whole
         bandwidth before first render, and font-display: swap never makes the first paint
         wait for it (styles/fonts.css). Mono swaps late by design. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/SpaceGrotesk[wght].woff2"
    />
    <title>SYNAPSE Console</title>
    <script>
      // No-flash theme: apply the saved theme before first paint.
      // Default is dark — operators run in low-ambient control rooms.
      // Reads the zustand-persisted store (localStorage["synapse.theme"],
      // JSON envelope) — the previous bare "synapse-theme" key never existed,
      // so saved themes flashed dark on every reload.
      (function () {
        try {
          var raw = localStorage.getItem("synapse.theme");
          if (raw) {
            var t = JSON.parse(raw).state.theme;
            if (t === "light" || t === "dark" || t === "hc") {
              document.documentElement.setAttribute("data-theme", t);
            }
          }
        } catch (e) {
          /* localStorage unavailable — keep the dark default */
        }
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink">
    <div id="root"></div>
    <noscript>SYNAPSE Console requires JavaScript. Enable it to continue.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
