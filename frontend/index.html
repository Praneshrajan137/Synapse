<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="SYNAPSE Console — command center for an autonomous quick-commerce supply chain."
    />
    <meta name="theme-color" content="#020617" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SYNAPSE Console</title>
    <script>
      // No-flash theme: apply the saved theme before first paint.
      // Default is dark — operators run in low-ambient control rooms.
      (function () {
        try {
          var t = localStorage.getItem("synapse-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {
          /* localStorage unavailable — keep the dark default */
        }
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink">
    <div id="root"></div>
    <noscript>SYNAPSE Console requires JavaScript. Enable it to continue.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
