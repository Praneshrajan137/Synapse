# SYNAPSE Frontend — Invariant Registry (FE-INV-*)
#
# Mirrors docs/specs/invariants.yaml for the FE slice. Every entry below
# binds to:
#   - a backend invariant or ADR it inherits from
#   - the source file(s) that implement it
#   - the test(s) that prove it
#
# CI (.github/workflows/frontend.yml) runs spec/check_fe_invariants.py to
# fail the build on missing implementations or tests for any entry.

version: 1
invariants:
  - id: FE-INV-001
    title: No paid SaaS endpoints
    mirrors: I-1
    description: >
      The bundled FE makes zero calls to paid SaaS providers (Mapbox,
      Sentry, Algolia, OpenAI, Auth0). License audit + network egress audit
      both block these in CI.
    implementations:
      - .github/workflows/frontend.yml
      - frontend/nginx.conf
    tests:
      - .github/workflows/frontend.yml  # license-audit job
    status: enforced

  - id: FE-INV-002
    title: Domain Zod schemas mirror proto/domain
    mirrors: I-3
    description: >
      Every shape produced by the BE is parsed through a Zod schema in
      src/domain/* before rendering. Failures are surfaced as
      SchemaViolationError, never silently rendered.
    implementations:
      - frontend/src/domain/index.ts
      - frontend/src/transport/http-client.ts
    tests:
      - frontend/src/domain/__tests__/schemas.test.ts
    status: enforced

  - id: FE-INV-003
    title: Override commits to audit before optimistic UI
    mirrors: I-4
    description: >
      An operator override must POST the audit-row-first endpoint before
      the FE marks the entry as acted. WebSocket ack is the operational
      acknowledgement, not the commit.
    implementations:
      - frontend/src/surfaces/override-cockpit/Cockpit.tsx
      - frontend/src/surfaces/override-cockpit/useOverrideMutation.ts
      - api/routers/decisions.py
      - infrastructure/postgres/03_p1_override.sql
    tests:
      - frontend/src/surfaces/override-cockpit/__tests__/override-flow.test.tsx
      - frontend/tests/e2e/cockpit.spec.ts
    status: enforced

  - id: FE-INV-004
    title: Every decision card carries Tier + Confidence + reasoning link
    mirrors: I-5, I-6
    description: >
      No decision is rendered without a TierBadge, a ConfidenceChip, and a
      one-click route to the audit row. Enforced via visual-regression and
      a11y label probes.
    implementations:
      - frontend/src/surfaces/decision-theater/DecisionTheater.tsx
      - frontend/src/design-system/compounds/TierBadge.tsx
      - frontend/src/design-system/compounds/ConfidenceChip.tsx
    tests:
      - frontend/src/design-system/compounds/__tests__/TierBadge.test.tsx
      - frontend/src/design-system/compounds/__tests__/ConfidenceChip.test.tsx
    status: enforced

  - id: FE-INV-005
    title: Tier SLA budgets are centralized
    mirrors: tier_router.py
    description: >
      Tier 1/2/3/4 SLAs live in @lib/confidence and feed both the motion
      preset and the tier-budget probe in E2E.
    implementations:
      - frontend/src/lib/confidence.ts
    tests:
      - frontend/src/lib/__tests__/confidence.test.ts
    status: enforced

  - id: FE-INV-006
    title: Full-Jitter retry on transient failures
    mirrors: ADR-016, ADR-017
    description: >
      5xx and network errors retry with Full Jitter; 429 honors Retry-After;
      4xx (other) short-circuits.
    implementations:
      - frontend/src/lib/jitter-retry.ts
      - frontend/src/transport/http-client.ts
    tests:
      - frontend/src/lib/__tests__/jitter-retry.test.ts
    status: enforced

  - id: FE-INV-007
    title: Sub-threshold confidence demotes Approve from default focus
    mirrors: I-5
    description: >
      When confidence < threshold, Reject (or Modify) receives default
      keyboard focus in the Override Cockpit action bar.
    implementations:
      - frontend/src/surfaces/override-cockpit/Cockpit.tsx
    tests:
      - frontend/src/design-system/compounds/__tests__/ConfidenceChip.test.tsx
    status: enforced

  - id: FE-INV-008
    title: WS reconnect with full jitter; messages deduped by seq
    mirrors: ADR-016
    description: >
      The WS multiplex client reconnects with bounded full-jitter and
      drops messages where seq <= last seen for the channel.
    implementations:
      - frontend/src/transport/ws-multiplex.ts
    tests:
      - frontend/src/lib/__tests__/jitter-retry.test.ts
    status: enforced

  - id: FE-INV-009
    title: Deterministic decision replay from decision_id
    mirrors: I-14
    description: >
      The decision detail page renders identically when loaded with the
      same decision_id, with no client-only state drift. Replay is pure —
      no Date.now, no Math.random, no I/O — and verified by a property test.
    implementations:
      - frontend/src/surfaces/decision-theater/DecisionTheater.tsx
      - frontend/src/surfaces/decision-theater/DecisionDetail.tsx
      - frontend/src/lib/replay.ts
    tests:
      - frontend/src/lib/__tests__/replay.test.ts
    status: enforced

  - id: FE-INV-010
    title: Web Vitals budgets
    mirrors: ADR-012
    description: >
      LCP <= 2.5s, INP <= 200ms, CLS <= 0.1 on /cockpit over 3G Slow.
      P2 ships the budget; production tuning continues in P4.
    implementations:
      - frontend/src/main.tsx
      - frontend/vite.config.ts
    tests:
      - frontend/tests/e2e/smoke.spec.ts
    status: enforced

  - id: FE-INV-011
    title: WCAG 2.1 AA across every route
    mirrors: STRIDE
    description: >
      axe-core asserts zero violations on every route in the Playwright
      smoke matrix.
    implementations:
      - frontend/.storybook/preview.ts
      - frontend/tests/e2e/smoke.spec.ts
    tests:
      - frontend/tests/e2e/smoke.spec.ts
    status: enforced

  - id: FE-INV-012
    title: Canonical JSON on every outbound payload
    mirrors: I-8
    description: >
      Sorted keys, no whitespace, drops undefined fields. Enforced inside
      the HTTP client and the WS send path for operator overrides.
    implementations:
      - frontend/src/lib/json-canonical.ts
      - frontend/src/transport/http-client.ts
      - frontend/src/surfaces/override-cockpit/Cockpit.tsx
    tests:
      - frontend/src/lib/__tests__/json-canonical.test.ts
    status: enforced

  - id: FE-INV-013
    title: User-visible strings thread through the i18n catalog (English-only)
    mirrors: ADR-012
    description: >
      All user-visible copy threads through the i18next catalog. The UI ships in
      English ONLY (Sprint 18): a single `en` catalog, supportedLngs ["en"], and
      no language switcher or language detector — see the CLAUDE.md "English-only
      UI" rule. The Demo Theater + every surface header consume the relevant
      namespace.
    implementations:
      - frontend/src/i18n/index.ts
      - frontend/src/surfaces/demo-theater/DemoTheater.tsx
    tests:
      - frontend/spec/check_fe_invariants.py
    status: enforced

  - id: FE-INV-014
    title: Entry bundle size budget
    mirrors: ADR-012
    description: >
      Entry route ships <= 180 KB gzipped; visualization libs are async.
      P2 enforced via manualChunks + LivingMap dynamic import.
    implementations:
      - frontend/vite.config.ts
      - frontend/package.json
      - frontend/src/surfaces/mission-control/LivingMap.tsx
    tests:
      - .github/workflows/frontend.yml
    status: enforced

  - id: FE-INV-015
    title: CSP; no dangerouslySetInnerHTML
    mirrors: STRIDE
    description: >
      Strict CSP in production nginx; Biome rule blocks
      dangerouslySetInnerHTML at the source.
    implementations:
      - frontend/nginx.conf
      - frontend/biome.json
    tests:
      - .github/workflows/frontend.yml  # lint job
    status: enforced

  - id: FE-INV-016
    title: City discriminator on every metric render
    mirrors: E-S6-05
    description: >
      Every TanStack Query key for metric data carries the active city.
      Switching cities invalidates the cache cleanly.
    implementations:
      - frontend/src/state/city.store.ts
      - frontend/src/state/firehose.store.ts
      - frontend/src/hooks/use-firehose.ts
      - frontend/src/transport/firehose.ts
    tests:
      - frontend/src/state/__tests__/firehose-store.test.ts
    status: enforced

  - id: FE-INV-017
    title: Append-only escalation store
    mirrors: I-14
    description: >
      The escalation store never removes entries; status is mutated via
      append-style `markActed`. No public clear/pop/remove path.
    implementations:
      - frontend/src/state/escalation.store.ts
    tests:
      - frontend/src/state/__tests__/escalation-store.test.ts
    status: enforced

  - id: FE-INV-018
    title: Tier-aware tool visibility
    mirrors: ADR-022
    description: >
      Tier 1-2 renders only `rl_*` tools in proposal cards; Tier 3-4
      shows the full toolset. The replay function gates per-phase proposal
      visibility (proposed-only at phase 1; full set at phase 3+).
    implementations:
      - frontend/src/surfaces/decision-theater/DecisionDetail.tsx
      - frontend/src/lib/replay.ts
    tests:
      - frontend/src/lib/__tests__/replay.test.ts
    status: enforced

  - id: FE-INV-019
    title: Operator identity via Vault token presence only
    mirrors: STRIDE
    description: >
      The UI never renders raw operator usernames; only the Vault token
      reference (last 8 chars) appears, and only when authenticated.
    implementations:
      - frontend/src/design-system/compounds/OperatorIdentity.tsx
    tests:
      - frontend/src/design-system/compounds/__tests__/TierBadge.test.tsx  # P1 adds OperatorIdentity test
    status: enforced

  - id: FE-INV-020
    title: Self-hosted map tiles only
    mirrors: I-1
    description: >
      Map tiles come from /tiles/india.pmtiles (Protomaps) served by the
      project nginx; zero requests leave to Mapbox or Google.
    implementations:
      - frontend/nginx.conf
      - frontend/.env.example
      - frontend/src/visualization/maplibre/basemap.ts
      - infrastructure/tiles/Makefile
    tests:
      - .github/workflows/frontend.yml
    status: enforced

  - id: FE-INV-024
    title: Map renders only self-hosted PMTiles
    mirrors: I-1, FE-INV-020
    description: >
      MapLibre is configured exclusively against the pmtiles:// protocol
      handler; no remote tile servers are registered. Verified in CI.
    implementations:
      - frontend/src/visualization/maplibre/basemap.ts
      - frontend/src/visualization/maplibre/CityMap.tsx
    tests:
      - .github/workflows/frontend.yml
    status: enforced

  - id: FE-INV-025
    title: Heavy viz libs are async-only chunks
    mirrors: ADR-012, FE-INV-014
    description: >
      @deck.gl/*, maplibre, sigma/graphology, and visx never appear in the
      entry bundle. Mission Control loads the map via a lazy Suspense
      boundary; Twin Lab does the same for the WebGL supply graph
      (SupplyNetworkGraph, Sigma.js — replaced the three.js force graph in the
      SENSORIUM Phase 6b GPU-graph swap, which removed three / d3-force-3d /
      react-force-graph-3d).
    implementations:
      - frontend/vite.config.ts
      - frontend/src/surfaces/mission-control/LivingMap.tsx
      - frontend/src/surfaces/twin-lab/SupplyNetworkGraph.tsx
    tests:
      - .github/workflows/frontend.yml
    status: enforced

  - id: FE-INV-026
    title: Twin scenarios complete within the 10s SLA (INV-TW-004)
    mirrors: ADR-009, INV-TW-004
    description: >
      The Twin Lab POST /simulate flow surfaces 1000-scenario Monte Carlo
      runs without UI degradation. The FE shows progress and rejects
      hung runs with a typed timeout.
    implementations:
      - frontend/src/surfaces/twin-lab/TwinLab.tsx
      - frontend/src/surfaces/twin-lab/ScenarioBuilder.tsx
    tests:
      - frontend/src/lib/__tests__/replay.test.ts
    status: enforced

  - id: FE-INV-027
    title: Audit export contains zero PII
    mirrors: STRIDE, FE-INV-019
    description: >
      The Audit Vault CSV export contains audit_id / decision_id / tier /
      confidence / city / created_at / escalated only. Operator identity
      is rendered via Vault token reference; never raw username.
    implementations:
      - frontend/src/surfaces/audit-vault/AuditVault.tsx
      - frontend/src/design-system/compounds/OperatorIdentity.tsx
    tests:
      - frontend/src/state/__tests__/escalation-store.test.ts
    status: enforced

  - id: FE-INV-028
    title: Replay is referentially transparent and URL-shareable
    mirrors: I-14, FE-INV-009
    description: >
      `replayDecision(d, phase)` is a pure function — no Date.now, no
      Math.random, no I/O. Property test asserts equality across paired
      invocations for any phase index in [1, 5]. The Decision Detail
      surface stores the active phase index in the `?phase=N` search
      parameter (Zod-validated, clamped to [1, 5], fallback to the
      decision's terminal phase) and uses `replace: true` on every
      scrubber tick so the browser back button stays clean.
    implementations:
      - frontend/src/lib/replay.ts
      - frontend/src/surfaces/decision-theater/DecisionDetail.tsx
    tests:
      - frontend/src/lib/__tests__/replay.test.ts
      - frontend/tests/e2e/decision-replay.spec.ts
    status: enforced

  - id: FE-INV-029
    title: Demo evidence matches the backend artifact verbatim
    mirrors: FE-P10
    description: >
      The Demo Theater renders the JSON artifact produced by each demo
      segment (scripts/demo/*.py) inside the Evidence panel; the
      backend's run wrapper streams progress over SSE.
    implementations:
      # api/routers/demo.py was removed in the module-liveness sweep
      # (96f73d3); the FE surfaces remain the enforcement points.
      - frontend/src/surfaces/demo-theater/DemoTheater.tsx
      - frontend/src/surfaces/demo-theater/useDemoRun.ts
      - frontend/src/surfaces/demo-theater/useArtifact.ts
    tests:
      - frontend/tests/e2e/demo.spec.ts
    status: enforced

  - id: FE-INV-030
    title: Telemetry endpoint receives Web Vitals beacons
    mirrors: ADR-012
    description: >
      onCLS/onINP/onLCP fire through the batched log() helper, which
      uses navigator.sendBeacon. The gateway sink whitelists fields and
      forwards to structlog (Grafana frontend.json reads from Prometheus).
    implementations:
      - frontend/src/main.tsx
      - frontend/src/lib/log.ts
      - api/routers/telemetry.py
      - infrastructure/grafana/dashboards/frontend.json
    tests:
      - frontend/src/lib/__tests__/log.test.ts
    status: enforced

  - id: FE-INV-031
    title: Storybook test-runner reports zero a11y violations
    mirrors: STRIDE
    description: >
      Every Storybook story passes the axe-core check via
      @storybook/test-runner. CI runs this as part of the a11y job.
    implementations:
      - frontend/.storybook/main.ts
      - frontend/.storybook/preview.ts
      - frontend/src/design-system/compounds/TierBadge.stories.tsx
      - frontend/src/design-system/compounds/ConfidenceChip.stories.tsx
    tests:
      - .github/workflows/frontend.yml
    status: enforced

  - id: FE-INV-032
    title: Mutation survival under 15% on critical modules
    mirrors: ADR-015
    description: >
      Stryker mutation testing on json-canonical, jitter-retry, replay,
      escalation.store, firehose.store. Nightly CI gate.
    implementations:
      - frontend/src/lib/json-canonical.ts
      - frontend/src/lib/jitter-retry.ts
      - frontend/src/lib/replay.ts
      - frontend/src/state/escalation.store.ts
      - frontend/src/state/firehose.store.ts
    tests:
      - frontend/src/lib/__tests__/json-canonical.test.ts
      - frontend/src/lib/__tests__/jitter-retry.test.ts
      - frontend/src/lib/__tests__/replay.test.ts
      - frontend/src/state/__tests__/escalation-store.test.ts
      - frontend/src/state/__tests__/firehose-store.test.ts
    status: enforced

  - id: FE-INV-021
    title: Operator override commits audit row before WS ack
    mirrors: I-4, FE-INV-003
    description: >
      The gateway INSERTs into audit_escalations BEFORE notifying the
      orchestrator. If audit insert fails, no orchestrator notification is
      sent and the FE shows an error. Order is load-bearing.
    implementations:
      - api/routers/decisions.py
      - api/middleware/jwt.py
    tests:
      - frontend/src/surfaces/override-cockpit/__tests__/override-flow.test.tsx
    status: enforced

  - id: FE-INV-022
    title: Cockpit is keyboard-complete
    mirrors: STRIDE, FE-P6
    description: >
      The Override Cockpit can be operated end-to-end with the keyboard
      alone: A approve, R reject, M modify, J/K cycle, Esc closes dialog.
    implementations:
      - frontend/src/surfaces/override-cockpit/Cockpit.tsx
      - frontend/src/surfaces/override-cockpit/useCockpitShortcuts.ts
      - frontend/src/surfaces/override-cockpit/EscalationCard.tsx
    tests:
      - frontend/tests/e2e/cockpit.spec.ts
    status: enforced

  - id: FE-INV-023
    title: JWT refresh flow recovers from 401 without page reload
    mirrors: ADR-016, STRIDE
    description: >
      A single-flight refresh gate replays in-flight requests after a
      successful POST /api/v1/auth/refresh; a refresh failure (or a second
      401) clears the session and routes the operator to /login.
    implementations:
      - frontend/src/transport/auth-refresh.ts
      - frontend/src/hooks/use-synapse-api.ts
      - frontend/src/surfaces/auth/useAuthRefresh.ts
      - api/routers/auth.py
    tests:
      - frontend/src/transport/__tests__/auth-refresh.test.ts
      - frontend/tests/e2e/login.spec.ts
    status: enforced

  - id: FE-INV-033
    title: Operator-tunable steering, audit-logged on change
    mirrors: I-5, FE-INV-021
    description: >
      The /steering surface exposes Pareto objective weights (cost / time
      / sustainability / fairness) and per-tier HITL escalation thresholds
      (tier_2, tier_3, tier_4). Both are persisted client-side via
      Zustand+persist (localStorage["synapse.steering"]) and — once the
      audit pipeline is wired — also published to the
      `synapse.steering.config` Kafka topic via the audit-row-first
      commit pattern (FE-INV-021). Setters clamp values into [0, 1]; a
      non-finite input collapses to 0 so a corrupted localStorage state
      can never poison the orchestrator.
    implementations:
      - frontend/src/state/steering.store.ts
      - frontend/src/surfaces/steering/Steering.tsx
      - frontend/src/app/router.tsx
    tests:
      - frontend/src/surfaces/steering/__tests__/Steering.test.tsx
      - frontend/tests/e2e/steering.spec.ts
    status: enforced

  - id: FE-INV-034
    title: Structured provenance is rendered whenever present; degraded is never hidden
    mirrors: ADR-040, ADR-044, I-7
    description: >
      Every surface that renders a proposal or decision carrying structured
      provenance shows the ProvenanceChip (model version, feature source,
      confidence basis); a degraded=true output renders the chroma-drained
      degraded state with an explicit text label (INV-CLR-011/016) and is
      never silently suppressed. Decisions whose envelope reports
      degraded=true carry a visible degraded marker in the live tail.
    implementations:
      - frontend/src/design-system/compounds/ProvenanceChip.tsx
      - frontend/src/surfaces/mission-control/DecisionFirehoseTail.tsx
    tests:
      - frontend/src/design-system/compounds/__tests__/HonestyChannel.test.tsx
    status: enforced

  - id: FE-INV-035
    title: System degradation posture is visible on every surface
    mirrors: ADR-044, I-7, E-S9-04
    description: >
      The DegradedBanner mounts in the Shell (above every route) and renders
      whenever GET /api/v1/system/posture reports brownout shedding or an
      open dependency breaker, naming WHAT is degraded. A posture fetch
      failure renders "posture unknown" -- the banner never fails silently
      green. It is not dismissible while the condition holds (there is no
      dismiss affordance at all).
    implementations:
      - frontend/src/design-system/compounds/DegradedBanner.tsx
      - frontend/src/hooks/use-posture.ts
      - frontend/src/app/Shell.tsx
      - api/routers/system.py
      - orchestrator/inference/posture.py
    tests:
      - frontend/src/design-system/compounds/__tests__/HonestyChannel.test.tsx
      - api/tests/test_system_posture.py
      - orchestrator/tests/test_posture.py
    status: enforced

  - id: FE-INV-036
    title: Synthetic decisions are always visibly marked, never colour-only
    mirrors: ADR-044 D5, INV-CLR-011
    description: >
      A decision whose envelope reports is_synthetic=true (the traffic
      generator's "synthetic-" order prefix, owned by
      packages/synapse_common/synthetic.py) always renders the
      SyntheticBadge: the synthetic state colour PLUS a dashed ring and a
      text label, so demo pulses are distinguishable from real commerce
      under CVD, grayscale, or print.
    implementations:
      - frontend/src/design-system/compounds/SyntheticBadge.tsx
      - frontend/src/surfaces/mission-control/DecisionFirehoseTail.tsx
      - frontend/src/domain/decision-envelope.ts
    tests:
      - frontend/src/design-system/compounds/__tests__/HonestyChannel.test.tsx
      - frontend/src/domain/__tests__/decision-envelope.test.ts
    status: enforced

  - id: FE-INV-037
    title: Escalations apply at-most-once across dual delivery paths
    mirrors: ADR-044 D3, FE-INV-008
    description: >
      HITL escalations arrive via BOTH the legacy /ws/escalation socket and
      the firehose `escalation` channel during the transition, and WS
      replays re-deliver after reconnect. The escalation store ignores a
      duplicate decision_id -- the queue never shows the same escalation
      twice and an acted entry is never reset to pending by a replay.
    implementations:
      - frontend/src/state/escalation.store.ts
      - frontend/src/transport/firehose.ts
      - frontend/src/hooks/use-firehose.ts
      - api/routers/firehose.py
    tests:
      - frontend/src/state/__tests__/escalation-store.test.ts
      - api/tests/test_firehose_channels.py
    status: enforced

  - id: FE-INV-038
    title: Guardrail violations render individually with severity, never count-only
    mirrors: I-5, I-6, ADR-044
    description: >
      An escalation carrying guardrail violations renders EVERY violation
      with its code, message, and severity (low/medium/high/critical mapped
      to warning/danger tones plus the severity word -- INV-CLR-011). The
      previous count-plus-first-message collapse hid exactly the constraints
      an overriding operator is accountable for. A missing severity defaults
      to medium rather than hiding the row.
    implementations:
      - frontend/src/surfaces/override-cockpit/EscalationCard.tsx
      - frontend/src/domain/escalation.ts
    tests:
      - frontend/src/surfaces/override-cockpit/__tests__/EscalationCardViolations.test.tsx
    status: enforced

  - id: FE-INV-039
    title: Audit-chain integrity is tri-state exhaustive on the decision detail
    mirrors: ADR-033, ADR-044 D6, E-S9-01
    description: >
      The decision detail renders ChainIntegrityChip from the API's
      chain_verified field with all three states distinct: true (single-row
      hash recompute matches), false (content altered since insert -- danger
      tone plus the truncated prev/current hash pair for the forensic
      trail), and null/legacy (pre-Sprint-9 row -- renders "pre-chain",
      NEVER "verified"). The full chain walk remains `synapse audit
      verify`'s job.
    implementations:
      - frontend/src/design-system/compounds/ChainIntegrityChip.tsx
      - frontend/src/surfaces/decision-theater/DecisionDetail.tsx
      - api/routers/decisions.py
    tests:
      - frontend/src/design-system/compounds/__tests__/DecisionAnatomy.test.tsx
      - api/tests/test_decisions_table.py
    status: enforced

  - id: FE-INV-040
    title: Animation is never the sole information channel
    mirrors: INV-CLR-011, INV-CLR-013, ADR-044
    description: >
      Every animated state (the acting pulse, the synthetic demo-pulse, the
      escalation urgent beacon, decision arrival) has a static fallback that
      preserves the information when prefers-reduced-motion zeroes the
      motion tokens: process states carry a STATUS WORD + data-process-state
      attribute, the synthetic badge keeps its dashed ring + label, pending
      escalations read from sort order + the queue count. Motion explains
      causality and urgency-as-frequency (urgent = half the ambient breath)
      but a frozen frame loses nothing.
    implementations:
      - frontend/src/design-system/compounds/CouncilStrip.tsx
      - frontend/src/design-system/compounds/SyntheticBadge.tsx
      - frontend/src/surfaces/override-cockpit/EscalationQueue.tsx
      - frontend/src/styles/tokens.css
      - frontend/tailwind.config.ts
    tests:
      - frontend/src/design-system/compounds/__tests__/MotionGrammar.test.tsx
    status: enforced

  - id: FE-INV-041
    title: Outcome is tri-state honest; unknown is never rendered as confirmed
    mirrors: ADR-047, I-7, FE-INV-039
    description: >
      The Standing Watch calibration panel and the decision-detail Outcome
      section render outcomes as exactly three distinct states — confirmed,
      diverged, and unknown — where `unknown` (not yet realized / no evidence)
      carries the chroma-drained honesty marker and is NEVER folded into
      confirmed. The tri-state mix is derived by the tested pure helper
      (`outcomeMix`), which clamps confirmed to the scored total so rounding can
      never imply more confirmations than there were scored decisions. Mirrors
      the chain-integrity tri-state discipline (FE-INV-039).
    implementations:
      - frontend/src/surfaces/operations/logic.ts
      - frontend/src/surfaces/operations/CalibrationPanel.tsx
      - frontend/src/surfaces/decision-theater/DecisionDetail.tsx
    tests:
      - frontend/src/surfaces/operations/__tests__/logic.test.ts
    status: enforced

  - id: FE-INV-042
    title: SLO burn shows fast+slow windows and degrades to "burn unknown", never silent-green
    mirrors: ADR-047, FE-INV-035
    description: >
      The SLO burn board renders BOTH the fast (1h) and slow (6h) burn for every
      tier, with an explicit severity word (healthy / burning / critical /
      burn unknown). When Prometheus is unreachable (source "unknown") or a
      window is null, the tile reads "burn unknown" with a drained track — it
      NEVER renders a healthy green bar or a fabricated 0, mirroring the
      DegradedBanner's "posture unknown" honesty (FE-INV-035).
    implementations:
      - frontend/src/surfaces/operations/SloBurnBoard.tsx
      - frontend/src/hooks/use-slo.ts
      - api/routers/system.py
    tests:
      - frontend/src/surfaces/operations/__tests__/SloBurnBoard.test.tsx
      - api/tests/test_system_slo.py
    status: enforced

  - id: FE-INV-043
    title: Calibration always discloses sample size, horizon, and "as of"
    mirrors: ADR-047, I-7
    description: >
      The calibration panel ALWAYS shows n (scored + unknown), the window, and
      the as_of timestamp, and flags a thin sample as provisional — there is no
      reliability curve without statistical-power disclosure. An all-empty curve
      says "awaiting scored outcomes" rather than drawing a flat confident line;
      a null Brier renders as "—", never 0. The backend returns null (not 0) for
      a Brier with no scored evidence.
    implementations:
      - frontend/src/surfaces/operations/CalibrationPanel.tsx
      - frontend/src/surfaces/operations/ReliabilityCurve.tsx
      - api/routers/system.py
    tests:
      - frontend/src/surfaces/operations/__tests__/ReliabilityCurve.test.tsx
      - api/tests/test_system_calibration.py
    status: enforced

  - id: FE-INV-044
    title: Supervisory aggregates segment synthetic from real, labelled
    mirrors: ADR-047, ADR-044 D5, FE-INV-036
    description: >
      Every Standing Watch aggregate (calibration, confidence distribution)
      excludes is_synthetic decisions by default and exposes a labelled toggle
      to include them — demo pulses from the traffic generator never silently
      launder the trust read. The segmentation is the tested pure helper
      (`confidenceSamples`); the calibration endpoint defaults
      include_synthetic=false.
    implementations:
      - frontend/src/surfaces/operations/logic.ts
      - frontend/src/surfaces/operations/ConfidenceDistribution.tsx
      - api/routers/system.py
    tests:
      - frontend/src/surfaces/operations/__tests__/logic.test.ts
      - api/tests/test_system_calibration.py
    status: enforced

  - id: FE-INV-045
    title: Council Theater renders only recorded phases; nothing is fabricated
    mirrors: I-7, ADR-040, ADR-051, FE-INV-009, FE-INV-028
    description: >
      The Council Theater choreography reconstructs ONE recorded decision row
      via the pure `replayDecision` slicer — the auto-advance drives only the
      phase index, never the slice (FE-INV-028). A phase the row did not record
      renders an explicit honest state: a `debate_rounds === 0` decision shows
      "no debate — fast path" rather than a fabricated transcript, and a null
      `pareto_front` shows the empty-front state. The shared `reshapeDecision`
      boundary (hooks/use-decision) defaults the anatomy honestly so the
      analyst detail and the cinematic reconstruction can never drift.
    implementations:
      - frontend/src/design-system/compounds/ConsensusChoreography.tsx
      - frontend/src/hooks/use-decision.ts
      - frontend/src/lib/replay.ts
    tests:
      - frontend/src/design-system/compounds/__tests__/ConsensusChoreography.test.tsx
      - frontend/src/hooks/__tests__/use-decision.test.ts
    status: enforced

  - id: FE-INV-046
    title: Choreography degrades to a static all-phase reveal under reduced motion
    mirrors: INV-CLR-011, ADR-044, FE-INV-040
    description: >
      With prefers-reduced-motion the ConsensusChoreography drops the
      auto-narration entirely and reveals every recorded phase at once,
      statically, with each state carried by text (phase name, agent label,
      confidence %, "recorded" status) — never motion or colour alone. The
      transport controls (play/pause/scrub) are absent and an aria-live region
      narrates phase changes in the motion path. Parity with FE-INV-040.
    implementations:
      - frontend/src/design-system/compounds/ConsensusChoreography.tsx
    tests:
      - frontend/src/design-system/compounds/__tests__/ConsensusChoreography.test.tsx
    status: enforced

  - id: FE-INV-047
    title: Council Theater is a labelled recorded reconstruction, never live
    mirrors: ADR-044 D5, ADR-051, FE-INV-036, I-7
    description: >
      The Council Theater surface and the choreography are labelled a RECORDED
      RECONSTRUCTION (never "live") — the live cognition channel is the deferred
      ADR-051 follow-up. A synthetic decision (is_synthetic) always carries the
      SyntheticBadge, and the scored outcome renders the ADR-047 tri-state where
      `unknown` is never shown as confirmed. The surface never shows a silent
      empty stage: loading, error, and not-found are explicit states.
    implementations:
      - frontend/src/surfaces/council-theater/CouncilTheater.tsx
      - frontend/src/design-system/compounds/ConsensusChoreography.tsx
    tests:
      - frontend/src/design-system/compounds/__tests__/ConsensusChoreography.test.tsx
      - frontend/src/surfaces/council-theater/__tests__/CouncilTheater.test.tsx
    status: enforced

  - id: FE-INV-048
    title: Live council cognition is derived only from real events, never shown stale
    mirrors: ADR-051, INV-CLR-017, I-7, FE-INV-040
    description: >
      The CouncilStrip renders live per-agent cognition (thinking / debating /
      acting) ONLY from the real `cognition` firehose channel (the orchestrator's
      FSM phase events), via the pure `deriveLiveCognition` helper. The derivation
      returns null when the stream is stale (no event within the window) so a quiet
      council is never painted "live"; the arbitrating/learning phases invent no
      per-agent state (health fallback). Every live state carries a STATUS WORD so
      it survives colour-blindness and reduced motion (INV-CLR-011), reusing the
      FROZEN factor.agentstate chroma factors (INV-CLR-017) — no new tokens, the
      chromatic dist is byte-unchanged. The cognition event schema rejects unknown
      phases (no fabricated cognition state).
    implementations:
      - frontend/src/lib/cognition.ts
      - frontend/src/domain/cognition-event.ts
      - frontend/src/design-system/compounds/CouncilStrip.tsx
      - frontend/src/surfaces/mission-control/CortexBanner.tsx
    tests:
      - frontend/src/lib/__tests__/cognition.test.ts
      - frontend/src/domain/__tests__/cognition-event.test.ts
      - frontend/src/design-system/compounds/__tests__/CouncilStrip.test.tsx
    status: enforced
