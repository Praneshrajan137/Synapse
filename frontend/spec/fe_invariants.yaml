    mirrors: Req 10, INV-CLR-017, FE-INV-025
    description: >
      In the Playwright browser a Spatial_Visualization initializes its WebGL
      context and renders without throwing (a WebGL smoke check), and encodes
      agent/tier/confidence data with the same Chromatic_Token encoding as the
      rest of the Console, verified against resolved token values in a real
      browser rather than jsdom (Req 10.1, 10.2). A WebGL init failure renders the
      error Universal_State with a retry affordance (never a blank canvas) and a
      keyboard/SR-reachable non-spatial equivalent is provided (Req 10.3, 10.4).
    implementations:
      - frontend/src/surfaces/mission-control/LivingMap.tsx
      - frontend/src/surfaces/twin-lab/SupplyNetworkGraph.tsx
      - frontend/src/design-system/compounds/SpatialErrorBoundary.tsx
    tests:
      - frontend/tests/e2e/spatial-visualization.spec.ts
    status: enforced

  - id: FE-INV-064
    title: Trust_Track_Record is tri-state honest and never fabricates outcomes
    mirrors: Req 11, ADR-047, FE-INV-041
    description: >
      The Trust_Track_Record aggregates the authenticated operator's past
      judgments and realized outcomes over a window, rendering confirmed,
      diverged, and unknown as three distinct states — `unknown` is never folded
      into confirmed (Req 11.2, 11.3). It discloses its sample size, window, and
      "as of" timestamp, flags a thin sample as provisional, renders "awaiting
      scored outcomes" when none exist rather than a fabricated/zeroed record, and
      excludes Synthetic decisions by default behind a labelled toggle (Req 11.4,
      11.5, 11.6).
    implementations:
      - frontend/src/lib/trust-track-record.ts
      - frontend/src/surfaces/operations/TrustTrackRecord.tsx
    tests:
      - frontend/src/lib/__tests__/trust-track-record.property.test.ts
    status: enforced

  - id: FE-INV-065
    title: Expected_Review_Value ranks review need by stakes and degrades honestly
    mirrors: Req 12, FE-INV-007, FE-INV-052
    description: >
      The Atlas_Console computes Expected_Review_Value as f(confidence,
      reversibility, blast_radius) and ranks a decision's need for human review by
      that value rather than confidence alone; an irreversible or high-blast
      decision escalates even at or above the 0.80 autonomy gate, and default
      override focus is derived from ERV (Req 12.1, 12.2, 12.3). When the contract
      omits reversibility/blast_radius (a Cross_Boundary_Dependency) ERV falls
      back to confidence-only, flags the fields unavailable, and records the gap
      rather than fabricating a value (Req 12.5, 12.6).
    implementations:
      - frontend/src/lib/expected-review-value.ts
    tests:
      - frontend/src/lib/__tests__/expected-review-value.property.test.ts
    status: enforced

  - id: FE-INV-066
    title: Interruption_Precision is computed as the North-Star metric and gated by the ratchet
    mirrors: Req 13, FE-INV-057
    description: >
      Interruption_Precision — warranted interruptions ÷ total interruptions over
      the window — is computed over the seeded scenarios and recorded in the
      Effectiveness_Scorecard as the primary (North-Star) metric; total === 0
      yields null rather than a fabricated value (Req 13.1, 13.2, 13.4). The
      Effectiveness_Ratchet fails and names Interruption_Precision when it
      regresses below its committed baseline beyond tolerance (Req 13.3), and the
      harness states it is a Scripted_Proxy requiring real-operator validation
      (Req 13.5).
    implementations:
      - frontend/src/lib/interruption-precision.ts
    tests:
      - frontend/src/lib/__tests__/interruption-precision.property.test.ts
    status: enforced

  - id: FE-INV-067
    title: Visual_Regression_Gate diffs deterministic screenshots against a committed baseline
    mirrors: Req 14, FE-INV-001
    description: >
      The Visual_Regression_Gate captures deterministic screenshots of key
      Surfaces/stories under fixed viewport, theme, and seed (fixed fonts,
      disabled animation, masked volatile regions) and fails the check identifying
      the changed Surface when a screenshot differs from its committed baseline
      beyond the defined threshold (Req 14.1, 14.2, 14.3). It covers at least one
      Surface per theme-sensitive mode (light, dark, hc), permits an approved
      baseline advance, and uses only $0-cost / OSS tooling (Req 14.4, 14.5,
      14.6).
    implementations:
      - frontend/tests/e2e/visual/visual-regression.spec.ts
      - frontend/playwright.config.ts
    tests:
      - frontend/tests/e2e/visual/visual-regression.spec.ts
    status: enforced

  - id: FE-INV-068
    title: Assistive-technology and Mobile_Reality flows prove non-visual and constrained-device operability
    mirrors: Req 15, FE-INV-011, FE-INV-010
    description: >
      An Assistive_Tech_Flow scripts a screen-reader walkthrough of resolving a
      live escalation in the Override Cockpit, asserting the operator can perceive
      the escalation, its violations, and the action outcome non-visually via an
      appropriate live region (Req 15.1, 15.2). Key Surfaces pass under the
      Mobile_Reality_Profile (360px, touch, throttled 3G) with all primary
      Jobs-To-Be-Done reachable and within the Web_Vitals_Budget, and Lighthouse
      CI is extended to a mobile profile that fails below its budget (Req 15.3,
      15.4, 15.5); the scripted-proxy ceiling is stated (Req 15.6).
    implementations:
      - frontend/tests/e2e/a11y/assistive-tech-flow.spec.ts
      - frontend/tests/e2e/mobile-reality.spec.ts
      - frontend/lighthouserc.mobile.json
    tests:
      - frontend/tests/e2e/a11y/assistive-tech-flow.spec.ts
      - frontend/tests/e2e/mobile-reality.spec.ts
    status: enforced

  - id: FE-INV-069
    title: Contract-drift gate closes — every schema-less capability is classified, never left red
    mirrors: Req 16, FE-INV-049, FE-INV-002
    description: >
      The Contract_Fidelity_Suite resolves each schema-less Backend_Contract
      capability to exactly one of two classifications — "no-body/open-shape ⇒
      covered" or "tracked-partial" (with a named rationale) — so the drift gate
      reaches green for the entitled surface rather than staying permanently red
      (Req 16.1–16.4). A new schema-less capability that is neither classified nor
      entitled-out-of-scope fails the suite and is named so the classification
      decision is forced rather than silently absorbed (Req 16.5).
    implementations:
      - frontend/spec/contract-fidelity/schema-less.ts
    tests:
      - frontend/spec/contract-fidelity/__tests__/schema-less.property.test.ts
    status: enforced

  - id: FE-INV-070
    title: Operations uplift slot renders honestly and never fabricates an uplift value
    mirrors: Req 17, FE-INV-035, FE-INV-043
    description: >
      The Operations Surface reserves a defined slot for a system-level uplift
      display. When the Backend_Contract exposes an uplift measure the pure
      resolveUpliftSlot renders it with sample size, window, and "as of" timestamp
      (Req 17.1, 17.2); when no measure is provided (a Cross_Boundary_Dependency)
      the slot renders "awaiting uplift measure" and records the missing
      capability as a backend gap rather than hiding the slot or fabricating a
      value (Req 17.3, 17.4).
    implementations:
      - frontend/src/lib/uplift-slot.ts
      - frontend/src/surfaces/operations/UpliftSlot.tsx
    tests:
      - frontend/src/lib/__tests__/uplift-slot.test.ts
    status: enforced

  - id: FE-INV-071
    title: No legacy JavaScript remains under src/theme
    mirrors: Req 19, FE-INV-013
    description: >
      The legacy `src/theme/*.js` files (`agents.js`, `useTheme.js`) are audited
      as dead (no live import path) and removed, so `src/theme/` contains no `.js`
      file and the tree passes `tsc --noEmit` under strict settings (Req 19.2,
      19.4). The guarantee is the absence itself; a vitest guard recursively walks
      `src/theme/` and fails if any `.js`/`.jsx` file ever reappears, making the
      retirement mechanically enforced rather than asserted by inspection.
    implementations:
      - frontend/src/theme/__tests__/no-legacy-js.test.ts
    tests:
      - frontend/src/theme/__tests__/no-legacy-js.test.ts
    status: enforced
